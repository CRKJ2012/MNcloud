<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>牦牛音乐</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, sans-serif; }
    body { background:#f5f3f0; padding-bottom:80px; }
    .header { background:#1a1a2e; color:#fff; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10; }
    .logo { font-size:20px; font-weight:700; }
    .logo span { color:#f5c842; }
    .download-btn { background:#f5c842; color:#1a1a2e; padding:6px 16px; border-radius:20px; font-weight:600; border:none; cursor:pointer; font-size:14px; }
    .container { max-width:480px; margin:auto; padding:12px 16px; }
    .section-title { font-size:18px; font-weight:600; margin:16px 0 10px; display:flex; justify-content:space-between; align-items:center; }
    .btn-small { background:#1a1a2e; color:#fff; padding:4px 16px; border-radius:30px; border:none; cursor:pointer; font-size:13px; }
    .btn-small:active { transform:scale(0.95); }
    .playlist-scroll { display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; -webkit-overflow-scrolling:touch; }
    .playlist-card { flex:0 0 140px; background:#fff; border-radius:16px; padding:14px; box-shadow:0 2px 8px rgba(0,0,0,0.06); cursor:pointer; text-align:center; }
    .playlist-card:active { transform:scale(0.96); }
    .playlist-card .cover { width:100%; aspect-ratio:1; background:linear-gradient(135deg,#1a1a2e,#16213e); border-radius:12px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:28px; margin-bottom:6px; }
    .playlist-card .name { font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .playlist-card .count { font-size:12px; color:#888; }
    .song-list { list-style:none; margin:6px 0; }
    .song-item { display:flex; align-items:center; padding:12px 14px; background:#fff; border-radius:12px; margin-bottom:6px; gap:12px; cursor:pointer; transition:background 0.15s; }
    .song-item:active { background:#f0edea; }
    .song-item .index { width:24px; text-align:center; color:#aaa; flex-shrink:0; }
    .song-item .info { flex:1; min-width:0; }
    .song-item .info .title { font-weight:500; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .song-item .info .artist { font-size:13px; color:#888; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .song-item .duration { font-size:13px; color:#aaa; flex-shrink:0; }
    .song-item.active { background:#e8e2d8; }
    .song-item.active .index { color:#f5c842; font-weight:bold; }
    .song-item .add-btn { background:#f5c842; color:#1a1a2e; border:none; border-radius:50%; width:28px; height:28px; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .song-item .add-btn:active { transform:scale(0.9); }
    .song-item .remove-btn { background:#e74c3c; color:#fff; border:none; border-radius:50%; width:28px; height:28px; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .song-item .remove-btn:active { transform:scale(0.9); }
    .empty { text-align:center; padding:40px 20px; color:#aaa; }
    .player-bar { position:fixed; bottom:0; left:0; right:0; background:#1a1a2e; color:#fff; padding:10px 16px; display:flex; align-items:center; gap:12px; z-index:20; border-top:1px solid rgba(255,255,255,0.06); }
    .player-bar .info { flex:1; min-width:0; }
    .player-bar .info .title { font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .player-bar .info .artist { font-size:12px; color:#aaa; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .player-bar .controls { display:flex; align-items:center; gap:4px; flex-shrink:0; }
    .player-bar .controls button { width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.08); border:none; color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .player-bar .controls button:active { background:rgba(255,255,255,0.2); }
    .player-bar .controls .play-btn { background:#f5c842; color:#1a1a2e; width:44px; height:44px; font-size:22px; }
    .player-bar .progress-wrap { position:absolute; top:-3px; left:0; right:0; height:3px; background:rgba(255,255,255,0.15); cursor:pointer; }
    .player-bar .progress-wrap .progress { height:100%; width:0%; background:#f5c842; border-radius:0 2px 2px 0; transition:width 0.1s linear; }
    .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:100; display:none; align-items:flex-end; justify-content:center; }
    .modal-overlay.active { display:flex; }
    .modal { background:#fff; width:100%; max-width:480px; max-height:70vh; border-radius:20px 20px 0 0; padding:20px 20px 28px; overflow-y:auto; animation:slideUp 0.3s ease; }
    @keyframes slideUp { from { transform:translateY(40px); opacity:0; } to { transform:translateY(0); opacity:1; } }
    .modal-title { font-size:18px; font-weight:600; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
    .modal-title .close-btn { font-size:24px; color:#aaa; padding:0 4px; background:none; border:none; cursor:pointer; }
    .modal-body .option-item { padding:12px 0; border-bottom:1px solid #f0edea; display:flex; align-items:center; gap:12px; cursor:pointer; }
    .modal-body .option-item:active { background:#f8f6f4; margin:0 -12px; padding:12px; border-radius:8px; }
    .modal-body .option-item:last-child { border-bottom:none; }
    .modal-body .option-item .check { margin-left:auto; color:#f5c842; }
    .create-playlist-form { display:flex; gap:10px; margin:12px 0 8px; }
    .create-playlist-form input { flex:1; padding:10px 14px; border:1px solid #ddd; border-radius:10px; font-size:15px; outline:none; }
    .create-playlist-form input:focus { border-color:#f5c842; }
    .create-playlist-form button { background:#1a1a2e; color:#fff; padding:10px 18px; border-radius:10px; border:none; font-weight:500; cursor:pointer; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🎵 牦牛<span>音乐</span></div>
    <button class="download-btn" id="downloadAppBtn">📲 下载 App</button>
  </div>
  <main class="container" id="app">
    <!-- 歌单区域（用户端可以创建歌单） -->
    <div class="section-title">
      <span>📂 我的歌单</span>
      <button class="btn-small" id="newPlaylistBtn">+ 新建歌单</button>
    </div>
    <div class="playlist-scroll" id="playlistGrid"></div>

    <!-- 歌曲列表 -->
    <div class="section-title">
      <span>🎶 所有歌曲</span>
      <span id="songCount" style="font-size:13px;font-weight:400;color:#888;">0 首</span>
    </div>
    <ul class="song-list" id="songList"></ul>
    <div class="empty" id="emptyState">🎧 暂无歌曲</div>
  </main>

  <!-- 底部播放器 -->
  <div class="player-bar" id="playerBar">
    <div class="progress-wrap" id="progressWrap"><div class="progress" id="progressBar"></div></div>
    <div class="info"><div class="title" id="nowTitle">未播放</div><div class="artist" id="nowArtist">—</div></div>
    <div class="controls">
      <button id="prevBtn">⏮</button>
      <button class="play-btn" id="playBtn">▶</button>
      <button id="nextBtn">⏭</button>
    </div>
  </div>
  <audio id="audioPlayer"></audio>

  <!-- 模态框 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-title"><span id="modalTitle">操作</span><button class="close-btn" id="modalCloseBtn">✕</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
  <script>
    // ----- 配置 Supabase -----
    const SUPABASE_URL = 'https://bifqzwsawtyslzvbnatw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpZnF6d3Nhd3R5c2x6dmJuYXR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyMjg3NDcsImV4cCI6MjA5ODgwNDc0N30.k8lAMHVo0BlCA3xs0kt0C6-dZ_TwglSmoJk2KZHQoKs';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ----- 状态 -----
    const state = { songs: [], playlists: [], currentPlaylistId: null, currentPlaylistSongs: [], currentSongIndex: -1, isPlaying: false, queue: [], queueIndex: -1 };
    const audio = document.getElementById('audioPlayer');
    const songList = document.getElementById('songList');
    const playlistGrid = document.getElementById('playlistGrid');
    const emptyState = document.getElementById('emptyState');
    const songCount = document.getElementById('songCount');
    const nowTitle = document.getElementById('nowTitle');
    const nowArtist = document.getElementById('nowArtist');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressBar = document.getElementById('progressBar');
    const progressWrap = document.getElementById('progressWrap');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const newPlaylistBtn = document.getElementById('newPlaylistBtn');

    // ----- 工具 -----
    function formatDuration(sec) { if (!sec || sec<0) return '0:00'; const m=Math.floor(sec/60); const s=Math.floor(sec%60); return m+':'+(s<10?'0':'')+s; }
    function escapeHtml(t) { if(!t)return ''; const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
    function closeModal() { modalOverlay.classList.remove('active'); }
    function openModal(title, html) { modalTitle.textContent = title; modalBody.innerHTML = html; modalOverlay.classList.add('active'); }
    modalCloseBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

    // ----- 数据加载 -----
    async function loadSongs() { const {data,error}=await supabase.from('songs').select('*').order('created_at',{ascending:false}); if(error)return []; return data||[]; }
    async function loadPlaylists() { const {data,error}=await supabase.from('playlists').select('*').order('created_at'); if(error)return []; return data||[]; }
    async function loadPlaylistSongs(playlistId) {
      const {data,error}=await supabase.from('playlist_songs').select('song_id, songs(*)').eq('playlist_id', playlistId).order('"order"',{ascending:true});
      if(error)return [];
      return data.map(item=>item.songs).filter(Boolean);
    }

    // ----- 渲染 -----
    async function render() {
      const songs = await loadSongs();
      const playlists = await loadPlaylists();
      state.songs = songs;
      state.playlists = playlists;
      renderPlaylists(playlists);
      
      // 如果当前有选中的歌单，显示歌单歌曲，否则显示所有歌曲
      let displaySongs = songs;
      if (state.currentPlaylistId) {
        const playlistSongs = await loadPlaylistSongs(state.currentPlaylistId);
        state.currentPlaylistSongs = playlistSongs;
        displaySongs = playlistSongs;
      }
      renderSongs(displaySongs);
      updatePlayerUI();
      songCount.textContent = (displaySongs || []).length + ' 首';
      if (displaySongs.length === 0) emptyState.style.display = 'block'; else emptyState.style.display = 'none';
    }

    function renderPlaylists(playlists) {
      if (playlists.length === 0) { playlistGrid.innerHTML = '<div style="flex:0 0 auto;color:#aaa;padding:8px 0;">暂无歌单，点击「新建歌单」</div>'; return; }
      playlistGrid.innerHTML = playlists.map(p => `
        <div class="playlist-card" data-id="${p.id}">
          <div class="cover">📁</div>
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="count">${p.song_count || 0} 首</div>
        </div>
      `).join('');
      playlistGrid.querySelectorAll('.playlist-card').forEach(el => {
        el.addEventListener('click', async () => {
          const id = el.dataset.id;
          state.currentPlaylistId = id;
          await render();
        });
      });
    }

    function renderSongs(songs) {
      if (!songs || songs.length === 0) { songList.innerHTML = ''; return; }
      // 判断是否在歌单视图中
      const inPlaylist = state.currentPlaylistId !== null;
      
      songList.innerHTML = songs.map((song, idx) => {
        const active = state.currentSongIndex >= 0 && state.songs[state.currentSongIndex] && state.songs[state.currentSongIndex].id === song.id;
        return `<li class="song-item ${active?'active':''}" data-id="${song.id}" data-index="${idx}">
          <span class="index">${active?'▶':(idx+1)}</span>
          <div class="info"><div class="title">${escapeHtml(song.title||'未命名')}</div><div class="artist">${escapeHtml(song.artist||'未知')}</div></div>
          <span class="duration">${formatDuration(song.duration)}</span>
          ${inPlaylist ? `<button class="remove-btn" data-id="${song.id}" data-action="remove">✕</button>` : `<button class="add-btn" data-id="${song.id}" data-action="add">+</button>`}
        </li>`;
      }).join('');

      // 点击歌曲播放
      songList.querySelectorAll('.song-item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('button')) return;
          const id = el.dataset.id;
          const idx = state.songs.findIndex(s => s.id === id);
          if (idx >= 0) playSong(idx);
        });
      });

      // 添加/移除按钮
      songList.querySelectorAll('[data-action="add"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const songId = btn.dataset.id;
          showAddToPlaylist(songId);
        });
      });
      songList.querySelectorAll('[data-action="remove"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const songId = btn.dataset.id;
          if (state.currentPlaylistId) {
            removeSongFromPlaylist(songId, state.currentPlaylistId);
          }
        });
      });
    }

    function updatePlayerUI() {
      const song = state.currentSongIndex >= 0 && state.currentSongIndex < state.songs.length ? state.songs[state.currentSongIndex] : null;
      if (song) { nowTitle.textContent = song.title || '未命名'; nowArtist.textContent = song.artist || '—'; } else { nowTitle.textContent = '未播放'; nowArtist.textContent = '—'; }
      playBtn.textContent = state.isPlaying ? '⏸' : '▶';
    }

    // ----- 播放控制 -----
    function playSong(index) {
      if (index < 0 || index >= state.songs.length) return;
      const song = state.songs[index];
      if (!song || !song.file_url) { alert('歌曲文件不存在'); return; }
      state.currentSongIndex = index;
      state.queue = state.songs.map(s => s.id);
      state.queueIndex = index;
      audio.src = song.file_url;
      audio.load();
      audio.play().catch(() => alert('播放失败'));
      state.isPlaying = true;
      updatePlayerUI();
      render();
    }

    function togglePlay() {
      if (state.currentSongIndex < 0) { if (state.songs.length>0) playSong(0); else alert('暂无歌曲'); return; }
      if (state.isPlaying) { audio.pause(); state.isPlaying = false; } else { audio.play().catch(() => alert('播放失败')); state.isPlaying = true; }
      updatePlayerUI();
    }

    function prevSong() { if (state.queue.length===0) return; let idx = state.queueIndex - 1; if (idx<0) idx = state.queue.length-1; const id = state.queue[idx]; const si = state.songs.findIndex(s=>s.id===id); if(si>=0) playSong(si); }
    function nextSong() { if (state.queue.length===0) return; let idx = state.queueIndex + 1; if (idx>=state.queue.length) idx=0; const id = state.queue[idx]; const si = state.songs.findIndex(s=>s.id===id); if(si>=0) playSong(si); }

    audio.addEventListener('play', ()=>{ state.isPlaying=true; updatePlayerUI(); });
    audio.addEventListener('pause', ()=>{ state.isPlaying=false; updatePlayerUI(); });
    audio.addEventListener('ended', nextSong);
    audio.addEventListener('timeupdate', ()=>{ if(audio.duration) progressBar.style.width = (audio.currentTime/audio.duration*100)+'%'; });
    progressWrap.addEventListener('click', (e)=>{ if(!audio.duration)return; const rect=progressWrap.getBoundingClientRect(); const pct=(e.clientX-rect.left)/rect.width; audio.currentTime=pct*audio.duration; });
    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', prevSong);
    nextBtn.addEventListener('click', nextSong);

    // ----- 歌单操作（只在用户端） -----
    // 创建歌单
    newPlaylistBtn.addEventListener('click', () => {
      const html = `
        <div style="margin-bottom:8px;color:#888;">输入歌单名称</div>
        <div class="create-playlist-form">
          <input type="text" id="newPlaylistInput" placeholder="例如：我的最爱" maxlength="30" />
          <button id="confirmCreatePlaylist">创建</button>
        </div>
      `;
      openModal('新建歌单', html);
      const input = document.getElementById('newPlaylistInput');
      const confirmBtn = document.getElementById('confirmCreatePlaylist');
      input.focus();
      confirmBtn.addEventListener('click', async () => {
        const name = input.value.trim();
        if (!name) { alert('请输入歌单名称'); return; }
        const { error } = await supabase.from('playlists').insert({ name });
        if (error) { alert('创建失败：' + error.message); return; }
        closeModal();
        await render();
      });
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') confirmBtn.click(); });
    });

    // 添加到歌单
    async function showAddToPlaylist(songId) {
      const playlists = await loadPlaylists();
      if (playlists.length === 0) { alert('请先创建歌单！'); return; }
      // 检查已添加的歌单
      const { data: existing } = await supabase.from('playlist_songs').select('playlist_id').eq('song_id', songId);
      const existingIds = existing ? existing.map(e => e.playlist_id) : [];

      let html = `<div style="margin-bottom:12px;color:#888;font-size:14px;">选择要添加到的歌单：</div>`;
      html += playlists.map(p => `
        <div class="option-item" data-id="${p.id}" style="${existingIds.includes(p.id) ? 'opacity:0.5;' : ''}">
          <span>📁 ${escapeHtml(p.name)}</span>
          <span class="check">${existingIds.includes(p.id) ? '✅ 已添加' : '+'}</span>
        </div>
      `).join('');
      openModal('添加到歌单', html);

      modalBody.querySelectorAll('.option-item').forEach(el => {
        el.addEventListener('click', async () => {
          const pid = el.dataset.id;
          // 检查是否已存在
          const { data: exist } = await supabase.from('playlist_songs').select('id').eq('playlist_id', pid).eq('song_id', songId).maybeSingle();
          if (exist) { alert('歌曲已在歌单中'); closeModal(); return; }
          const { error } = await supabase.from('playlist_songs').insert({ playlist_id: pid, song_id: songId, order: 0 });
          if (error) { alert('添加失败：' + error.message); } else { alert('添加成功！'); }
          closeModal();
          await render();
        });
      });
    }

    // 从歌单移除
    async function removeSongFromPlaylist(songId, playlistId) {
      if (!confirm('从歌单移除这首歌？')) return;
      const { error } = await supabase.from('playlist_songs').delete().eq('playlist_id', playlistId).eq('song_id', songId);
      if (error) { alert('移除失败：' + error.message); return; }
      alert('已从歌单移除');
      await render();
    }

    // ----- 下载按钮 -----
    document.getElementById('downloadAppBtn').addEventListener('click', () => {
      if (window.matchMedia('(display-mode: standalone)').matches) { alert('您已在 App 模式中'); return; }
      alert('请使用浏览器菜单中的「添加到主屏幕」安装 App');
    });

    // ----- 初始化 -----
    render();
  </script>
</body>
</html>
