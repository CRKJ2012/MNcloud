<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>牦牛免费视频 - 自由发布，永不封号</title>
    <style>
        :root {
            --bg: #000;
            --surface: #1a1a2e;
            --primary: #ff6b35;
            --primary-glow: #ff8c5a;
            --text: #fff;
            --text-secondary: #b0b0c0;
            --danger: #ff4444;
            --success: #4caf84;
            --border: #2a2a3e;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --safe-bottom: env(safe-area-inset-bottom, 16px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #000;
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            touch-action: pan-y;
            position: relative;
        }

        /* ============ 启动加载动画 ============ */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s, visibility 0.6s;
        }
        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #splash-screen .logo-anim {
            font-size: 56px;
            animation: pulse-logo 1.2s ease-in-out infinite;
        }
        #splash-screen .logo-text {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b35, #ff9a6c, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: 12px;
            letter-spacing: 3px;
        }
        #splash-screen .slogan {
            color: #888;
            font-size: 13px;
            margin-top: 8px;
            letter-spacing: 2px;
        }
        @keyframes pulse-logo {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }

        /* ============ 登录/注册面板 ============ */
        #auth-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s, visibility 0.4s;
        }
        #auth-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #auth-panel {
            background: var(--surface);
            border-radius: 20px;
            padding: 32px 24px;
            width: 90%;
            max-width: 400px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        #auth-panel .panel-icon {
            font-size: 52px;
            margin-bottom: 8px;
        }
        #auth-panel h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        #auth-panel .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        #auth-panel .tab-switch {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            background: #111;
            border-radius: 30px;
            padding: 4px;
            position: relative;
        }
        #auth-panel .tab-switch button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 28px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: var(--transition);
            background: transparent;
            color: #888;
            position: relative;
            z-index: 1;
        }
        #auth-panel .tab-switch button.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.4);
        }
        #auth-panel .input-group {
            margin-bottom: 14px;
            text-align: left;
        }
        #auth-panel .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        #auth-panel .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            background: #111;
            color: #fff;
            font-size: 15px;
            transition: var(--transition);
            outline: none;
            font-family: inherit;
        }
        #auth-panel .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1);
        }
        #auth-panel .input-group .hint {
            font-size: 10px;
            color: #666;
            margin-top: 3px;
        }
        #auth-panel .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ff6b35, #ff8c5a);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            transition: var(--transition);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.35);
            margin-top: 8px;
        }
        #auth-panel .btn-primary:active {
            transform: scale(0.96);
            box-shadow: 0 3px 10px rgba(255, 107, 53, 0.5);
        }
        #auth-panel .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        #auth-panel .error-msg {
            color: var(--danger);
            font-size: 12px;
            margin-top: 6px;
            min-height: 18px;
            text-align: center;
        }

        /* ============ 主界面 ============ */
        #app-container {
            position: relative;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
        }
        #app-container.hidden {
            display: none;
        }

        /* 顶部栏 */
        #top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0) 100%);
            pointer-events: none;
            transition: opacity 0.4s;
        }
        #top-bar>* {
            pointer-events: auto;
        }
        #top-bar .brand {
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }
        #top-bar .brand span {
            color: var(--primary-glow);
        }
        #top-bar .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #top-bar .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            border: none;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: var(--transition);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        #top-bar .icon-btn:active {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0.9);
        }
        #user-info-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
            transition: var(--transition);
        }
        #user-info-badge:active {
            background: rgba(255, 255, 255, 0.2);
        }
        #user-info-badge .avatar-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px rgba(76, 175, 132, 0.6);
        }

        /* 视频滑动区域 */
        #video-feed {
            position: absolute;
            inset: 0;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        #video-feed::-webkit-scrollbar {
            display: none;
        }

        .video-item {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .video-item video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        .video-item .video-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 16px 90px;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.4) 50%, transparent 100%);
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .video-item .video-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .video-item .video-publisher {
            font-size: 12px;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .video-item .video-publisher .pub-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary);
        }

        /* 右侧操作栏 */
        .video-item .action-bar {
            position: absolute;
            right: 12px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            z-index: 10;
            pointer-events: auto;
        }
        .action-bar .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: var(--transition);
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        .action-bar .action-btn:active {
            transform: scale(0.85);
        }
        .action-bar .action-btn .count {
            font-size: 11px;
            font-weight: 600;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }
        .action-bar .action-btn.liked {
            color: #ff2d55;
            animation: heartBeat 0.5s ease;
        }
        @keyframes heartBeat {
            0%,
            100% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.35);
            }
            60% {
                transform: scale(0.9);
            }
        }

        /* 评论面板 */
        #comment-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 200;
            background: var(--surface);
            border-radius: 20px 20px 0 0;
            padding: 20px 16px;
            max-height: 55vh;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--border);
        }
        #comment-panel.open {
            transform: translateY(0);
        }
        #comment-panel .panel-handle {
            width: 40px;
            height: 5px;
            background: #555;
            border-radius: 3px;
            margin: 0 auto 14px;
            flex-shrink: 0;
        }
        #comment-panel h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            flex-shrink: 0;
        }
        #comment-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 35vh;
        }
        #comment-list .comment-item {
            background: #111;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            color: #ddd;
            border: 1px solid #1e1e30;
        }
        #comment-list .comment-item .comment-user {
            font-weight: 700;
            color: var(--primary-glow);
            font-size: 11px;
            margin-bottom: 3px;
        }
        #comment-list .comment-item .comment-time {
            font-size: 10px;
            color: #666;
            float: right;
        }
        #comment-input-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-shrink: 0;
        }
        #comment-input-row input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 22px;
            border: 2px solid var(--border);
            background: #111;
            color: #fff;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }
        #comment-input-row input:focus {
            border-color: var(--primary);
        }
        #comment-input-row button {
            padding: 10px 18px;
            border-radius: 22px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            transition: var(--transition);
            white-space: nowrap;
        }
        #comment-input-row button:active {
            transform: scale(0.94);
        }

        /* 遮罩 */
        #overlay-bg {
            position: fixed;
            inset: 0;
            z-index: 150;
            background: rgba(0, 0, 0, 0.6);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        #overlay-bg.show {
            opacity: 1;
            visibility: visible;
        }

        /* 上传按钮 */
        #upload-fab {
            position: fixed;
            bottom: 28px;
            bottom: calc(28px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 90;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b35, #ff3d6e);
            border: none;
            cursor: pointer;
            font-size: 28px;
            color: #fff;
            box-shadow: 0 8px 28px rgba(255, 107, 53, 0.5);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #upload-fab:active {
            transform: translateX(-50%) scale(0.88);
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.7);
        }

        /* 上传弹窗 */
        #upload-modal {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s, visibility 0.35s;
        }
        #upload-modal.show {
            opacity: 1;
            visibility: visible;
        }
        #upload-modal .upload-card {
            background: var(--surface);
            border-radius: 20px;
            padding: 28px 20px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        #upload-modal h3 {
            font-size: 20px;
            margin-bottom: 16px;
        }
        #upload-modal input[type="file"] {
            display: none;
        }
        #upload-modal .file-label {
            display: block;
            padding: 40px 20px;
            border: 2px dashed var(--border);
            border-radius: 16px;
            cursor: pointer;
            transition: var(--transition);
            color: #aaa;
            font-size: 14px;
            margin-bottom: 12px;
        }
        #upload-modal .file-label:hover {
            border-color: var(--primary);
            color: #fff;
            background: rgba(255, 107, 53, 0.05);
        }
        #upload-modal .file-label .big-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }
        #upload-modal #video-title-input {
            width: 100%;
            padding: 12px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            background: #111;
            color: #fff;
            font-size: 14px;
            margin-bottom: 10px;
            outline: none;
            font-family: inherit;
        }
        #upload-modal #video-title-input:focus {
            border-color: var(--primary);
        }
        #upload-modal .upload-progress {
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin: 10px 0;
            overflow: hidden;
            display: none;
        }
        #upload-modal .upload-progress .fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
            border-radius: 2px;
        }
        #upload-modal .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        #upload-modal .btn-row button {
            flex: 1;
            padding: 12px;
            border-radius: 25px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition);
        }
        #upload-modal .btn-cancel {
            background: #333;
            color: #fff;
        }
        #upload-modal .btn-upload {
            background: linear-gradient(135deg, #ff6b35, #ff8c5a);
            color: #fff;
        }
        #upload-modal .btn-upload:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #upload-modal .btn-row button:active {
            transform: scale(0.95);
        }

        /* Toast */
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: #333;
            color: #fff;
            padding: 10px 22px;
            border-radius: 22px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s, transform 0.35s;
            white-space: nowrap;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(8px);
        }
        #toast.success {
            background: var(--success);
        }
        #toast.error {
            background: var(--danger);
        }

        /* 下载APP链接 */
        #download-app-link {
            position: fixed;
            bottom: 100px;
            bottom: calc(100px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 85;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: var(--transition);
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #download-app-link:active {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-50%) scale(0.95);
        }
        #download-app-link .dl-icon {
            font-size: 16px;
        }

        /* 空状态 */
        .empty-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #555;
            pointer-events: none;
            z-index: 1;
        }
        .empty-state .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        .empty-state p {
            font-size: 15px;
            font-weight: 600;
        }

        /* 响应式 */
        @media (min-width: 768px) {
            #video-feed {
                max-width: 500px;
                margin: 0 auto;
                left: 0;
                right: 0;
            }
            #top-bar {
                max-width: 500px;
                left: 50%;
                transform: translateX(-50%);
                right: auto;
                width: 100%;
            }
            #upload-fab {
                left: 50%;
            }
            #download-app-link {
                left: 50%;
            }
            .video-item .action-bar {
                right: calc(50% - 230px);
            }
            @media (min-width: 768px) {
                .video-item .action-bar {
                    right: 18px;
                }
            }
        }
    </style>
</head>
<body>

    <!-- ==================== 启动画面 ==================== -->
    <div id="splash-screen">
        <div class="logo-anim">🐂</div>
        <div class="logo-text">牦牛免费视频</div>
        <div class="slogan">自由发布 · 永不封号</div>
    </div>

    <!-- ==================== 登录/注册面板 ==================== -->
    <div id="auth-overlay">
        <div id="auth-panel">
            <div class="panel-icon">🐂</div>
            <h2>牦牛免费视频</h2>
            <p class="subtitle">自由发布，无审核，永不封号</p>
            <div class="tab-switch">
                <button id="tab-login" class="active">登录</button>
                <button id="tab-register">注册</button>
            </div>
            <!-- 登录表单 -->
            <form id="form-login">
                <div class="input-group">
                    <label>🐂 牦牛号</label>
                    <input type="text" id="login-maoniu-id" placeholder="请输入您的牦牛号" autocomplete="username" required>
                </div>
                <div class="input-group">
                    <label>🔒 密码</label>
                    <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password" required>
                </div>
                <p class="error-msg" id="login-error"></p>
                <button type="submit" class="btn-primary" id="btn-login-submit">登 录</button>
            </form>
            <!-- 注册表单 -->
            <form id="form-register" style="display:none;">
                <div class="input-group">
                    <label>🐂 自定义牦牛号</label>
                    <input type="text" id="reg-maoniu-id" placeholder="4-20位字母或数字" maxlength="20" autocomplete="off" required>
                    <span class="hint">牦牛号是您的唯一标识，注册后不可修改</span>
                </div>
                <div class="input-group">
                    <label>🔒 设置密码</label>
                    <input type="password" id="reg-password" placeholder="数字+小写字母，6-20位" maxlength="20" autocomplete="new-password" required>
                    <span class="hint">密码必须包含数字和小写字母，长度6-20位</span>
                </div>
                <div class="input-group">
                    <label>🔒 确认密码</label>
                    <input type="password" id="reg-password-confirm" placeholder="再次输入密码" maxlength="20" autocomplete="new-password" required>
                </div>
                <p class="error-msg" id="reg-error"></p>
                <button type="submit" class="btn-primary" id="btn-reg-submit">注 册</button>
            </form>
        </div>
    </div>

    <!-- ==================== 主界面 ==================== -->
    <div id="app-container" class="hidden">
        <!-- 顶部栏 -->
        <div id="top-bar">
            <div class="brand">🐂牦牛<span>视频</span></div>
            <div class="header-actions">
                <div id="user-info-badge" title="当前用户">
                    <span class="avatar-dot"></span>
                    <span id="current-user-display">---</span>
                </div>
                <button class="icon-btn" id="btn-logout" title="退出登录">↪</button>
            </div>
        </div>

        <!-- 视频滑动区域 -->
        <div id="video-feed">
            <div class="empty-state" id="empty-state">
                <div class="empty-icon">📹</div>
                <p>还没有视频</p>
                <p style="font-size:12px;color:#444;">点击下方 + 发布第一个视频吧！</p>
            </div>
        </div>

        <!-- 发布按钮 -->
        <button id="upload-fab" title="发布视频">＋</button>

        <!-- 下载APP链接 -->
        <a id="download-app-link" href="#" title="下载牦牛视频APP（即将推出）">
            <span class="dl-icon">📱</span> 下载APP
        </a>
    </div>

    <!-- ==================== 评论面板 ==================== -->
    <div id="overlay-bg"></div>
    <div id="comment-panel">
        <div class="panel-handle"></div>
        <h3>💬 评论</h3>
        <div id="comment-list"></div>
        <div class="comment-input-row">
            <input type="text" id="comment-input" placeholder="说点什么..." maxlength="200">
            <button id="btn-send-comment">发送</button>
        </div>
    </div>

    <!-- ==================== 上传弹窗 ==================== -->
    <div id="upload-modal">
        <div class="upload-card">
            <h3>📤 发布视频</h3>
            <label class="file-label" for="video-file-input">
                <span class="big-icon">🎬</span>
                点击选择视频文件
                <br><small style="color:#666;">支持 MP4 / MOV / WebM，最大200MB</small>
            </label>
            <input type="file" id="video-file-input" accept="video/*">
            <input type="text" id="video-title-input" placeholder="给视频起个标题（可选）" maxlength="60">
            <div class="upload-progress" id="upload-progress-bar">
                <div class="fill" id="upload-progress-fill"></div>
            </div>
            <p style="font-size:11px;color:#888;margin:4px 0;">🟢 发布自由，无需审核，即时上线</p>
            <div class="btn-row">
                <button class="btn-cancel" id="btn-cancel-upload">取消</button>
                <button class="btn-upload" id="btn-confirm-upload" disabled>发布视频</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <!-- ==================== Socket.io 客户端 ==================== -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // ==================== 全局状态 ====================
        const STATE = {
            currentUser: null, // { id, maoniu_id }
            videos: [], // 视频列表
            currentVideoIndex: 0,
            activeVideoElement: null,
            currentCommentVideoId: null,
            socket: null,
            selectedVideoFile: null,
            isLoading: false,
        };

        // ==================== DOM引用 ====================
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const splashScreen = $('#splash-screen');
        const authOverlay = $('#auth-overlay');
        const appContainer = $('#app-container');
        const videoFeed = $('#video-feed');
        const emptyState = $('#empty-state');
        const commentPanel = $('#comment-panel');
        const overlayBg = $('#overlay-bg');
        const commentList = $('#comment-list');
        const commentInput = $('#comment-input');
        const uploadModal = $('#upload-modal');
        const uploadProgressBar = $('#upload-progress-bar');
        const uploadProgressFill = $('#upload-progress-fill');
        const toast = $('#toast');
        const currentUserDisplay = $('#current-user-display');
        const downloadAppLink = $('#download-app-link');

        // 表单
        const formLogin = $('#form-login');
        const formRegister = $('#form-register');
        const tabLogin = $('#tab-login');
        const tabRegister = $('#tab-register');

        // ==================== 工具函数 ====================
        function showToast(msg, type = '') {
            toast.textContent = msg;
            toast.className = type + ' show';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        function formatTime(isoString) {
            const d = new Date(isoString);
            const now = new Date();
            const diff = now - d;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
            return d.toLocaleDateString('zh-CN');
        }

        function formatCount(n) {
            if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
            return n.toString();
        }

        // ==================== Toast ====================
        function showToast(msg, type = '') {
            toast.textContent = msg;
            toast.className = type + ' show';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        // ==================== Socket.io ====================
        function initSocket() {
            STATE.socket = io({
                transports: ['websocket', 'polling'],
                reconnection: true,
                reconnectionDelay: 1000,
                reconnectionAttempts: 20,
            });

            STATE.socket.on('connect', () => {
                console.log('🔗 Socket已连接:', STATE.socket.id);
                if (STATE.currentUser) {
                    STATE.socket.emit('user:online', { user_id: STATE.currentUser.id, maoniu_id: STATE
                            .currentUser.maoniu_id });
                }
            });

            STATE.socket.on('video:new', (data) => {
                console.log('📢 新视频通知:', data);
                showToast('🆕 有新视频发布！刷新看看吧', 'success');
                // 将新视频插入到列表最前面
                if (data.video && !STATE.videos.find(v => v.id === data.video.id)) {
                    STATE.videos.unshift(data.video);
                    renderVideoFeed();
                    // 滚动到顶部
                    videoFeed.scrollTop = 0;
                }
            });

            STATE.socket.on('video:liked', (data) => {
                // 实时更新点赞数
                const vid = STATE.videos.find(v => v.id === data.video_id);
                if (vid) {
                    vid.likes = data.likes;
                    updateActionBarForVideo(vid);
                }
            });

            STATE.socket.on('video:comment', (data) => {
                // 如果当前评论面板正打开着该视频，实时添加评论
                if (STATE.currentCommentVideoId === data.video_id) {
                    appendCommentItem(data.comment);
                }
                const vid = STATE.videos.find(v => v.id === data.video_id);
                if (vid) {
                    vid.comments_count = (vid.comments_count || 0) + 1;
                    updateActionBarForVideo(vid);
                }
            });

            STATE.socket.on('disconnect', () => {
                console.log('🔌 Socket断开');
            });
        }

        function updateActionBarForVideo(vid) {
            // 更新DOM中对应视频的操作栏
            const allItems = $$('.video-item');
            allItems.forEach(item => {
                const vidId = parseInt(item.dataset.videoId);
                if (vidId === vid.id) {
                    const likeBtn = item.querySelector('.action-btn.like-btn');
                    const commentBtn = item.querySelector('.action-btn.comment-btn');
                    if (likeBtn) {
                        likeBtn.querySelector('.count').textContent = formatCount(vid.likes || 0);
                    }
                    if (commentBtn) {
                        commentBtn.querySelector('.count').textContent = formatCount(vid.comments_count || 0);
                    }
                }
            });
        }

        function appendCommentItem(comment) {
            const div = document.createElement('div');
            div.className = 'comment-item';
            div.innerHTML = `
                <span class="comment-user">🐂 ${escapeHtml(comment.maoniu_id || '未知')}</span>
                <span class="comment-time">${formatTime(comment.created_at)}</span>
                <p style="margin-top:4px;">${escapeHtml(comment.content)}</p>
            `;
            commentList.appendChild(div);
            commentList.scrollTop = commentList.scrollHeight;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ==================== 认证 ====================
        async function apiCall(url, method = 'GET', body = null) {
            const opts = {
                method,
                headers: { 'Content-Type': 'application/json' },
            };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(url, opts);
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || '请求失败');
            return data;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const maoniuId = $('#login-maoniu-id').value.trim();
            const password = $('#login-password').value;
            $('#login-error').textContent = '';
            if (!maoniuId || !password) {
                $('#login-error').textContent = '请填写牦牛号和密码';
                return;
            }
            try {
                const data = await apiCall('/api/login', 'POST', { maoniu_id: maoniuId, password });
                STATE.currentUser = data.user;
                onLoginSuccess();
            } catch (err) {
                $('#login-error').textContent = err.message;
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const maoniuId = $('#reg-maoniu-id').value.trim();
            const password = $('#reg-password').value;
            const passwordConfirm = $('#reg-password-confirm').value;
            $('#reg-error').textContent = '';

            if (!maoniuId || maoniuId.length < 4) {
                $('#reg-error').textContent = '牦牛号至少4位';
                return;
            }
            if (!/^[a-zA-Z0-9_]+$/.test(maoniuId)) {
                $('#reg-error').textContent = '牦牛号只能包含字母、数字和下划线';
                return;
            }
            if (!/^(?=.*[0-9])(?=.*[a-z])[0-9a-z]{6,20}$/.test(password)) {
                $('#reg-error').textContent = '密码必须6-20位，且同时包含数字和小写字母';
                return;
            }
            if (password !== passwordConfirm) {
                $('#reg-error').textContent = '两次密码输入不一致';
                return;
            }
            try {
                const data = await apiCall('/api/register', 'POST', { maoniu_id: maoniuId, password });
                STATE.currentUser = data.user;
                onLoginSuccess();
                showToast('🎉 注册成功！欢迎来到牦牛视频', 'success');
            } catch (err) {
                $('#reg-error').textContent = err.message;
            }
        }

        function onLoginSuccess() {
            authOverlay.classList.add('hidden');
            appContainer.classList.remove('hidden');
            currentUserDisplay.textContent = STATE.currentUser.maoniu_id;
            // 初始化socket
            if (!STATE.socket || !STATE.socket.connected) {
                initSocket();
            } else {
                STATE.socket.emit('user:online', { user_id: STATE.currentUser.id, maoniu_id: STATE.currentUser
                        .maoniu_id });
            }
            // 加载视频
            loadVideos();
            // 清空表单
            $('#login-maoniu-id').value = '';
            $('#login-password').value = '';
            $('#reg-maoniu-id').value = '';
            $('#reg-password').value = '';
            $('#reg-password-confirm').value = '';
        }

        function handleLogout() {
            if (confirm('确定要退出登录吗？')) {
                STATE.currentUser = null;
                STATE.videos = [];
                STATE.currentVideoIndex = 0;
                STATE.activeVideoElement = null;
                STATE.currentCommentVideoId = null;
                appContainer.classList.add('hidden');
                authOverlay.classList.remove('hidden');
                videoFeed.innerHTML = `
                    <div class="empty-state" id="empty-state">
                        <div class="empty-icon">📹</div><p>还没有视频</p>
                        <p style="font-size:12px;color:#444;">点击下方 + 发布第一个视频吧！</p>
                    </div>`;
                commentPanel.classList.remove('open');
                overlayBg.classList.remove('show');
                currentUserDisplay.textContent = '---';
                if (STATE.socket) {
                    STATE.socket.disconnect();
                    STATE.socket = null;
                }
                showToast('已退出登录');
            }
        }

        // ==================== 视频列表 ====================
        async function loadVideos() {
            try {
                const data = await apiCall('/api/videos?limit=50');
                STATE.videos = data.videos || [];
                renderVideoFeed();
                if (STATE.videos.length === 0) {
                    if (emptyState) emptyState.style.display = 'flex';
                } else {
                    if (emptyState) emptyState.style.display = 'none';
                }
            } catch (err) {
                console.error('加载视频失败:', err);
                showToast('加载视频失败，请检查网络', 'error');
            }
        }

        function renderVideoFeed() {
            // 保留empty-state
            const existingEmpty = videoFeed.querySelector('.empty-state');
            // 清除现有视频项
            const existingItems = videoFeed.querySelectorAll('.video-item');
            existingItems.forEach(el => el.remove());

            if (STATE.videos.length === 0) {
                if (existingEmpty) existingEmpty.style.display = 'flex';
                return;
            }
            if (existingEmpty) existingEmpty.style.display = 'none';

            STATE.videos.forEach((vid, index) => {
                const item = createVideoItem(vid, index);
                videoFeed.appendChild(item);
            });

            // 重新设置滚动位置
            requestAnimationFrame(() => {
                setupVideoPlayback();
            });
        }

        function createVideoItem(vid, index) {
            const div = document.createElement('div');
            div.className = 'video-item';
            div.dataset.videoId = vid.id;
            div.dataset.index = index;
            div.innerHTML = `
                <video src="${escapeHtml(vid.url)}" 
                       loop muted playsinline 
                       preload="metadata"
                       poster="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='600' fill='%23111'><text x='50%25' y='50%25' text-anchor='middle' fill='%23555' font-size='40'>🎬</text></svg>">
                </video>
                <div class="video-overlay">
                    <div class="video-title">${escapeHtml(vid.title || '无标题')}</div>
                    <div class="video-publisher">
                        <span class="pub-dot"></span> @${escapeHtml(vid.maoniu_id || '未知')}
                        <span style="margin-left:8px;font-size:10px;color:#888;">${formatTime(vid.created_at)}</span>
                    </div>
                </div>
                <div class="action-bar">
                    <button class="action-btn like-btn ${vid.user_liked ? 'liked' : ''}" data-video-id="${vid.id}" title="点赞">
                        ${vid.user_liked ? '❤️' : '🤍'}
                        <span class="count">${formatCount(vid.likes || 0)}</span>
                    </button>
                    <button class="action-btn comment-btn" data-video-id="${vid.id}" title="评论">
                        💬
                        <span class="count">${formatCount(vid.comments_count || 0)}</span>
                    </button>
                    <button class="action-btn share-btn" data-video-id="${vid.id}" title="分享链接">
                        🔗
                        <span class="count">分享</span>
                    </button>
                </div>
            `;

            // 事件绑定
            const likeBtn = div.querySelector('.like-btn');
            likeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleLike(vid.id, likeBtn);
            });

            const commentBtn = div.querySelector('.comment-btn');
            commentBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                openCommentPanel(vid.id);
            });

            const shareBtn = div.querySelector('.share-btn');
            shareBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                shareVideo(vid);
            });

            // 点击视频切换播放/暂停
            const videoEl = div.querySelector('video');
            videoEl.addEventListener('click', () => {
                if (videoEl.paused) {
                    videoEl.play().catch(() => {});
                } else {
                    videoEl.pause();
                }
            });

            return div;
        }

        function setupVideoPlayback() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (!video) return;
                    if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
                        // 播放当前视频
                        video.play().catch(() => {});
                        if (STATE.activeVideoElement && STATE.activeVideoElement !== video) {
                            STATE.activeVideoElement.pause();
                        }
                        STATE.activeVideoElement = video;
                        STATE.currentVideoIndex = parseInt(entry.target.dataset.index || 0);
                    } else if (entry.intersectionRatio < 0.3) {
                        video.pause();
                        if (STATE.activeVideoElement === video) {
                            STATE.activeVideoElement = null;
                        }
                    }
                });
            }, {
                threshold: [0.3, 0.6, 0.9],
                root: videoFeed,
            });

            const allItems = videoFeed.querySelectorAll('.video-item');
            allItems.forEach(item => observer.observe(item));

            // 初始播放第一个
            if (allItems.length > 0) {
                const firstVideo = allItems[0].querySelector('video');
                if (firstVideo) {
                    firstVideo.play().catch(() => {});
                    STATE.activeVideoElement = firstVideo;
                    STATE.currentVideoIndex = 0;
                }
            }
        }

        // ==================== 点赞 ====================
        async function toggleLike(videoId, btnEl) {
            if (!STATE.currentUser) {
                showToast('请先登录', 'error');
                return;
            }
            try {
                const data = await apiCall('/api/videos/' + videoId + '/like', 'POST');
                const vid = STATE.videos.find(v => v.id === videoId);
                if (vid) {
                    vid.likes = data.likes;
                    vid.user_liked = data.liked;
                }
                // 更新UI
                if (data.liked) {
                    btnEl.classList.add('liked');
                    btnEl.innerHTML = '❤️<span class="count">' + formatCount(data.likes) + '</span>';
                } else {
                    btnEl.classList.remove('liked');
                    btnEl.innerHTML = '🤍<span class="count">' + formatCount(data.likes) + '</span>';
                }
                // socket通知其他用户
                if (STATE.socket && STATE.socket.connected) {
                    STATE.socket.emit('video:like', { video_id: videoId, likes: data.likes });
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        // ==================== 评论 ====================
        function openCommentPanel(videoId) {
            STATE.currentCommentVideoId = videoId;
            commentPanel.classList.add('open');
            overlayBg.classList.add('show');
            loadComments(videoId);
            commentInput.value = '';
            commentInput.focus();
        }

        function closeCommentPanel() {
            commentPanel.classList.remove('open');
            overlayBg.classList.remove('show');
            STATE.currentCommentVideoId = null;
            commentList.innerHTML = '';
        }

        async function loadComments(videoId) {
            commentList.innerHTML = '<p style="color:#666;text-align:center;padding:20px;">加载中...</p>';
            try {
                const data = await apiCall('/api/videos/' + videoId + '/comments');
                commentList.innerHTML = '';
                if (data.comments.length === 0) {
                    commentList.innerHTML =
                    '<p style="color:#555;text-align:center;padding:20px;">暂无评论，来说两句吧~</p>';
                } else {
                    data.comments.forEach(c => appendCommentItem(c));
                }
            } catch (err) {
                commentList.innerHTML = '<p style="color:#f44;text-align:center;">加载失败</p>';
            }
        }

        async function sendComment() {
            const content = commentInput.value.trim();
            if (!content) return;
            if (!STATE.currentCommentVideoId) return;
            try {
                const data = await apiCall('/api/videos/' + STATE.currentCommentVideoId + '/comments', 'POST', { content });
                appendCommentItem(data.comment);
                commentInput.value = '';
                // 更新评论数
                const vid = STATE.videos.find(v => v.id === STATE.currentCommentVideoId);
                if (vid) {
                    vid.comments_count = (vid.comments_count || 0) + 1;
                    updateActionBarForVideo(vid);
                }
                // socket通知
                if (STATE.socket && STATE.socket.connected) {
                    STATE.socket.emit('video:comment', {
                        video_id: STATE.currentCommentVideoId,
                        comment: data.comment,
                    });
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function shareVideo(vid) {
            const shareUrl = window.location.origin + '?v=' + vid.id;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showToast('✅ 链接已复制！发送给朋友即可观看', 'success');
                }).catch(() => {
                    prompt('复制此链接分享视频：', shareUrl);
                });
            } else {
                prompt('复制此链接分享视频：', shareUrl);
            }
        }

        // ==================== 上传视频 ====================
        function openUploadModal() {
            if (!STATE.currentUser) {
                showToast('请先登录', 'error');
                return;
            }
            uploadModal.classList.add('show');
            STATE.selectedVideoFile = null;
            $('#video-file-input').value = '';
            $('#video-title-input').value = '';
            $('#btn-confirm-upload').disabled = true;
            uploadProgressBar.style.display = 'none';
            uploadProgressFill.style.width = '0%';
        }

        function closeUploadModal() {
            uploadModal.classList.remove('show');
            STATE.selectedVideoFile = null;
            $('#video-file-input').value = '';
        }

        async function uploadVideo() {
            if (!STATE.selectedVideoFile) {
                showToast('请选择视频文件', 'error');
                return;
            }
            const title = $('#video-title-input').value.trim() || '无标题';
            const file = STATE.selectedVideoFile;

            if (file.size > 200 * 1024 * 1024) {
                showToast('视频文件不能超过200MB', 'error');
                return;
            }

            $('#btn-confirm-upload').disabled = true;
            uploadProgressBar.style.display = 'block';
            uploadProgressFill.style.width = '10%';

            const formData = new FormData();
            formData.append('video', file);
            formData.append('title', title);

            try {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/api/videos/upload');

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const pct = Math.round((e.loaded / e.total) * 90);
                        uploadProgressFill.style.width = pct + '%';
                    }
                };

                const result = await new Promise((resolve, reject) => {
                    xhr.onload = () => {
                        uploadProgressFill.style.width = '100%';
                        try {
                            const data = JSON.parse(xhr.responseText);
                            if (xhr.status >= 200 && xhr.status < 300) resolve(data);
                            else reject(new Error(data.error || '上传失败'));
                        } catch (e) {
                            reject(new Error('解析响应失败'));
                        }
                    };
                    xhr.onerror = () => reject(new Error('网络错误'));
                    xhr.send(formData);
                });

                showToast('✅ 视频发布成功！', 'success');
                closeUploadModal();

                // 添加到列表
                STATE.videos.unshift(result.video);
                renderVideoFeed();
                videoFeed.scrollTop = 0;
                if (emptyState) emptyState.style.display = 'none';

                // socket广播
                if (STATE.socket && STATE.socket.connected) {
                    STATE.socket.emit('video:new', { video: result.video });
                }

            } catch (err) {
                showToast('❌ ' + err.message, 'error');
                $('#btn-confirm-upload').disabled = false;
                uploadProgressBar.style.display = 'none';
                uploadProgressFill.style.width = '0%';
            }
        }

        // ==================== 事件绑定 ====================
        formLogin.addEventListener('submit', handleLogin);
        formRegister.addEventListener('submit', handleRegister);

        tabLogin.addEventListener('click', () => {
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            formLogin.style.display = 'block';
            formRegister.style.display = 'none';
            $('#login-error').textContent = '';
            $('#reg-error').textContent = '';
        });

        tabRegister.addEventListener('click', () => {
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            formRegister.style.display = 'block';
            formLogin.style.display = 'none';
            $('#login-error').textContent = '';
            $('#reg-error').textContent = '';
        });

        $('#btn-logout').addEventListener('click', handleLogout);
        overlayBg.addEventListener('click', closeCommentPanel);
        $('#btn-send-comment').addEventListener('click', sendComment);
        commentInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendComment();
        });

        $('#upload-fab').addEventListener('click', openUploadModal);
        $('#btn-cancel-upload').addEventListener('click', closeUploadModal);
        $('#btn-confirm-upload').addEventListener('click', uploadVideo);

        $('#video-file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                STATE.selectedVideoFile = file;
                $('#btn-confirm-upload').disabled = false;
                // 更新标签显示
                const label = document.querySelector('#upload-modal .file-label');
                if (label) {
                    label.innerHTML =
                        `<span class="big-icon">✅</span>已选择：<strong>${escapeHtml(file.name)}</strong><br><small style="color:#888;">${(file.size/1024/1024).toFixed(1)} MB</small>`;
                }
            }
        });

        // 关闭上传弹窗（点击背景）
        uploadModal.addEventListener('click', (e) => {
            if (e.target === uploadModal) closeUploadModal();
        });

        // 下载APP链接
        downloadAppLink.addEventListener('click', (e) => {
            e.preventDefault();
            showToast('📱 APP即将推出，敬请期待！当前请使用浏览器访问', 'success');
        });

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (commentPanel.classList.contains('open')) {
                    closeCommentPanel();
                } else if (uploadModal.classList.contains('show')) {
                    closeUploadModal();
                }
            }
        });

        // ==================== 初始化 ====================
        function init() {
            // 隐藏启动画面
            setTimeout(() => {
                splashScreen.classList.add('hidden');
            }, 1500);

            // 检查URL参数中是否有视频ID（分享链接）
            const urlParams = new URLSearchParams(window.location.search);
            const sharedVideoId = urlParams.get('v');

            // 显示登录界面
            authOverlay.classList.remove('hidden');
            appContainer.classList.add('hidden');

            // 如果有分享视频ID，暂存起来，登录后滚动到该视频
            if (sharedVideoId) {
                window._pendingScrollToVideo = parseInt(sharedVideoId);
                showToast('📎 检测到分享链接，登录后自动跳转', 'success');
            }

            console.log('🐂 牦牛免费视频 - 初始化完成');
            console.log('📋 特性：免费 | 不封号 | 不审核 | 发布自由');
            console.log('🌐 在任何设备上打开此网址即可使用');
        }

        // 在加载视频后检查是否有待滚动到的视频
        const origLoadVideos = loadVideos;
        loadVideos = async function() {
            await origLoadVideos();
            if (window._pendingScrollToVideo && STATE.videos.length > 0) {
                const targetIndex = STATE.videos.findIndex(v => v.id === window._pendingScrollToVideo);
                if (targetIndex >= 0) {
                    setTimeout(() => {
                        const items = videoFeed.querySelectorAll('.video-item');
                        if (items[targetIndex]) {
                            items[targetIndex].scrollIntoView({ behavior: 'smooth' });
                        }
                    }, 600);
                }
                window._pendingScrollToVideo = null;
            }
        };

        init();
    </script>
</body>
</html>
