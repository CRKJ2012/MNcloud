<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0f">
<title>牦牛文件传输助手</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

  :root {
    --bg-0: #07080c;
    --bg-1: #0d0f16;
    --glass: rgba(255,255,255,0.045);
    --glass-strong: rgba(255,255,255,0.075);
    --stroke: rgba(255,255,255,0.09);
    --stroke-strong: rgba(255,255,255,0.16);
    --text: #f0f2f7;
    --text-dim: #7c8496;
    --text-mute: #565d6e;
    --accent: #5b8cff;
    --accent-2: #8b6bff;
    --accent-glow: rgba(91,140,255,0.35);
    --ok: #38d39f;
    --warn: #ffb547;
    --err: #ff5a5a;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-0);
    color: var(--text);
    overflow: hidden;
    font-size: 15px;
    line-height: 1.55;
    letter-spacing: .01em;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }

  /* 背景光晕 */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .5;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 420px; height: 420px;
    background: radial-gradient(circle, #3a5fff 0%, transparent 70%);
    top: -160px; left: -140px;
    animation: float1 18s ease-in-out infinite;
  }
  body::after {
    width: 380px; height: 380px;
    background: radial-gradient(circle, #8b5cff 0%, transparent 70%);
    bottom: -140px; right: -120px;
    animation: float2 22s ease-in-out infinite;
  }
  @keyframes float1 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(60px, 40px) scale(1.1); }
  }
  @keyframes float2 {
    0%,100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-50px, -30px) scale(1.08); }
  }

  /* ===== 应用容器 ===== */
  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 760px;
    margin: 0 auto;
    background: linear-gradient(180deg, rgba(13,15,22,0.6) 0%, rgba(7,8,12,0.85) 100%);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-left: 1px solid rgba(255,255,255,0.04);
    border-right: 1px solid rgba(255,255,255,0.04);
  }

  /* ===== 顶栏 ===== */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    padding-top: calc(14px + env(safe-area-inset-top));
    border-bottom: 1px solid var(--stroke);
    background: rgba(13,15,22,0.5);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    flex-shrink: 0;
  }
  .logo {
    width: 38px; height: 38px;
    border-radius: 12px;
    background: linear-gradient(135deg, #5b8cff 0%, #8b6bff 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 21px;
    flex-shrink: 0;
    box-shadow: 0 6px 20px -4px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.25);
    position: relative;
    overflow: hidden;
  }
  .logo::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.2), transparent 60%);
  }
  .brand { flex: 1; min-width: 0; }
  .brand h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .02em;
    background: linear-gradient(90deg, #fff, #b8c4e0);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand .sub {
    font-size: 11px;
    color: var(--text-mute);
    letter-spacing: .04em;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 1px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--warn);
    box-shadow: 0 0 8px var(--warn);
    transition: .3s var(--ease);
    flex-shrink: 0;
  }
  .dot.on { background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: pulse 2s infinite; }
  .dot.err { background: var(--err); box-shadow: 0 0 10px var(--err); }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: .45; }
  }

  .ghost-btn {
    width: 36px; height: 36px;
    border-radius: 11px;
    background: var(--glass);
    border: 1px solid var(--stroke);
    color: var(--text-dim);
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: .2s var(--ease);
    flex-shrink: 0;
  }
  .ghost-btn:hover { background: var(--glass-strong); color: var(--text); }
  .ghost-btn:active { transform: scale(.94); }

  /* ===== 主区域 ===== */
  .main {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }
  .main::-webkit-scrollbar { width: 5px; }
  .main::-webkit-scrollbar-thumb { background: var(--stroke-strong); border-radius: 3px; }
  .main::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.25); }

  /* ===== 连接界面 ===== */
  .connect {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 28px 20px 20px;
    min-height: 100%;
    justify-content: center;
  }

  .hero {
    text-align: center;
    margin-bottom: 8px;
    animation: fadeUp .6s var(--ease) both;
  }
  .hero .big-logo {
    width: 64px; height: 64px;
    margin: 0 auto 16px;
    border-radius: 20px;
    background: linear-gradient(135deg, #5b8cff 0%, #8b6bff 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
    box-shadow: 0 16px 40px -10px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.3);
    position: relative;
    overflow: hidden;
  }
  .hero .big-logo::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.25), transparent 55%);
  }
  .hero h2 {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: .01em;
    background: linear-gradient(90deg, #fff, #a8b6d8);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 6px;
    line-height: 1.6;
  }

  .panel {
    background: var(--glass);
    border: 1px solid var(--stroke);
    border-radius: var(--radius-lg);
    padding: 20px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    animation: fadeUp .6s var(--ease) both;
    box-shadow: 0 8px 32px -12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .panel:nth-of-type(2) { animation-delay: .08s; }
  .panel:nth-of-type(3) { animation-delay: .16s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .panel-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .panel-label .idx {
    width: 18px; height: 18px;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    letter-spacing: 0;
    flex-shrink: 0;
    box-shadow: 0 4px 12px -2px var(--accent-glow);
  }

  /* 连接码显示 */
  .code {
    background: linear-gradient(135deg, rgba(91,140,255,.10), rgba(139,107,255,.08));
    border: 1px solid rgba(91,140,255,.22);
    border-radius: var(--radius-md);
    padding: 18px 16px;
    text-align: center;
    cursor: pointer;
    transition: .25s var(--ease);
    position: relative;
    overflow: hidden;
  }
  .code::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
    transition: left .7s var(--ease);
  }
  .code:hover::before { left: 100%; }
  .code:active { transform: scale(.985); border-color: rgba(91,140,255,.5); }
  .code .num {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: .22em;
    color: #b6c8ff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 30px rgba(91,140,255,.5);
    padding-left: .22em;
    transition: .2s;
  }
  .code .hint {
    font-size: 11px;
    color: var(--text-mute);
    margin-top: 8px;
    letter-spacing: .05em;
  }

  /* 分隔线 */
  .sep {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0 14px;
    color: var(--text-mute);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .sep::before, .sep::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--stroke), transparent);
  }

  /* 输入行 */
  .field {
    display: flex;
    gap: 8px;
  }
  .field input {
    flex: 1;
    min-width: 0;
    background: rgba(0,0,0,.25);
    border: 1px solid var(--stroke);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    color: var(--text);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .18em;
    outline: none;
    transition: .25s var(--ease);
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .field input::placeholder {
    letter-spacing: .08em;
    font-weight: 400;
    color: var(--text-mute);
    font-size: 14px;
  }
  .field input:focus {
    border-color: rgba(91,140,255,.55);
    background: rgba(91,140,255,.06);
    box-shadow: 0 0 0 4px rgba(91,140,255,.10);
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    color: #fff;
    padding: 14px 22px;
    border-radius: var(--radius-md);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
    transition: .25s var(--ease);
    box-shadow: 0 8px 24px -8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.25);
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .btn-primary::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.2), transparent 50%);
    pointer-events: none;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.3); }
  .btn-primary:active { transform: translateY(0) scale(.98); }
  .btn-primary:disabled {
    background: var(--glass-strong);
    color: var(--text-mute);
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }
  .btn-primary:disabled::after { display: none; }

  /* ===== 聊天界面 ===== */
  .chat {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 20px 16px 12px;
  }

  .sys {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-mute);
    padding: 6px 0;
    letter-spacing: .02em;
  }
  .sys .pill {
    background: var(--glass);
    border: 1px solid var(--stroke);
    padding: 4px 14px;
    border-radius: 20px;
    display: inline-block;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .row {
    display: flex;
    gap: 8px;
    max-width: 100%;
    animation: msgIn .35s var(--ease) both;
  }
  .row.me { flex-direction: row-reverse; }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .bubble {
    max-width: 76%;
    padding: 10px 15px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-wrap;
    position: relative;
    animation: none;
  }
  .row.them .bubble {
    background: var(--glass-strong);
    border: 1px solid var(--stroke);
    border-bottom-left-radius: 6px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 4px 16px -8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .row.me .bubble {
    background: linear-gradient(135deg, #5b8cff, #6d7dff);
    color: #fff;
    border-bottom-right-radius: 6px;
    box-shadow: 0 6px 20px -8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .bubble .stamp {
    display: block;
    font-size: 10.5px;
    margin-top: 4px;
    opacity: .55;
    letter-spacing: .03em;
  }
  .row.me .bubble .stamp { color: rgba(255,255,255,.85); }
  .row.them .bubble .stamp { color: var(--text-mute); }

  /* 文件卡片 */
  .file-card {
    width: 100%;
    max-width: 320px;
    background: var(--glass-strong);
    border: 1px solid var(--stroke);
    border-radius: 18px;
    padding: 14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 6px 24px -12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .row.me .file-card {
    background: linear-gradient(135deg, rgba(91,140,255,.22), rgba(139,107,255,.18));
    border-color: rgba(91,140,255,.28);
  }
  .file-head { display: flex; align-items: center; gap: 12px; }
  .file-icon {
    width: 44px; height: 44px;
    border-radius: 13px;
    background: linear-gradient(135deg, #5b8cff, #8b6bff);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: 0 6px 18px -6px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.25);
    position: relative;
    overflow: hidden;
  }
  .file-icon::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.2), transparent 55%);
  }
  .file-meta { flex: 1; min-width: 0; }
  .file-meta .name {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: .01em;
  }
  .file-meta .size {
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .row.me .file-meta .size { color: rgba(255,255,255,.7); }

  .bar {
    height: 4px;
    background: rgba(0,0,0,.3);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  .row.me .bar { background: rgba(0,0,0,.2); }
  .bar .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 3px;
    transition: width .2s var(--ease);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .bar .fill.done {
    background: linear-gradient(90deg, var(--ok), #2eb888);
    box-shadow: 0 0 12px rgba(56,211,159,.5);
  }
  .row.me .bar .fill { background: linear-gradient(90deg, #fff, #d6e0ff); box-shadow: none; }
  .row.me .bar .fill.done { background: linear-gradient(90deg, #b8ffd8, #7dffb5); }

  .btn-download {
    width: 100%;
    padding: 10px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    display: block;
    transition: .2s var(--ease);
    box-shadow: 0 6px 18px -6px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .btn-download:active { transform: scale(.97); }

  /* ===== 底部输入栏 ===== */
  .composer {
    flex-shrink: 0;
    padding: 12px 14px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    background: rgba(13,15,22,0.7);
    border-top: 1px solid var(--stroke);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  .composer .attach {
    width: 44px; height: 44px;
    border-radius: 14px;
    background: var(--glass);
    border: 1px solid var(--stroke);
    color: var(--text-dim);
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: .2s var(--ease);
    position: relative;
    overflow: hidden;
  }
  .composer .attach:hover {
    background: rgba(91,140,255,.12);
    border-color: rgba(91,140,255,.4);
    color: var(--accent-2);
  }
  .composer .attach:active { transform: scale(.94); }

  .composer textarea {
    flex: 1;
    min-width: 0;
    background: var(--glass);
    border: 1px solid var(--stroke);
    border-radius: 14px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    line-height: 1.4;
    outline: none;
    resize: none;
    max-height: 120px;
    min-height: 44px;
    transition: .25s var(--ease);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .composer textarea::placeholder { color: var(--text-mute); }
  .composer textarea:focus {
    border-color: rgba(91,140,255,.5);
    background: rgba(91,140,255,.06);
    box-shadow: 0 0 0 4px rgba(91,140,255,.08);
  }

  .composer .send {
    width: 44px; height: 44px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 17px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: .25s var(--ease);
    box-shadow: 0 8px 22px -8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.25);
    position: relative;
    overflow: hidden;
  }
  .composer .send::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.2), transparent 55%);
  }
  .composer .send:active { transform: scale(.94); }
  .composer .send:disabled {
    background: var(--glass-strong);
    color: var(--text-mute);
    box-shadow: none;
    cursor: not-allowed;
  }
  .composer .send:disabled::after { display: none; }

  /* ===== 拖拽高亮 ===== */
  .dragging .main {
    outline: 2px dashed rgba(91,140,255,.6);
    outline-offset: -12px;
    border-radius: 20px;
  }

  /* ===== 响应式 ===== */
  @media (max-width: 480px) {
    .code .num { font-size: 30px; letter-spacing: .18em; }
    .hero .big-logo { width: 58px; height: 58px; font-size: 30px; }
    .hero h2 { font-size: 17px; }
    .bubble { max-width: 80%; }
  }

  /* 隐藏状态 */
  .hide { display: none !important; }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="logo">🐃</div>
    <div class="brand">
      <h1>牦牛文件传输助手</h1>
      <div class="sub">
        <span class="dot" id="dot"></span>
        <span id="statusText">正在初始化…</span>
      </div>
    </div>
    <button class="ghost-btn" id="btnReset" title="断开连接" onclick="resetAll()">⟳</button>
  </header>

  <!-- 主区域 -->
  <main class="main" id="main">
    <!-- 连接界面 -->
    <section class="connect" id="connectView">
      <div class="hero">
        <div class="big-logo">🐃</div>
        <h2>牦牛文件传输助手</h2>
        <p>手机 ↔ 电脑 · 点对点直传<br>无需服务器，文件不经过第三方</p>
      </div>

      <div class="panel">
        <div class="panel-label"><span class="idx">1</span>我的连接码</div>
        <div class="code" onclick="copyCode()">
          <div class="num" id="myCode">------</div>
          <div class="hint">轻触复制 · 发给对方</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-label"><span class="idx">2</span>连接对方</div>
        <div class="field">
          <input type="text" id="peerInput" placeholder="输入 6 位连接码" inputmode="numeric" maxlength="6">
          <button class="btn-primary" id="btnConnect" onclick="connectPeer()">连接</button>
        </div>
      </div>
    </section>

    <!-- 聊天界面 -->
    <section class="chat hide" id="chatView"></section>
  </main>

  <!-- 底部输入栏 -->
  <footer class="composer hide" id="composer">
    <label class="attach" title="发送文件">
      📎
      <input type="file" id="fileInput" multiple style="display:none">
    </label>
    <textarea id="msgInput" placeholder="输入消息…" rows="1"></textarea>
    <button class="send" id="btnSend" onclick="sendText()" title="发送">➤</button>
  </footer>

</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* =========================================================
   牦牛文件传输助手
   - PeerJS 信令 + WebRTC DataChannel 点对点
   - 文件用 Base64 分块传输（稳定可靠）
   - 文字消息 JSON 文本传输
   ========================================================= */

// ---------- 常量 ----------
const CHUNK_SIZE = 16 * 1024;          // 16KB 原始数据 → Base64 后约 21.3KB
const MAX_BUFFER = 1.5 * 1024 * 1024;  // DataChannel 缓冲上限
const FILE_ICON = '📄';

// ---------- 全局状态 ----------
let peer = null;
let conn = null;
let myCode = '';
let isConnected = false;

// 接收状态（单文件串行）
let recvFile = null;

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const els = {
  app: $('app'),
  dot: $('dot'),
  statusText: $('statusText'),
  myCode: $('myCode'),
  peerInput: $('peerInput'),
  btnConnect: $('btnConnect'),
  connectView: $('connectView'),
  chatView: $('chatView'),
  composer: $('composer'),
  msgInput: $('msgInput'),
  btnSend: $('btnSend'),
  fileInput: $('fileInput'),
  main: $('main'),
};

// ---------- 状态显示 ----------
function setStatus(text, state) {
  els.statusText.textContent = text;
  els.dot.className = 'dot' + (state ? ' ' + state : '');
}

// ---------- 生成 6 位码 ----------
function genCode() {
  return String(Math.floor(100000 + Math.random() * 900000));
}

// ---------- 复制连接码 ----------
function copyCode() {
  if (!myCode) return;
  const done = () => {
    const el = els.myCode;
    const old = el.textContent;
    el.textContent = '已复制 ✓';
    el.style.letterSpacing = '0';
    setTimeout(() => { el.textContent = old; el.style.letterSpacing = ''; }, 900);
  };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(myCode).then(done).catch(() => fallbackCopy(myCode, done));
  } else {
    fallbackCopy(myCode, done);
  }
}
function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); cb(); } catch (e) {}
  document.body.removeChild(ta);
}

// ---------- 初始化 PeerJS ----------
function initPeer() {
  myCode = genCode();
  peer = new Peer(myCode, {
    debug: 1,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
      ],
    },
  });

  peer.on('open', id => {
    myCode = id;
    els.myCode.textContent = id;
    setStatus('已就绪，等待连接', 'on');
  });

  peer.on('connection', c => {
    if (conn && conn.open) { c.close(); return; }
    bindConn(c);
    setStatus('对方已连接', 'on');
  });

  peer.on('error', err => {
    console.error(err);
    if (err.type === 'unavailable-id') {
      peer.destroy();
      initPeer();
    } else if (err.type === 'peer-unavailable') {
      setStatus('连接码不存在或对方不在线', 'err');
      els.btnConnect.disabled = false;
      els.btnConnect.textContent = '连接';
    } else {
      setStatus('连接异常：' + err.type, 'err');
    }
  });

  peer.on('disconnected', () => {
    setStatus('信令断开，重连中…', '');
    peer.reconnect();
  });
}

// ---------- 主动连接 ----------
function connectPeer() {
  const target = els.peerInput.value.trim();
  if (!/^\d{6}$/.test(target)) {
    setStatus('请输入 6 位数字连接码', 'err');
    return;
  }
  if (target === myCode) {
    setStatus('不能连接自己', 'err');
    return;
  }
  els.btnConnect.disabled = true;
  els.btnConnect.textContent = '连接中';
  setStatus('正在连接 ' + target + ' …', '');
  const c = peer.connect(target, { reliable: true });
  bindConn(c);
}

// ---------- 绑定连接 ----------
function bindConn(c) {
  conn = c;

  c.on('open', () => {
    isConnected = true;
    els.btnConnect.disabled = false;
    els.btnConnect.textContent = '连接';
    setStatus('已连接 · 可传文件 / 发消息', 'on');
    showChat();
    addSys('已建立点对点连接 🔒');
  });

  c.on('data', handleData);

  c.on('close', () => {
    isConnected = false;
    conn = null;
    setStatus('连接已断开', '');
    addSys('连接已断开');
    setTimeout(() => {
      els.btnConnect.disabled = false;
      els.btnConnect.textContent = '连接';
    }, 100);
  });

  c.on('error', err => {
    console.error(err);
    setStatus('连接错误', 'err');
  });
}

// ---------- 切换视图 ----------
function showChat() {
  els.connectView.classList.add('hide');
  els.chatView.classList.remove('hide');
  els.composer.classList.remove('hide');
  scrollBottom(true);
}

function resetAll() {
  if (conn) { try { conn.close(); } catch(e){} conn = null; }
  isConnected = false;
  recvFile = null;
  els.chatView.innerHTML = '';
  els.chatView.classList.add('hide');
  els.composer.classList.add('hide');
  els.connectView.classList.remove('hide');
  els.peerInput.value = '';
  els.btnConnect.disabled = false;
  els.btnConnect.textContent = '连接';
  setStatus('已就绪，等待连接', 'on');
}

// ---------- 滚动到底 ----------
function scrollBottom(instant) {
  requestAnimationFrame(() => {
    if (instant) els.main.scrollTop = els.main.scrollHeight;
    else els.main.scrollTo({ top: els.main.scrollHeight, behavior: 'smooth' });
  });
}

// ---------- 时间戳 ----------
function nowStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ---------- 系统消息 ----------
function addSys(text) {
  const div = document.createElement('div');
  div.className = 'sys';
  div.innerHTML = `<span class="pill">${escapeHtml(text)}</span>`;
  els.chatView.appendChild(div);
  scrollBottom();
}

// ---------- 文字气泡 ----------
function addText(text, mine) {
  const row = document.createElement('div');
  row.className = 'row ' + (mine ? 'me' : 'them');
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  const s = document.createElement('span');
  s.className = 'stamp';
  s.textContent = nowStr();
  b.appendChild(s);
  row.appendChild(b);
  els.chatView.appendChild(row);
  scrollBottom();
}

// ---------- 发送文字 ----------
function sendText() {
  const v = els.msgInput.value.trim();
  if (!v || !isConnected || !conn) return;
  conn.send(JSON.stringify({ t: 'text', v }));
  addText(v, true);
  els.msgInput.value = '';
  autoResize();
}

// textarea 自适应高度
function autoResize() {
  const ta = els.msgInput;
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
}
els.msgInput.addEventListener('input', autoResize);
els.msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendText();
  }
});

// ---------- 处理接收数据 ----------
function handleData(data) {
  // 文本
  if (typeof data === 'string') {
    let msg;
    try { msg = JSON.parse(data); } catch(e) { return; }

    if (msg.t === 'text') {
      addText(msg.v, false);
    } else if (msg.t === 'fstart') {
      recvFile = {
        id: msg.id,
        name: msg.name,
        size: msg.size,
        mime: msg.mime || 'application/octet-stream',
        total: msg.total,
        chunks: new Array(msg.total),
        received: 0,
        gotChunks: 0,
        el: null,
        barEl: null,
        sizeEl: null,
      };
      renderRecvFile(recvFile);
    } else if (msg.t === 'fend') {
      if (recvFile && recvFile.id === msg.id) {
        finishRecv(recvFile);
        recvFile = null;
      }
    } else if (msg.t === 'fchunk') {
      // Base64 文本块（兼容某些环境）
      if (!recvFile || recvFile.id !== msg.id) return;
      const bin = atob(msg.d);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      pushChunk(recvFile, msg.i, arr.buffer);
    }
    return;
  }

  // 二进制块（ArrayBuffer / Uint8Array / Blob）
  let buf = null;
  if (data instanceof ArrayBuffer) buf = data;
  else if (data instanceof Uint8Array) buf = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
  else if (data && data.buffer instanceof ArrayBuffer) buf = data.buffer;
  if (!buf || !recvFile) return;

  // 二进制块格式：[4字节 id 长度][id 字节][4字节 序号][数据]
  try {
    const dv = new DataView(buf);
    const idLen = dv.getUint32(0);
    const idBytes = new Uint8Array(buf, 4, idLen);
    const id = new TextDecoder().decode(idBytes);
    if (id !== recvFile.id) return;
    const seq = dv.getUint32(4 + idLen);
    const chunk = buf.slice(8 + idLen);
    pushChunk(recvFile, seq, chunk);
  } catch(e) {
    console.warn('二进制块解析失败', e);
  }
}

function pushChunk(info, seq, buf) {
  if (info.chunks[seq]) return; // 重复
  info.chunks[seq] = buf;
  info.received += buf.byteLength;
  info.gotChunks++;
  updateRecvFile(info);
}

// ---------- 渲染接收文件 ----------
function renderRecvFile(info) {
  const row = document.createElement('div');
  row.className = 'row them';
  row.innerHTML = `
    <div class="file-card">
      <div class="file-head">
        <div class="file-icon">${FILE_ICON}</div>
        <div class="file-meta">
          <div class="name">${escapeHtml(info.name)}</div>
          <div class="size">接收中 0%</div>
        </div>
      </div>
      <div class="bar"><div class="fill"></div></div>
    </div>`;
  els.chatView.appendChild(row);
  info.el = row;
  info.barEl = row.querySelector('.fill');
  info.sizeEl = row.querySelector('.size');
  scrollBottom();
}

function updateRecvFile(info) {
  const p = info.size ? info.received / info.size : 0;
  info.barEl.style.width = Math.min(100, p * 100).toFixed(1) + '%';
  info.sizeEl.textContent = `接收中 ${(p*100).toFixed(0)}% · ${formatSize(info.received)} / ${formatSize(info.size)}`;
}

function finishRecv(info) {
  // 校验
  if (info.gotChunks !== info.total) {
    info.sizeEl.textContent = `接收不完整 (${info.gotChunks}/${info.total})`;
    info.barEl.classList.add('done');
    return;
  }
  const blob = new Blob(info.chunks, { type: info.mime });
  const url = URL.createObjectURL(blob);

  info.barEl.style.width = '100%';
  info.barEl.classList.add('done');
  info.sizeEl.textContent = `已完成 · ${formatSize(info.size)}`;

  const a = document.createElement('a');
  a.className = 'btn-download';
  a.href = url;
  a.download = info.name;
  a.textContent = '⬇ 下载文件';
  info.el.querySelector('.file-card').appendChild(a);

  // 手机端自动触发下载
  try { a.click(); } catch(e){}
  scrollBottom();
}

// ---------- 发送文件 ----------
async function sendFiles(fileList) {
  if (!isConnected || !conn) return;
  for (const file of fileList) {
    await sendOneFile(file);
  }
}

function sendOneFile(file) {
  return new Promise(async resolve => {
    const id = Math.random().toString(36).slice(2, 10);
    const total = Math.ceil(file.size / CHUNK_SIZE);

    // 发送开始
    conn.send(JSON.stringify({
      t: 'fstart', id,
      name: file.name,
      size: file.size,
      mime: file.type || 'application/octet-stream',
      total,
    }));

    // 渲染
    const card = renderSendFile(file, id);
    card.setStatus('准备中…');

    let seq = 0;
    let offset = 0;

    const sendNext = () => {
      if (offset >= file.size) {
        conn.send(JSON.stringify({ t: 'fend', id }));
        card.setDone();
        resolve();
        return;
      }
      const slice = file.slice(offset, offset + CHUNK_SIZE);
      const reader = new FileReader();
      reader.onload = e => {
        const buf = e.target.result; // ArrayBuffer
        const packet = packChunk(id, seq, buf);
        waitBuffer(() => {
          if (!conn || !conn.open) { resolve(); return; }
          conn.send(packet);
          offset += buf.byteLength;
          seq++;
          card.setProgress(offset / file.size);
          sendNext();
        });
      };
      reader.onerror = () => {
        card.setError();
        resolve();
      };
      reader.readAsArrayBuffer(slice);
    };
    sendNext();
  });
}

// 打包二进制块：[4B idLen][id][4B seq][data]
function packChunk(id, seq, buf) {
  const idBytes = new TextEncoder().encode(id);
  const out = new ArrayBuffer(4 + idBytes.length + 4 + buf.byteLength);
  const dv = new DataView(out);
  dv.setUint32(0, idBytes.length);
  new Uint8Array(out, 4, idBytes.length).set(idBytes);
  dv.setUint32(4 + idBytes.length, seq);
  new Uint8Array(out, 8 + idBytes.length).set(new Uint8Array(buf));
  return out;
}

// 等待缓冲区
function waitBuffer(cb) {
  const dc = conn && conn.dataChannel;
  if (!dc || dc.bufferedAmount < MAX_BUFFER) { cb(); return; }
  setTimeout(() => waitBuffer(cb), 25);
}

// ---------- 渲染发送文件卡片 ----------
function renderSendFile(file, id) {
  const row = document.createElement('div');
  row.className = 'row me';
  row.innerHTML = `
    <div class="file-card">
      <div class="file-head">
        <div class="file-icon">${FILE_ICON}</div>
        <div class="file-meta">
          <div class="name">${escapeHtml(file.name)}</div>
          <div class="size">准备中…</div>
        </div>
      </div>
      <div class="bar"><div class="fill"></div></div>
    </div>`;
  els.chatView.appendChild(row);
  const bar = row.querySelector('.fill');
  const sizeEl = row.querySelector('.size');
  scrollBottom();

  return {
    setStatus(t) { sizeEl.textContent = t; },
    setProgress(p) {
      bar.style.width = (p * 100).toFixed(1) + '%';
      sizeEl.textContent = `发送中 ${(p*100).toFixed(0)}% · ${formatSize(p*file.size)} / ${formatSize(file.size)}`;
    },
    setDone() {
      bar.style.width = '100%';
      bar.classList.add('done');
      sizeEl.textContent = `已发送 · ${formatSize(file.size)}`;
      scrollBottom();
    },
    setError() {
      bar.style.background = 'var(--err)';
      sizeEl.textContent = '发送失败';
    },
  };
}

// ---------- 工具 ----------
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  if (bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1) + ' MB';
  return (bytes/1024/1024/1024).toFixed(2) + ' GB';
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- 事件绑定 ----------
els.fileInput.addEventListener('change', e => {
  if (e.target.files.length) sendFiles(e.target.files);
  e.target.value = '';
});

els.peerInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') connectPeer();
});
els.peerInput.addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
});

// 拖拽上传
['dragenter', 'dragover'].forEach(ev => {
  document.addEventListener(ev, e => {
    if (!isConnected) return;
    e.preventDefault();
    els.app.classList.add('dragging');
  });
});
['dragleave', 'drop'].forEach(ev => {
  document.addEventListener(ev, e => {
    e.preventDefault();
    if (ev === 'dragleave' && e.relatedTarget) return;
    els.app.classList.remove('dragging');
  });
});
document.addEventListener('drop', e => {
  if (!isConnected) return;
  if (e.dataTransfer.files.length) sendFiles(e.dataTransfer.files);
});

// ---------- 启动 ----------
initPeer();
</script>
</body>
</html>
