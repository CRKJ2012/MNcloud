<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fafbfd">
<title>牦牛文件传输助手</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

  :root {
    --bg: #f5f6fa;
    --bg-soft: #eef0f6;
    --surface: #ffffff;
    --surface-2: #f8f9fc;
    --line: #e6e8f0;
    --line-soft: #eef0f6;
    --text: #1a1d26;
    --text-2: #5a6172;
    --text-3: #9aa1b2;
    --accent: #3b6ef5;
    --accent-2: #7a5cff;
    --accent-soft: #eef3ff;
    --accent-glow: rgba(59,110,245,0.22);
    --ok: #17b877;
    --ok-soft: #e6f9f1;
    --warn: #f5a623;
    --err: #ff4d4f;
    --err-soft: #fff1f0;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(20,30,60,0.04), 0 1px 1px rgba(20,30,60,0.03);
    --shadow-md: 0 4px 16px -4px rgba(20,30,60,0.08), 0 2px 6px -2px rgba(20,30,60,0.05);
    --shadow-lg: 0 12px 40px -12px rgba(20,30,60,0.14), 0 4px 12px -4px rgba(20,30,60,0.06);
    --shadow-accent: 0 8px 24px -8px var(--accent-glow);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* 背景柔和渐变 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(59,110,245,0.10), transparent 60%),
      radial-gradient(900px 500px at 110% 110%, rgba(122,92,255,0.10), transparent 60%),
      var(--bg);
    z-index: -1;
  }

  /* ===== 应用容器 ===== */
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 780px;
    margin: 0 auto;
    background: var(--surface);
    box-shadow: 0 0 0 1px var(--line-soft), 0 20px 60px -30px rgba(20,30,60,0.15);
  }
  @supports not (height: 100dvh) {
    .app { height: 100vh; }
  }

  /* ===== 顶栏 ===== */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    padding-top: calc(14px + env(safe-area-inset-top));
    border-bottom: 1px solid var(--line-soft);
    background: rgba(255,255,255,0.85);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    flex-shrink: 0;
    z-index: 10;
  }
  .logo {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #3b6ef5 0%, #7a5cff 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    box-shadow: 0 6px 16px -6px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.35);
    position: relative;
    overflow: hidden;
  }
  .logo::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.28), transparent 55%);
  }
  .brand { flex: 1; min-width: 0; }
  .brand h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .brand .sub {
    font-size: 11.5px;
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--warn);
    transition: .3s var(--ease);
    flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(245,166,35,0.15);
  }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(23,184,119,0.15); }
  .dot.err { background: var(--err); box-shadow: 0 0 0 3px rgba(255,77,79,0.15); }

  .ghost-btn {
    width: 36px; height: 36px;
    border-radius: 11px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text-2);
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: .2s var(--ease);
    flex-shrink: 0;
  }
  .ghost-btn:hover { background: var(--accent-soft); border-color: #d3ddfa; color: var(--accent); }
  .ghost-btn:active { transform: scale(.94); }

  /* ===== 主区域 ===== */
  .main {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
  }
  .main::-webkit-scrollbar { width: 6px; }
  .main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .main::-webkit-scrollbar-thumb:hover { background: #cdd2e0; }

  /* ===== 连接界面 ===== */
  .connect {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 24px 20px 32px;
    min-height: 100%;
    justify-content: center;
  }

  .hero {
    text-align: center;
    margin-bottom: 6px;
    animation: fadeUp .6s var(--ease) both;
  }
  .hero .big-logo {
    width: 72px; height: 72px;
    margin: 0 auto 18px;
    border-radius: 22px;
    background: linear-gradient(135deg, #3b6ef5 0%, #7a5cff 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px;
    box-shadow: 0 20px 44px -14px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.35);
    position: relative;
    overflow: hidden;
  }
  .hero .big-logo::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.3), transparent 55%);
  }
  .hero h2 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .hero p {
    font-size: 13.5px;
    color: var(--text-2);
    margin-top: 8px;
    line-height: 1.65;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius-lg);
    padding: 22px;
    box-shadow: var(--shadow-sm);
    animation: fadeUp .6s var(--ease) both;
  }
  .panel:nth-of-type(2) { animation-delay: .08s; }
  .panel:nth-of-type(3) { animation-delay: .16s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .panel-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-2);
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .panel-label .idx {
    width: 20px; height: 20px;
    border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    letter-spacing: 0;
    flex-shrink: 0;
    box-shadow: 0 4px 10px -3px var(--accent-glow);
  }

  /* 连接码 */
  .code {
    background: linear-gradient(135deg, #f0f4ff 0%, #f6f2ff 100%);
    border: 1px solid #e0e6fa;
    border-radius: var(--radius-md);
    padding: 22px 16px;
    text-align: center;
    cursor: pointer;
    transition: .25s var(--ease);
    position: relative;
    overflow: hidden;
  }
  .code::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
    transition: left .8s var(--ease);
  }
  .code:hover::before { left: 140%; }
  .code:active { transform: scale(.985); border-color: var(--accent); }
  .code .num {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: .2em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    padding-left: .2em;
    transition: .2s;
    text-shadow: 0 2px 8px rgba(59,110,245,0.15);
  }
  .code .hint {
    font-size: 11.5px;
    color: var(--text-3);
    margin-top: 10px;
    letter-spacing: .04em;
  }

  /* 输入行 */
  .field { display: flex; gap: 10px; }
  .field input {
    flex: 1;
    min-width: 0;
    background: var(--surface-2);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    color: var(--text);
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .18em;
    outline: none;
    transition: .2s var(--ease);
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .field input::placeholder {
    letter-spacing: .04em;
    font-weight: 400;
    color: var(--text-3);
    font-size: 14px;
  }
  .field input:focus {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    color: #fff;
    padding: 14px 24px;
    border-radius: var(--radius-md);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .01em;
    cursor: pointer;
    transition: .25s var(--ease);
    box-shadow: var(--shadow-accent), inset 0 1px 0 rgba(255,255,255,.3);
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .btn-primary::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.22), transparent 50%);
    pointer-events: none;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn-primary:active { transform: translateY(0) scale(.98); }
  .btn-primary:disabled {
    background: var(--surface-2);
    color: var(--text-3);
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }
  .btn-primary:disabled::after { display: none; }

  /* ===== 聊天区 ===== */
  .chat {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 20px 16px 12px;
  }

  .sys {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-3);
    padding: 6px 0;
  }
  .sys .pill {
    background: var(--surface);
    border: 1px solid var(--line-soft);
    padding: 4px 14px;
    border-radius: 20px;
    display: inline-block;
    box-shadow: var(--shadow-sm);
  }

  .row {
    display: flex;
    gap: 8px;
    max-width: 100%;
    animation: msgIn .35s var(--ease) both;
  }
  .row.me { flex-direction: row-reverse; }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .bubble {
    max-width: 76%;
    padding: 10px 15px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .row.them .bubble {
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-bottom-left-radius: 6px;
    box-shadow: var(--shadow-sm);
  }
  .row.me .bubble {
    background: linear-gradient(135deg, #3b6ef5, #5e7aff);
    color: #fff;
    border-bottom-right-radius: 6px;
    box-shadow: 0 6px 18px -8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .bubble .stamp {
    display: block;
    font-size: 10.5px;
    margin-top: 4px;
    opacity: .6;
    letter-spacing: .03em;
  }
  .row.me .bubble .stamp { color: rgba(255,255,255,.9); }
  .row.them .bubble .stamp { color: var(--text-3); }

  /* 文件卡片 */
  .file-card {
    width: 100%;
    max-width: 340px;
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: 18px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: var(--shadow-sm);
  }
  .row.me .file-card {
    background: linear-gradient(135deg, #eef3ff 0%, #f4f0ff 100%);
    border-color: #dfe6fb;
  }
  .file-head { display: flex; align-items: center; gap: 12px; }
  .file-icon {
    width: 46px; height: 46px;
    border-radius: 14px;
    background: linear-gradient(135deg, #3b6ef5, #7a5cff);
    display: flex; align-items: center; justify-content: center;
    font-size: 21px;
    flex-shrink: 0;
    box-shadow: 0 6px 16px -6px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.3);
    position: relative;
    overflow: hidden;
  }
  .file-icon::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.25), transparent 55%);
  }
  .file-meta { flex: 1; min-width: 0; }
  .file-meta .name {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .file-meta .size {
    font-size: 11.5px;
    color: var(--text-2);
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }

  .bar {
    height: 4px;
    background: var(--line-soft);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 3px;
    transition: width .2s var(--ease);
  }
  .bar .fill.done {
    background: linear-gradient(90deg, #17b877, #14a56a);
  }

  .file-actions {
    display: flex;
    gap: 8px;
  }
  .btn-action {
    flex: 1;
    padding: 10px;
    border-radius: 12px;
    border: none;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .02em;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: .2s var(--ease);
    font-family: inherit;
  }
  .btn-action.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    box-shadow: 0 6px 16px -6px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .btn-action.primary:active { transform: scale(.97); }
  .btn-action.ghost {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text-2);
  }
  .btn-action.ghost:hover { background: var(--surface-2); border-color: var(--accent); color: var(--accent); }
  .btn-action.ghost:active { transform: scale(.97); }

  /* ===== 预览按钮（文件卡片预览） ===== */
  .btn-preview {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text-2);
  }
  .btn-preview:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  /* ===== 底部输入栏 ===== */
  .composer {
    flex-shrink: 0;
    padding: 12px 16px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,0.92);
    border-top: 1px solid var(--line-soft);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    display: flex;
    align-items: flex-end;
    gap: 10px;
  }
  .composer .attach {
    width: 44px; height: 44px;
    border-radius: 14px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text-2);
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: .2s var(--ease);
  }
  .composer .attach:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .composer .attach:active { transform: scale(.94); }

  .composer textarea {
    flex: 1;
    min-width: 0;
    background: var(--surface-2);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    line-height: 1.4;
    outline: none;
    resize: none;
    max-height: 120px;
    min-height: 44px;
    transition: .2s var(--ease);
  }
  .composer textarea::placeholder { color: var(--text-3); }
  .composer textarea:focus {
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  .composer .send {
    width: 44px; height: 44px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 17px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: .25s var(--ease);
    box-shadow: 0 6px 18px -6px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.3);
    position: relative;
    overflow: hidden;
  }
  .composer .send::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.2), transparent 55%);
  }
  .composer .send:active { transform: scale(.94); }
  .composer .send:disabled {
    background: var(--surface-2);
    color: var(--text-3);
    box-shadow: none;
    cursor: not-allowed;
  }
  .composer .send:disabled::after { display: none; }

  /* ===== 拖拽 ===== */
  .dragging .main {
    outline: 2px dashed var(--accent);
    outline-offset: -12px;
    border-radius: 16px;
    background: var(--accent-soft);
  }

  /* ===== 预览弹窗 ===== */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(15, 20, 35, 0.65);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s var(--ease);
  }
  .modal.show { opacity: 1; pointer-events: auto; }

  .modal-inner {
    background: var(--surface);
    border-radius: 20px;
    width: 100%;
    max-width: 720px;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.5);
    transform: scale(.94) translateY(10px);
    transition: transform .3s var(--ease);
  }
  .modal.show .modal-inner { transform: scale(1) translateY(0); }

  .modal-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line-soft);
    flex-shrink: 0;
  }
  .modal-head .title {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .modal-head .title small {
    display: block;
    font-size: 11px;
    font-weight: 400;
    color: var(--text-3);
    margin-top: 1px;
  }
  .modal-close {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text-2);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: .2s;
  }
  .modal-close:hover { background: var(--err-soft); border-color: #ffd0d0; color: var(--err); }

  .modal-body {
    flex: 1;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-soft);
    min-height: 200px;
    -webkit-overflow-scrolling: touch;
  }
  .modal-body img,
  .modal-body video {
    max-width: 100%;
    max-height: 75vh;
    display: block;
  }
  .modal-body audio {
    width: 90%;
    max-width: 480px;
    margin: 40px 20px;
  }
  .modal-body pre {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 20px;
    font-family: "SF Mono", "Monaco", "Consolas", monospace;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    overflow: auto;
    background: var(--surface);
    align-self: stretch;
  }
  .modal-body iframe {
    width: 100%;
    height: 75vh;
    border: none;
    background: #fff;
  }

  .modal-foot {
    padding: 12px 18px;
    border-top: 1px solid var(--line-soft);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .modal-foot .btn-action { flex: 1; }

  /* ===== 隐藏 ===== */
  .hide { display: none !important; }

  /* ===== 响应式 ===== */
  @media (max-width: 480px) {
    .code .num { font-size: 32px; }
    .hero .big-logo { width: 64px; height: 64px; font-size: 34px; }
    .hero h2 { font-size: 20px; }
    .bubble { max-width: 80%; }
    .modal { padding: 12px; }
  }

  /* ===== 加载动画 ===== */
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    color: var(--text-3);
    font-size: 13px;
    padding: 60px 20px;
  }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="logo">🐃</div>
    <div class="brand">
      <h1>牦牛文件传输助手</h1>
      <div class="sub">
        <span class="dot" id="dot"></span>
        <span id="statusText">正在初始化…</span>
      </div>
    </div>
    <button class="ghost-btn" id="btnReset" title="断开连接" onclick="resetAll()">⟳</button>
  </header>

  <!-- 主区域 -->
  <main class="main" id="main">
    <!-- 连接界面 -->
    <section class="connect" id="connectView">
      <div class="hero">
        <div class="big-logo">🐃</div>
        <h2>牦牛文件传输助手</h2>
        <p>手机 ↔ 电脑 · 点对点直传 · 无需服务器<br>图片 / 视频 / 音乐 / 文本，先看不下载</p>
      </div>

      <div class="panel">
        <div class="panel-label"><span class="idx">1</span>我的连接码</div>
        <div class="code" onclick="copyCode()">
          <div class="num" id="myCode">------</div>
          <div class="hint">轻触复制 · 发给对方</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-label"><span class="idx">2</span>连接对方</div>
        <div class="field">
          <input type="text" id="peerInput" placeholder="输入 6 位连接码" inputmode="numeric" maxlength="6" autocomplete="off">
          <button class="btn-primary" id="btnConnect" onclick="connectPeer()">连接</button>
        </div>
      </div>
    </section>

    <!-- 聊天界面 -->
    <section class="chat hide" id="chatView"></section>
  </main>

  <!-- 底部输入栏 -->
  <footer class="composer hide" id="composer">
    <label class="attach" title="发送文件">
      📎
      <input type="file" id="fileInput" multiple style="display:none">
    </label>
    <textarea id="msgInput" placeholder="输入消息…" rows="1"></textarea>
    <button class="send" id="btnSend" onclick="sendText()" title="发送">➤</button>
  </footer>

</div>

<!-- 预览弹窗 -->
<div class="modal" id="modal">
  <div class="modal-inner">
    <div class="modal-head">
      <div class="title" id="modalTitle">预览<small id="modalSub"></small></div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* =========================================================
   牦牛文件传输助手
   ========================================================= */

const CHUNK_SIZE = 16 * 1024;
const MAX_BUFFER = 1.5 * 1024 * 1024;

let peer = null;
let conn = null;
let myCode = '';
let isConnected = false;
let recvFile = null;

const $ = id => document.getElementById(id);
const els = {
  app: $('app'),
  dot: $('dot'),
  statusText: $('statusText'),
  myCode: $('myCode'),
  peerInput: $('peerInput'),
  btnConnect: $('btnConnect'),
  connectView: $('connectView'),
  chatView: $('chatView'),
  composer: $('composer'),
  msgInput: $('msgInput'),
  fileInput: $('fileInput'),
  main: $('main'),
  modal: $('modal'),
  modalTitle: $('modalTitle'),
  modalSub: $('modalSub'),
  modalBody: $('modalBody'),
  modalFoot: $('modalFoot'),
};

// 预览用的 URL 缓存（避免重复创建）
const previewCache = new Map(); // id -> { url, blob, name, type, size }

// ---------- 状态 ----------
function setStatus(text, state) {
  els.statusText.textContent = text;
  els.dot.className = 'dot' + (state ? ' ' + state : '');
}

function genCode() {
  return String(Math.floor(100000 + Math.random() * 900000));
}

function copyCode() {
  if (!myCode) return;
  const done = () => {
    const el = els.myCode;
    const old = el.textContent;
    el.textContent = '已复制 ✓';
    el.style.letterSpacing = '0';
    setTimeout(() => { el.textContent = old; el.style.letterSpacing = ''; }, 900);
  };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(myCode).then(done).catch(() => fallbackCopy(myCode, done));
  } else {
    fallbackCopy(myCode, done);
  }
}
function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); cb(); } catch (e) {}
  document.body.removeChild(ta);
}

// ---------- PeerJS ----------
function initPeer() {
  myCode = genCode();
  peer = new Peer(myCode, {
    debug: 1,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' },
      ],
    },
  });

  peer.on('open', id => {
    myCode = id;
    els.myCode.textContent = id;
    setStatus('已就绪，等待连接', 'on');
  });

  peer.on('connection', c => {
    if (conn && conn.open) { c.close(); return; }
    bindConn(c);
    setStatus('对方已连接', 'on');
  });

  peer.on('error', err => {
    console.error(err);
    if (err.type === 'unavailable-id') { peer.destroy(); initPeer(); }
    else if (err.type === 'peer-unavailable') {
      setStatus('连接码不存在或对方不在线', 'err');
      els.btnConnect.disabled = false;
      els.btnConnect.textContent = '连接';
    } else {
      setStatus('连接异常：' + err.type, 'err');
    }
  });

  peer.on('disconnected', () => {
    setStatus('信令断开，重连中…', '');
    peer.reconnect();
  });
}

function connectPeer() {
  const target = els.peerInput.value.trim();
  if (!/^\d{6}$/.test(target)) { setStatus('请输入 6 位数字连接码', 'err'); return; }
  if (target === myCode) { setStatus('不能连接自己', 'err'); return; }
  els.btnConnect.disabled = true;
  els.btnConnect.textContent = '连接中';
  setStatus('正在连接 ' + target + ' …', '');
  const c = peer.connect(target, { reliable: true });
  bindConn(c);
}

function bindConn(c) {
  conn = c;
  c.on('open', () => {
    isConnected = true;
    els.btnConnect.disabled = false;
    els.btnConnect.textContent = '连接';
    setStatus('已连接 · 可传文件 / 发消息', 'on');
    showChat();
    addSys('已建立点对点连接 🔒');
  });
  c.on('data', handleData);
  c.on('close', () => {
    isConnected = false;
    conn = null;
    setStatus('连接已断开', '');
    addSys('连接已断开');
    setTimeout(() => { els.btnConnect.disabled = false; els.btnConnect.textContent = '连接'; }, 100);
  });
  c.on('error', err => { console.error(err); setStatus('连接错误', 'err'); });
}

function showChat() {
  els.connectView.classList.add('hide');
  els.chatView.classList.remove('hide');
  els.composer.classList.remove('hide');
  scrollBottom(true);
}

function resetAll() {
  if (conn) { try { conn.close(); } catch(e){} conn = null; }
  isConnected = false;
  recvFile = null;
  previewCache.forEach(v => URL.revokeObjectURL(v.url));
  previewCache.clear();
  els.chatView.innerHTML = '';
  els.chatView.classList.add('hide');
  els.composer.classList.add('hide');
  els.connectView.classList.remove('hide');
  els.peerInput.value = '';
  els.btnConnect.disabled = false;
  els.btnConnect.textContent = '连接';
  setStatus('已就绪，等待连接', 'on');
}

function scrollBottom(instant) {
  requestAnimationFrame(() => {
    if (instant) els.main.scrollTop = els.main.scrollHeight;
    else els.main.scrollTo({ top: els.main.scrollHeight, behavior: 'smooth' });
  });
}

function nowStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getHours())}:${p(d.getMinutes())}`;
}

function addSys(text) {
  const div = document.createElement('div');
  div.className = 'sys';
  div.innerHTML = `<span class="pill">${escapeHtml(text)}</span>`;
  els.chatView.appendChild(div);
  scrollBottom();
}

function addText(text, mine) {
  const row = document.createElement('div');
  row.className = 'row ' + (mine ? 'me' : 'them');
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  const s = document.createElement('span');
  s.className = 'stamp';
  s.textContent = nowStr();
  b.appendChild(s);
  row.appendChild(b);
  els.chatView.appendChild(row);
  scrollBottom();
}

function sendText() {
  const v = els.msgInput.value.trim();
  if (!v || !isConnected || !conn) return;
  conn.send(JSON.stringify({ t: 'text', v }));
  addText(v, true);
  els.msgInput.value = '';
  autoResize();
}

function autoResize() {
  const ta = els.msgInput;
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
}
els.msgInput.addEventListener('input', autoResize);
els.msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendText();
  }
});

// ---------- 处理接收数据 ----------
function handleData(data) {
  if (typeof data === 'string') {
    let msg;
    try { msg = JSON.parse(data); } catch(e) { return; }

    if (msg.t === 'text') {
      addText(msg.v, false);
    } else if (msg.t === 'fstart') {
      recvFile = {
        id: msg.id,
        name: msg.name,
        size: msg.size,
        mime: msg.mime || 'application/octet-stream',
        total: msg.total,
        chunks: new Array(msg.total),
        received: 0,
        gotChunks: 0,
        el: null,
        barEl: null,
        sizeEl: null,
      };
      renderRecvFile(recvFile);
    } else if (msg.t === 'fend') {
      if (recvFile && recvFile.id === msg.id) {
        finishRecv(recvFile);
        recvFile = null;
      }
    }
    return;
  }

  let buf = null;
  if (data instanceof ArrayBuffer) buf = data;
  else if (data instanceof Uint8Array) buf = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
  else if (data && data.buffer instanceof ArrayBuffer) buf = data.buffer;
  if (!buf || !recvFile) return;

  try {
    const dv = new DataView(buf);
    const idLen = dv.getUint32(0);
    const idBytes = new Uint8Array(buf, 4, idLen);
    const id = new TextDecoder().decode(idBytes);
    if (id !== recvFile.id) return;
    const seq = dv.getUint32(4 + idLen);
    const chunk = buf.slice(8 + idLen);
    if (recvFile.chunks[seq]) return;
    recvFile.chunks[seq] = chunk;
    recvFile.received += chunk.byteLength;
    recvFile.gotChunks++;
    updateRecvFile(recvFile);
  } catch(e) {
    console.warn('块解析失败', e);
  }
}

// ---------- 接收文件 UI ----------
function renderRecvFile(info) {
  const row = document.createElement('div');
  row.className = 'row them';
  row.innerHTML = `
    <div class="file-card">
      <div class="file-head">
        <div class="file-icon">${getFileIcon(info.name, info.mime)}</div>
        <div class="file-meta">
          <div class="name">${escapeHtml(info.name)}</div>
          <div class="size">接收中 0%</div>
        </div>
      </div>
      <div class="bar"><div class="fill"></div></div>
    </div>`;
  els.chatView.appendChild(row);
  info.el = row;
  info.barEl = row.querySelector('.fill');
  info.sizeEl = row.querySelector('.size');
  scrollBottom();
}

function updateRecvFile(info) {
  const p = info.size ? info.received / info.size : 0;
  info.barEl.style.width = Math.min(100, p * 100).toFixed(1) + '%';
  info.sizeEl.textContent = `接收中 ${(p*100).toFixed(0)}% · ${formatSize(info.received)} / ${formatSize(info.size)}`;
}

function finishRecv(info) {
  if (info.gotChunks !== info.total) {
    info.sizeEl.textContent = `接收不完整 (${info.gotChunks}/${info.total})`;
    info.barEl.classList.add('done');
    return;
  }
  const blob = new Blob(info.chunks, { type: info.mime });
  const url = URL.createObjectURL(blob);

  previewCache.set(info.id, {
    url, blob,
    name: info.name,
    type: info.mime,
    size: info.size,
  });

  info.barEl.style.width = '100%';
  info.barEl.classList.add('done');
  info.sizeEl.textContent = `已完成 · ${formatSize(info.size)}`;

  const actions = document.createElement('div');
  actions.className = 'file-actions';

  if (canPreview(info.mime, info.name)) {
    const pv = document.createElement('button');
    pv.className = 'btn-action btn-preview';
    pv.textContent = '👁 预览';
    pv.onclick = () => openPreview(info.id);
    actions.appendChild(pv);
  }

  const dl = document.createElement('a');
  dl.className = 'btn-action primary';
  dl.href = url;
  dl.download = info.name;
  dl.textContent = '⬇ 下载';
  actions.appendChild(dl);

  info.el.querySelector('.file-card').appendChild(actions);
  scrollBottom();
}

// ---------- 判断能否预览 ----------
function canPreview(mime, name) {
  const m = (mime || '').toLowerCase();
  const n = (name || '').toLowerCase();
  if (m.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|bmp|svg|avif)$/.test(n)) return true;
  if (m.startsWith('video/') || /\.(mp4|webm|mov|m4v|ogv|mkv)$/.test(n)) return true;
  if (m.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|opus)$/.test(n)) return true;
  if (m.startsWith('text/') || m === 'application/json' || m === 'application/xml') return true;
  if (/\.(txt|md|json|xml|html|css|js|ts|py|java|c|cpp|go|rs|sh|yaml|yml|log|csv|ini|toml)$/.test(n)) return true;
  if (m === 'application/pdf' || /\.pdf$/.test(n)) return true;
  return false;
}

function getFileIcon(name, mime) {
  const m = (mime || '').toLowerCase();
  const n = (name || '').toLowerCase();
  if (m.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|bmp|svg|avif)$/.test(n)) return '🖼';
  if (m.startsWith('video/') || /\.(mp4|webm|mov|m4v|ogv|mkv)$/.test(n)) return '🎬';
  if (m.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|opus)$/.test(n)) return '🎵';
  if (m === 'application/pdf' || /\.pdf$/.test(n)) return '📕';
  if (/\.(zip|rar|7z|tar|gz|bz2|xz)$/.test(n)) return '🗜';
  if (m.startsWith('text/') || /\.(txt|md|json|xml|html|css|js|ts|py|java|c|cpp|go|rs|sh|yaml|yml|log|csv|ini|toml)$/.test(n)) return '📝';
  return '📄';
}

// ---------- 预览弹窗 ----------
function openPreview(id) {
  const item = previewCache.get(id);
  if (!item) return;

  els.modalTitle.childNodes[0].nodeValue = item.name;
  els.modalSub.textContent = `${formatSize(item.size)} · ${item.type || '未知类型'}`;

  els.modalBody.innerHTML = '';
  els.modalFoot.innerHTML = '';

  const m = (item.type || '').toLowerCase();
  const n = item.name.toLowerCase();

  if (m.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|bmp|svg|avif)$/.test(n)) {
    const img = document.createElement('img');
    img.src = item.url;
    img.alt = item.name;
    els.modalBody.appendChild(img);
  } else if (m.startsWith('video/') || /\.(mp4|webm|mov|m4v|ogv|mkv)$/.test(n)) {
    const v = document.createElement('video');
    v.src = item.url;
    v.controls = true;
    v.autoplay = true;
    v.playsInline = true;
    v.preload = 'metadata';
    els.modalBody.appendChild(v);
  } else if (m.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|opus)$/.test(n)) {
    const a = document.createElement('audio');
    a.src = item.url;
    a.controls = true;
    a.autoplay = true;
    els.modalBody.appendChild(a);
  } else if (m === 'application/pdf' || /\.pdf$/.test(n)) {
    const ifr = document.createElement('iframe');
    ifr.src = item.url;
    els.modalBody.appendChild(ifr);
  } else if (m.startsWith('text/') || m === 'application/json' || m === 'application/xml' ||
             /\.(txt|md|json|xml|html|css|js|ts|py|java|c|cpp|go|rs|sh|yaml|yml|log|csv|ini|toml)$/.test(n)) {
    const pre = document.createElement('pre');
    pre.textContent = '加载中…';
    els.modalBody.appendChild(pre);
    item.blob.text().then(txt => {
      // 限制显示长度，避免超大文本卡顿
      const MAX = 200000;
      if (txt.length > MAX) {
        pre.textContent = txt.slice(0, MAX) + `\n\n… 已截断，完整内容请下载查看（共 ${txt.length} 字符）`;
      } else {
        pre.textContent = txt;
      }
    }).catch(() => { pre.textContent = '无法读取文本内容'; });
  } else {
    els.modalBody.innerHTML = '<div class="loading">该类型暂不支持预览</div>';
  }

  // 底部按钮
  const dlBtn = document.createElement('a');
  dlBtn.className = 'btn-action primary';
  dlBtn.href = item.url;
  dlBtn.download = item.name;
  dlBtn.textContent = '⬇ 下载到本地';
  els.modalFoot.appendChild(dlBtn);

  const closeBtn = document.createElement('button');
  closeBtn.className = 'btn-action ghost';
  closeBtn.textContent = '关闭';
  closeBtn.onclick = closeModal;
  els.modalFoot.appendChild(closeBtn);

  els.modal.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  els.modal.classList.remove('show');
  // 停止播放
  const v = els.modalBody.querySelector('video');
  const a = els.modalBody.querySelector('audio');
  if (v) { v.pause(); v.src = ''; }
  if (a) { a.pause(); a.src = ''; }
  els.modalBody.innerHTML = '';
  document.body.style.overflow = '';
  setTimeout(() => {
    els.modalTitle.childNodes[0].nodeValue = '预览';
    els.modalSub.textContent = '';
    els.modalFoot.innerHTML = '';
  }, 300);
}

// ESC 关闭
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && els.modal.classList.contains('show')) closeModal();
});
// 点击遮罩关闭
els.modal.addEventListener('click', e => {
  if (e.target === els.modal) closeModal();
});

// ---------- 发送文件 ----------
async function sendFiles(fileList) {
  if (!isConnected || !conn) return;
  for (const file of fileList) {
    await sendOneFile(file);
  }
}

function sendOneFile(file) {
  return new Promise(async resolve => {
    const id = Math.random().toString(36).slice(2, 10);
    const total = Math.ceil(file.size / CHUNK_SIZE);

    conn.send(JSON.stringify({
      t: 'fstart', id,
      name: file.name,
      size: file.size,
      mime: file.type || 'application/octet-stream',
      total,
    }));

    // 保存本地以便自己的预览（可选）
    previewCache.set(id, {
      url: URL.createObjectURL(file),
      blob: file,
      name: file.name,
      type: file.type || 'application/octet-stream',
      size: file.size,
    });

    const card = renderSendFile(file, id);
    card.setStatus('准备中…');

    let seq = 0;
    let offset = 0;

    const sendNext = () => {
      if (offset >= file.size) {
        conn.send(JSON.stringify({ t: 'fend', id }));
        card.setDone();
        resolve();
        return;
      }
      const slice = file.slice(offset, offset + CHUNK_SIZE);
      const reader = new FileReader();
      reader.onload = e => {
        const buf = e.target.result;
        const packet = packChunk(id, seq, buf);
        waitBuffer(() => {
          if (!conn || !conn.open) { resolve(); return; }
          conn.send(packet);
          offset += buf.byteLength;
          seq++;
          card.setProgress(offset / file.size);
          sendNext();
        });
      };
      reader.onerror = () => { card.setError(); resolve(); };
      reader.readAsArrayBuffer(slice);
    };
    sendNext();
  });
}

function packChunk(id, seq, buf) {
  const idBytes = new TextEncoder().encode(id);
  const out = new ArrayBuffer(4 + idBytes.length + 4 + buf.byteLength);
  const dv = new DataView(out);
  dv.setUint32(0, idBytes.length);
  new Uint8Array(out, 4, idBytes.length).set(idBytes);
  dv.setUint32(4 + idBytes.length, seq);
  new Uint8Array(out, 8 + idBytes.length).set(new Uint8Array(buf));
  return out;
}

function waitBuffer(cb) {
  const dc = conn && conn.dataChannel;
  if (!dc || dc.bufferedAmount < MAX_BUFFER) { cb(); return; }
  setTimeout(() => waitBuffer(cb), 25);
}

function renderSendFile(file, id) {
  const row = document.createElement('div');
  row.className = 'row me';
  row.innerHTML = `
    <div class="file-card">
      <div class="file-head">
        <div class="file-icon">${getFileIcon(file.name, file.type)}</div>
        <div class="file-meta">
          <div class="name">${escapeHtml(file.name)}</div>
          <div class="size">准备中…</div>
        </div>
      </div>
      <div class="bar"><div class="fill"></div></div>
    </div>`;
  els.chatView.appendChild(row);
  const bar = row.querySelector('.fill');
  const sizeEl = row.querySelector('.size');
  scrollBottom();

  return {
    setStatus(t) { sizeEl.textContent = t; },
    setProgress(p) {
      bar.style.width = (p * 100).toFixed(1) + '%';
      sizeEl.textContent = `发送中 ${(p*100).toFixed(0)}% · ${formatSize(p*file.size)} / ${formatSize(file.size)}`;
    },
    setDone() {
      bar.style.width = '100%';
      bar.classList.add('done');
      sizeEl.textContent = `已发送 · ${formatSize(file.size)}`;

      const actions = document.createElement('div');
      actions.className = 'file-actions';

      if (canPreview(file.type, file.name)) {
        const pv = document.createElement('button');
        pv.className = 'btn-action btn-preview';
        pv.textContent = '👁 预览';
        pv.onclick = () => openPreview(id);
        actions.appendChild(pv);
      }

      const dl = document.createElement('a');
      dl.className = 'btn-action primary';
      dl.href = previewCache.get(id).url;
      dl.download = file.name;
      dl.textContent = '⬇ 下载';
      actions.appendChild(dl);

      row.querySelector('.file-card').appendChild(actions);
      scrollBottom();
    },
    setError() {
      bar.style.background = 'var(--err)';
      sizeEl.textContent = '发送失败';
    },
  };
}

// ---------- 工具 ----------
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  if (bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1) + ' MB';
  return (bytes/1024/1024/1024).toFixed(2) + ' GB';
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- 事件 ----------
els.fileInput.addEventListener('change', e => {
  if (e.target.files.length) sendFiles(e.target.files);
  e.target.value = '';
});

els.peerInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') connectPeer();
});
els.peerInput.addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
});

// 拖拽
['dragenter', 'dragover'].forEach(ev => {
  document.addEventListener(ev, e => {
    if (!isConnected) return;
    e.preventDefault();
    els.app.classList.add('dragging');
  });
});
['dragleave', 'drop'].forEach(ev => {
  document.addEventListener(ev, e => {
    e.preventDefault();
    if (ev === 'dragleave' && e.relatedTarget) return;
    els.app.classList.remove('dragging');
  });
});
document.addEventListener('drop', e => {
  if (!isConnected) return;
  if (e.dataTransfer.files.length) sendFiles(e.dataTransfer.files);
});

// ---------- 启动 ----------
initPeer();
</script>
</body>
</html>
