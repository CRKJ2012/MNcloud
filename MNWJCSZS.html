<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fafbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1015" media="(prefers-color-scheme: dark)">
<title>牦牛文件传输助手</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

  :root {
    --bg: #f7f8fb;
    --bg-elev: #ffffff;
    --surface: #ffffff;
    --surface-2: #f4f5f9;
    --surface-3: #eceef5;
    --line: #e8eaf1;
    --line-strong: #dcdfe9;
    --text: #0f1220;
    --text-2: #4a5163;
    --text-3: #8a91a5;
    --text-4: #b8bdcb;
    --accent: #3b6ef5;
    --accent-2: #7a5cff;
    --accent-soft: #eef3ff;
    --accent-line: #d6e0ff;
    --accent-glow: rgba(59,110,245,0.28);
    --ok: #17b877;
    --ok-soft: #e6f9f1;
    --warn: #f5a623;
    --warn-soft: #fff7e6;
    --err: #ff4d4f;
    --err-soft: #fff1f0;
    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 18px;
    --r-xl: 24px;
    --shadow-sm: 0 1px 2px rgba(15,20,40,0.04), 0 2px 6px -2px rgba(15,20,40,0.06);
    --shadow-md: 0 2px 4px rgba(15,20,40,0.03), 0 8px 20px -8px rgba(15,20,40,0.10);
    --shadow-lg: 0 4px 8px rgba(15,20,40,0.04), 0 20px 40px -16px rgba(15,20,40,0.16);
    --shadow-xl: 0 8px 16px rgba(15,20,40,0.06), 0 32px 64px -24px rgba(15,20,40,0.22);
    --shadow-accent: 0 6px 20px -6px var(--accent-glow);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  [data-theme="dark"] {
    --bg: #0a0c12;
    --bg-elev: #10131b;
    --surface: #14171f;
    --surface-2: #1a1e27;
    --surface-3: #222732;
    --line: #232833;
    --line-strong: #2e3441;
    --text: #f4f6fa;
    --text-2: #a8b0c2;
    --text-3: #6d7688;
    --text-4: #4a5266;
    --accent: #5b8cff;
    --accent-2: #9b7dff;
    --accent-soft: rgba(91,140,255,0.12);
    --accent-line: rgba(91,140,255,0.28);
    --accent-glow: rgba(91,140,255,0.35);
    --ok-soft: rgba(23,184,119,0.14);
    --warn-soft: rgba(245,166,35,0.14);
    --err-soft: rgba(255,77,79,0.14);
  }

  html, body { height: 100%; width: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14.5px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
    position: fixed;
    inset: 0;
    letter-spacing: -0.005em;
  }

  .app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    background: var(--surface);
    overflow: hidden;
  }

  /* ===== 顶栏 ===== */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    padding-top: calc(12px + env(safe-area-inset-top));
    border-bottom: 1px solid var(--line);
    background: var(--bg-elev);
    flex-shrink: 0;
    z-index: 10;
    position: relative;
  }
  .logo {
    width: 38px; height: 38px;
    border-radius: 11px;
    background: linear-gradient(135deg, #3b6ef5 0%, #7a5cff 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: 0 6px 16px -6px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.4);
    position: relative;
    overflow: hidden;
  }
  .logo::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.3), transparent 55%);
  }
  .brand { flex: 1; min-width: 0; }
  .brand h1 {
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .brand .sub {
    font-size: 11.5px;
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 1px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--warn);
    transition: .3s var(--ease);
    flex-shrink: 0;
    box-shadow: 0 0 0 3px var(--warn-soft);
  }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  .dot.err { background: var(--err); box-shadow: 0 0 0 3px var(--err-soft); }

  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 11px;
    background: transparent;
    border: none;
    color: var(--text-3);
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: .2s var(--ease);
    flex-shrink: 0;
    font-family: inherit;
    position: relative;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn.hide { display: none; }

  /* 牦牛AI 入口按钮 */
  .ai-btn {
    height: 36px;
    padding: 0 14px 0 10px;
    border-radius: 11px;
    border: none;
    background: linear-gradient(135deg, #ff3300 0%, #ff6b35 50%, #ff8e53 100%);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .01em;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: .2s var(--ease);
    box-shadow: 0 6px 16px -6px rgba(255,107,53,.55), inset 0 1px 0 rgba(255,255,255,.3);
    flex-shrink: 0;
    font-family: inherit;
    position: relative;
    overflow: hidden;
  }
  .ai-btn::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.22), transparent 55%);
    pointer-events: none;
  }
  .ai-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -6px rgba(255,107,53,.6); }
  .ai-btn:active { transform: translateY(0) scale(.96); }
  .ai-btn .ai-icon { font-size: 15px; line-height: 1; }
  .ai-btn .ai-txt { font-size: 12.5px; }

  @media (max-width: 480px) {
    .ai-btn { padding: 0 12px; }
    .ai-btn .ai-txt { display: none; }
  }

  /* ===== 主区域 ===== */
  .main {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    background: var(--surface);
    position: relative;
    width: 100%;
  }
  .main::-webkit-scrollbar { width: 8px; }
  .main::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; border: 2px solid var(--surface); }

  /* ===== 连接页 ===== */
  .connect-page {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: 40px 24px 48px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    animation: fadeUp .5s var(--ease) both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .connect-hero {
    text-align: center;
    margin-bottom: 8px;
  }
  .connect-hero .big-logo {
    width: 72px; height: 72px;
    margin: 0 auto 16px;
    border-radius: 22px;
    background: linear-gradient(135deg, #3b6ef5 0%, #7a5cff 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    box-shadow: 0 20px 44px -14px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.4);
    position: relative;
    overflow: hidden;
  }
  .connect-hero .big-logo::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.35), transparent 55%);
  }
  .connect-hero h2 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .connect-hero p {
    font-size: 13.5px;
    color: var(--text-2);
    margin-top: 6px;
    line-height: 1.6;
  }

  .card {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 18px;
    box-shadow: var(--shadow-sm);
  }

  .card-label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-3);
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-label .idx {
    width: 18px; height: 18px;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    letter-spacing: 0;
    flex-shrink: 0;
  }

  .my-code {
    background: linear-gradient(135deg, var(--accent-soft) 0%, rgba(122,92,255,0.06) 100%);
    border: 1px solid var(--accent-line);
    border-radius: var(--r-md);
    padding: 20px 16px;
    text-align: center;
    cursor: pointer;
    transition: .25s var(--ease);
    position: relative;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .my-code::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
    transition: left .8s var(--ease);
  }
  .my-code:hover::before { left: 140%; }
  .my-code:hover { border-color: var(--accent); }
  .my-code:active { transform: scale(.985); }
  .my-code .num {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: .2em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    padding-left: .2em;
  }
  .my-code .hint {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 8px;
    letter-spacing: .04em;
  }
  .my-code-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .scan-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: var(--r-md);
    padding: 18px;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    transition: .2s var(--ease);
    box-shadow: var(--shadow-accent), inset 0 1px 0 rgba(255,255,255,.3);
    position: relative;
    overflow: hidden;
    font-family: inherit;
  }
  .scan-btn::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.18), transparent 50%);
    pointer-events: none;
  }
  .scan-btn:hover { transform: translateY(-1px); box-shadow: 0 10px 26px -6px var(--accent-glow); }
  .scan-btn:active { transform: translateY(0) scale(.98); }
  .scan-btn .ico {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    backdrop-filter: blur(10px);
  }
  .scan-btn .txt { flex: 1; min-width: 0; }
  .scan-btn .txt .t {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .scan-btn .txt .s {
    font-size: 11.5px;
    opacity: .85;
    margin-top: 1px;
  }

  .field { display: flex; gap: 8px; }
  .field input {
    flex: 1;
    min-width: 0;
    background: var(--surface-2);
    border: 1.5px solid var(--line);
    border-radius: var(--r-md);
    padding: 12px 14px;
    color: var(--text);
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .18em;
    outline: none;
    transition: .2s var(--ease);
    font-variant-numeric: tabular-nums;
    text-align: center;
    font-family: inherit;
  }
  .field input::placeholder {
    letter-spacing: .04em;
    font-weight: 400;
    color: var(--text-4);
    font-size: 13px;
  }
  .field input:focus {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .field .btn { padding: 12px 20px; }

  .btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    color: #fff;
    border-radius: var(--r-md);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s var(--ease);
    box-shadow: var(--shadow-accent), inset 0 1px 0 rgba(255,255,255,.3);
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.2), transparent 50%);
    pointer-events: none;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0) scale(.98); }
  .btn:disabled {
    background: var(--surface-2);
    color: var(--text-4);
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }
  .btn:disabled::after { display: none; }
  .btn.ghost {
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text-2);
    box-shadow: none;
  }
  .btn.ghost::after { display: none; }
  .btn.ghost:hover { background: var(--surface-3); border-color: var(--line-strong); }
  .btn.block { width: 100%; padding: 12px; }

  .history-list { display: flex; flex-direction: column; gap: 6px; }
  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    border-radius: var(--r-sm);
    background: var(--surface-2);
    border: 1px solid var(--line);
    cursor: pointer;
    transition: .18s var(--ease);
    font-size: 13px;
    color: var(--text-2);
  }
  .history-item:hover { background: var(--surface-3); border-color: var(--line-strong); }
  .history-item .code {
    font-family: "SF Mono", "Monaco", monospace;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: .05em;
    font-size: 13px;
  }
  .history-item .meta { flex: 1; text-align: right; font-size: 11px; color: var(--text-4); }
  .history-item .del {
    color: var(--text-4);
    font-size: 14px;
    padding: 2px 6px;
    border-radius: 6px;
    transition: .15s;
  }
  .history-item .del:hover { background: var(--err-soft); color: var(--err); }

  /* ===== 聊天 ===== */
  .chat-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .chat {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 20px 24px 12px;
    width: 100%;
    max-width: 820px;
  }

  .sys {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-3);
    padding: 6px 0;
  }
  .sys .pill {
    background: var(--surface-2);
    border: 1px solid var(--line);
    padding: 4px 14px;
    border-radius: 20px;
    display: inline-block;
  }

  .row {
    display: flex;
    gap: 8px;
    max-width: 100%;
    animation: msgIn .3s var(--ease) both;
    position: relative;
  }
  .row.me { flex-direction: row-reverse; }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bubble-wrap { position: relative; max-width: 76%; }
  .row.me .bubble-wrap { display: flex; flex-direction: column; align-items: flex-end; }

  .bubble {
    padding: 10px 15px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-wrap;
    position: relative;
  }
  .row.them .bubble {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-bottom-left-radius: 6px;
    color: var(--text);
  }
  .row.me .bubble {
    background: linear-gradient(135deg, #3b6ef5, #5e7aff);
    color: #fff;
    border-bottom-right-radius: 6px;
    box-shadow: 0 4px 14px -6px var(--accent-glow);
  }
  .bubble .stamp {
    display: block;
    font-size: 10.5px;
    margin-top: 4px;
    opacity: .6;
    letter-spacing: .03em;
  }
  .row.me .bubble .stamp { color: rgba(255,255,255,.9); }
  .row.them .bubble .stamp { color: var(--text-3); }

  .bubble-actions {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    gap: 2px;
    opacity: 0;
    transition: .18s var(--ease);
    pointer-events: none;
  }
  .row.me .bubble-actions { right: calc(100% + 8px); }
  .row.them .bubble-actions { left: calc(100% + 8px); }
  .row:hover .bubble-actions { opacity: 1; pointer-events: auto; }
  .bubble-actions button {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    color: var(--text-3);
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-sm);
    font-family: inherit;
  }
  .bubble-actions button:hover { background: var(--surface-2); color: var(--accent); border-color: var(--accent-line); }

  .file-card {
    width: 100%;
    min-width: 280px;
    max-width: 400px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: var(--shadow-sm);
  }
  .row.me .file-card {
    background: linear-gradient(135deg, var(--accent-soft) 0%, rgba(122,92,255,0.04) 100%);
    border-color: var(--accent-line);
  }
  .file-head { display: flex; align-items: center; gap: 12px; }
  .file-icon {
    width: 46px; height: 46px;
    border-radius: 14px;
    background: linear-gradient(135deg, #3b6ef5, #7a5cff);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    box-shadow: 0 6px 16px -6px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.3);
    position: relative;
    overflow: hidden;
  }
  .file-icon::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.25), transparent 55%);
  }
  .file-icon.img { background: linear-gradient(135deg, #f59e0b, #ef4444); box-shadow: 0 6px 16px -6px rgba(245,158,11,.4); }
  .file-icon.vid { background: linear-gradient(135deg, #ec4899, #8b5cf6); box-shadow: 0 6px 16px -6px rgba(236,72,153,.4); }
  .file-icon.aud { background: linear-gradient(135deg, #06b6d4, #3b82f6); box-shadow: 0 6px 16px -6px rgba(6,182,212,.4); }
  .file-icon.doc { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 6px 16px -6px rgba(16,185,129,.4); }
  .file-icon.zip { background: linear-gradient(135deg, #64748b, #334155); box-shadow: 0 6px 16px -6px rgba(100,116,139,.4); }

  .file-meta { flex: 1; min-width: 0; }
  .file-meta .name {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .file-meta .size {
    font-size: 11.5px;
    color: var(--text-2);
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }

  .bar {
    height: 4px;
    background: var(--surface-3);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 3px;
    transition: width .25s var(--ease);
  }
  .bar .fill.done { background: linear-gradient(90deg, #17b877, #14a56a); }
  .bar .fill.paused { background: linear-gradient(90deg, #f5a623, #e09112); }

  .file-actions { display: flex; gap: 6px; }
  .btn-action {
    flex: 1;
    padding: 9px 12px;
    border-radius: var(--r-sm);
    border: none;
    font-size: 12.5px;
    font-weight: 600;

/* ============ 内嵌二维码生成器 ============ */
(function(){
  const QRMath = (function(){
    const EXP = new Array(256), LOG = new Array(256);
    for (let i = 0; i < 8; i++) EXP[i] = 1 << i;
    for (let i = 8; i < 256; i++) EXP[i] = EXP[i-4] ^ EXP[i-5] ^ EXP[i-6] ^ EXP[i-8];
    for (let i = 0; i < 255; i++) LOG[EXP[i]] = i;
    return {
      glog: n => { if (n < 1) throw new Error('glog'); return LOG[n]; },
      gexp: n => { while (n < 0) n += 255; while (n >= 256) n -= 255; return EXP[n]; }
    };
  })();

  const QRPolynomial = function(num, shift) {
    let offset = 0;
    while (offset < num.length && num[offset] === 0) offset++;
    this.num = new Array(num.length - offset + shift);
    for (let i = 0; i < num.length - offset; i++) this.num[i] = num[i + offset];
  };
  QRPolynomial.prototype = {
    get: function(i) { return this.num[i]; },
    getLength: function() { return this.num.length; },
    multiply: function(e) {
      const num = new Array(this.getLength() + e.getLength() - 1).fill(0);
      for (let i = 0; i < this.getLength(); i++) {
        for (let j = 0; j < e.getLength(); j++) {
          num[i+j] ^= QRMath.gexp(QRMath.glog(this.get(i)) + QRMath.glog(e.get(j)));
        }
      }
      return new QRPolynomial(num, 0);
    },
    mod: function(e) {
      if (this.getLength() - e.getLength() < 0) return this;
      const ratio = QRMath.glog(this.get(0)) - QRMath.glog(e.get(0));
      const num = this.num.slice();
      for (let i = 0; i < e.getLength(); i++) {
        num[i] ^= QRMath.gexp(QRMath.glog(e.get(i)) + ratio);
      }
      return new QRPolynomial(num, 0).mod(e);
    }
  };

  const RS_BLOCK_TABLE = [
    [1,26,19],[1,26,16],[1,26,13],[1,26,9],
    [1,44,34],[1,44,28],[1,44,22],[1,44,16],
    [1,70,55],[1,70,44],[2,35,17],[2,35,13],
    [1,100,80],[2,50,32],[2,50,24],[4,25,9],
    [1,134,108],[2,67,43],[2,33,15,2,34,16],[2,33,11,2,34,12],

/* ============ 主题 ============ */
function initTheme() {
  const saved = localStorage.getItem(LS_THEME);
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
    document.documentElement.setAttribute('data-theme', 'dark');
  updateThemeBtn();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(LS_THEME, next);
  updateThemeBtn();
}
function updateThemeBtn() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  $('btnTheme').textContent = isDark ? '☀️' : '🌙';
}

/* ============ 状态 ============ */
function setStatus(text, state) {
  els.statusText.textContent = text;
  els.dot.className = 'dot' + (state ? ' ' + state : '');
}
function genCode() {
  return String(Math.floor(100000 + Math.random() * 900000));
}
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  els.toastWrap.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 300);
  }, 2200);
}

}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch(e) { return []; }
}
function saveHistory(list) {
  localStorage.setItem(LS_KEY, JSON.stringify(list.slice(0, 5)));
}
function addHistory(code) {
  let list = loadHistory().filter(x => x.code !== code);
  list.unshift({ code, time: Date.now() });
  saveHistory(list);
  renderHistory();
}
function removeHistory(code) {
  saveHistory(loadHistory().filter(x => x.code !== code));
  renderHistory();
}
function renderHistory() {
  const list = loadHistory();
  if (!list.length) { els.historySection.classList.add('hide'); return; }
  els.historySection.classList.remove('hide');

  list.forEach(item => {

    div.innerHTML = `<span class="code">${item.code}</span><span class="meta">${timeAgo(item.time)}</span><span class="del" title="删除">✕</span>`;
    div.onclick = e => {

      els.peerInput.value = item.code;
    };
    els.historyList.appendChild(div);
  });
}
function timeAgo(t) {
  const d = Date.now() - t;
  if (d < 60000) return '刚刚';
  if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
  if (d < 86400000) return Math.floor(d / 3600000) + ' 小时前';
  return Math.floor(d / 86400000) + ' 天前';
}

/* ============ PeerJS ============ */
function initPeer() {
  myCode = genCode();
  peer = new Peer(myCode, {
    debug: 1,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' },
      ],
    },
  });

  peer.on('open', id => {
    myCode = id;
    els.myCode.textContent = id;
    els.qrCodeText.textContent = id;
    setStatus('已就绪，等待连接', 'on');
  });

  peer.on('connection', c => {
    if (conn && conn.open) { c.close(); return; }
    bindConn(c);
  });

  peer.on('error', err => {
    console.error(err);
    if (err.type === 'unavailable-id') { peer.destroy(); initPeer(); }
    else if (err.type === 'peer-unavailable') {
      setStatus('连接码不存在或对方不在线', 'err');
      els.btnConnect.disabled = false;
      els.btnConnect.textContent = '连接';
      toast('连接失败：对方不在线', 'err');
    } else {
      setStatus('连接异常：' + err.type, 'err');
    }
  });

  peer.on('disconnected', () => {
    setStatus('信令断开，重连中…', '');
    peer.reconnect();
  });
}

function connectPeer() {
  const target = els.peerInput.value.trim();
  if (!/^\d{6}$/.test(target)) { toast('请输入 6 位数字连接码', 'err'); return; }
  if (target === myCode) { toast('不能连接自己', 'err'); return; }
  els.btnConnect.disabled = true;
  els.btnConnect.textContent = '连接中';
  setStatus('正在连接 ' + target + ' …', '');
  const c = peer.connect(target, { reliable: true });
  bindConn(c);
}

function bindConn(c) {
  conn = c;
  c.on('open', () => {
    isConnected = true;
    els.btnConnect.disabled = false;
    els.btnConnect.textContent = '连接';
    setStatus('已连接 · 可传文件 / 发消息', 'on');
    switchToChat();
    addSys('已建立点对点连接 🔒');

  c.on('close', () => {
    isConnected = false;
    conn = null;
    setStatus('连接已断开', 'err');
    addSys('连接已断开');
    setTimeout(() => { els.btnConnect.disabled = false; els.btnConnect.textContent = '连接'; }, 100);
  });
  c.on('error', err => {

    setStatus('连接错误', 'err');

/* ============ 数据处理 ============ */
function handleData(data) {
  if (typeof data === 'string') {
    let msg;
    try { msg = JSON.parse(data); } catch(e) { return; }
    if (msg.t === 'text') {
      addText(msg.v, false, msg.id);
    } else if (msg.t === 'fstart') {
      recvFile = {
        id: msg.id, name: msg.name, size: msg.size,
        mime: msg.mime || 'application/octet-stream',
        total: msg.total, chunks: new Array(msg.total),
        received: 0, gotChunks: 0,
        el: null, barEl: null, sizeEl: null,
        startTime: Date.now(),
      };
      renderRecvFile(recvFile);
    } else if (msg.t === 'fend') {
      if (recvFile && recvFile.id === msg.id) {
        finishRecv(recvFile);
        recvFile = null;
      }
    }
    return;
  }

  let buf = null;
  if (data instanceof ArrayBuffer) buf = data;
  else if (data instanceof Uint8Array) buf = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
  else if (data && data.buffer instanceof ArrayBuffer) buf = data.buffer;
  if (!buf || !recvFile) return;

  try {
    const dv = new DataView(buf);
    const idLen = dv.getUint32(0);
    const idBytes = new Uint8Array(buf, 4, idLen);
    const id = new TextDecoder().decode(idBytes);
    if (id !== recvFile.id) return;
    const seq = dv.getUint32(4 + idLen);
    const chunk = buf.slice(8 + idLen);
    if (recvFile.chunks[seq]) return;
    recvFile.chunks[seq] = chunk;
    recvFile.received += chunk.byteLength;
    recvFile.gotChunks++;
    updateRecvFile(recvFile);
  } catch(e) { console.warn('块解析失败', e); }
}

/* ============ 接收 UI ============ */
function renderRecvFile(info) {
  const row = document.createElement('div');
  row.className = 'row them';
  row.innerHTML = `
    <div class="file-card">
      <div class="file-head">
        <div class="file-icon ${iconClass(info.name, info.mime)}">${getFileIcon(info.name, info.mime)}</div>
        <div class="file-meta">
          <div class="name">${escapeHtml(info.name)}</div>
          <div class="size">接收中 0%</div>
        </div>
      </div>
      <div class="bar"><div class="fill"></div></div>
    </div>`;
  els.chatView.appendChild(row);
  info.el = row;
  info.barEl = row.querySelector('.fill');
  info.sizeEl = row.querySelector('.size');
  scrollBottom();
}

function updateRecvFile(info) {
  const p = info.size ? info.received / info.size : 0;
  info.barEl.style.width = Math.min(100, p * 100).toFixed(1) + '%';
  const elapsed = (Date.now() - info.startTime) / 1000;
  const speed = elapsed > 0 ? info.received / elapsed : 0;
  const remain = speed > 0 ? (info.size - info.received) / speed : 0;
  let extra = '';
  if (speed > 0) {
    extra = ` · ${formatSpeed(speed)}`;
    if (remain > 0 && remain < 3600) extra += ` · 剩余 ${formatTime(remain)}`;
  }
  info.sizeEl.textContent = `接收中 ${(p*100).toFixed(0)}% · ${formatSize(info.received)} / ${formatSize(info.size)}${extra}`;
}

function finishRecv(info) {
  if (info.gotChunks !== info.total) {
    info.sizeEl.textContent = `接收不完整 (${info.gotChunks}/${info.total})`;
    info.barEl.classList.add('done');
    return;
  }
  const blob = new Blob(info.chunks, { type: info.mime });
  const url = URL.createObjectURL(blob);
  previewCache.set(info.id, { url, blob, name: info.name, type: info.mime, size: info.size });
  receivedFiles.push({ id: info.id, name: info.name, url, size: info.size });

  info.barEl.style.width = '100%';
  info.barEl.classList.add('done');
  info.sizeEl.textContent = `已完成 · ${formatSize(info.size)}`;

  const actions = document.createElement('div');
  actions.className = 'file-actions';
  if (canPreview(info.mime, info.name)) {
    const pv = document.createElement('button');
    pv.className = 'btn-action ghost';
    pv.textContent = '👁 预览';
    pv.onclick = () => openPreview(info.id);
    actions.appendChild(pv);
  }
  const dl = document.createElement('a');
  dl.className = 'btn-action primary';
  dl.href = url;
  dl.download = info.name;
  dl.textContent = '⬇ 下载';
  actions.appendChild(dl);
  info.el.querySelector('.file-card').appendChild(actions);
  scrollBottom();
  toast('收到文件：' + info.name, 'ok');
  updateMenu();
}

/* ============ 预览判断 ============ */
function canPreview(mime, name) {
  const m = (mime || '').toLowerCase();
  const n = (name || '').toLowerCase();
  if (m.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|bmp|svg|avif|ico)$/.test(n)) return true;
  if (m.startsWith('video/') || /\.(mp4|webm|mov|m4v|ogv|mkv)$/.test(n)) return true;
  if (m.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|opus)$/.test(n)) return true;
  if (m.startsWith('text/') || m === 'application/json' || m === 'application/xml') return true;
  if (/\.(txt|md|json|xml|html|css|js|ts|jsx|tsx|py|java|c|cpp|h|go|rs|sh|yaml|yml|log|csv|ini|toml|conf|gitignore)$/.test(n)) return true;
  if (m === 'application/pdf' || /\.pdf$/.test(n)) return true;
  return false;
}
function getFileIcon(name, mime) {
  const m = (mime || '').toLowerCase();
  const n = (name || '').toLowerCase();
  if (m.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|bmp|svg|avif)$/.test(n)) return '🖼';
  if (m.startsWith('video/') || /\.(mp4|webm|mov|m4v|ogv|mkv)$/.test(n)) return '🎬';
  if (m.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|opus)$/.test(n)) return '🎵';
  if (m === 'application/pdf' || /\.pdf$/.test(n)) return '📕';
  if (/\.(zip|rar|7z|tar|gz|bz2|xz)$/.test(n)) return '🗜';
  if (m.startsWith('text/') || /\.(txt|md|json|xml|html|css|js|ts|py|java|c|cpp|go|rs|sh|yaml|yml|log|csv|ini|toml)$/.test(n)) return '📝';
  return '📄';
}
function iconClass(name, mime) {
  const m = (mime || '').toLowerCase();
  const n = (name || '').toLowerCase();
  if (m.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|bmp|svg|avif)$/.test(n)) return 'img';
  if (m.startsWith('video/') || /\.(mp4|webm|mov|m4v|ogv|mkv)$/.test(n)) return 'vid';
  if (m.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|opus)$/.test(n)) return 'aud';
  if (m === 'application/pdf' || /\.pdf$/.test(n)) return 'doc';
  if (/\.(zip|rar|7z|tar|gz|bz2|xz)$/.test(n)) return 'zip';
  if (m.startsWith('text/') || /\.(txt|md|json|xml|html|css|js|ts|py|java|c|cpp|go|rs|sh|yaml|yml|log|csv|ini|toml)$/.test(n)) return 'doc';
  return '';
}

    code = url.searchParams.get('peer') || '';
  } catch (e) {

  if (!/^\d{6}$/.test(code)) {

    await html5QrCode.start(currentCamId, { fps: 10, qrbox: { width: 240, height: 240 } }, onScanSuccess, () => {});

/* ============ 发送 ============ */
async function sendFiles(fileList) {
  if (!isConnected || !conn) { toast('尚未连接', 'err'); return; }
  for (const file of fileList) sendQueue.push(file);
  processQueue();
}

async function processQueue() {
  if (isSending) return;
  if (!sendQueue.length) return;
  isSending = true;
  while (sendQueue.length) {
    const file = sendQueue.shift();
    await sendOneFile(file);
  }
  isSending = false;
  currentSendTask = null;
}

function sendOneFile(file) {
  return new Promise(resolve => {
    const id = Math.random().toString(36).slice(2, 10);
    const total = Math.ceil(file.size / CHUNK_SIZE) || 1;
    const task = { paused: false, cancelled: false, resolve };
    currentSendTask = task;

    conn.send(JSON.stringify({
      t: 'fstart', id, name: file.name, size: file.size,
      mime: file.type || 'application/octet-stream', total,
    }));

    previewCache.set(id, {
      url: URL.createObjectURL(file), blob: file,
      name: file.name, type: file.type || 'application/octet-stream', size: file.size,
    });

    const card = renderSendFile(file, id);
    card.setStatus('准备中…');

    let seq = 0, offset = 0;
    const startTime = Date.now();

    const sendNext = () => {
      if (task.cancelled) {
        conn.send(JSON.stringify({ t: 'fend', id }));
        card.setCancelled();
        resolve();
        return;
      }
      if (task.paused) {
        card.setPaused();
        setTimeout(sendNext, 200);
        return;
      }
      if (offset >= file.size) {
        conn.send(JSON.stringify({ t: 'fend', id }));
        card.setDone();
        resolve();
        return;
      }
      const slice = file.slice(offset, offset + CHUNK_SIZE);
      const reader = new FileReader();
      reader.onload = e => {
        const buf = e.target.result;
        const packet = packChunk(id, seq, buf);
        waitBuffer(() => {
          if (!conn || !conn.open) { card.setError(); resolve(); return; }
          conn.send(packet);
          offset += buf.byteLength;
          seq++;
          const p = offset / file.size;
          const elapsed = (Date.now() - startTime) / 1000;
          const speed = elapsed > 0 ? offset / elapsed : 0;
          const remain = speed > 0 ? (file.size - offset) / speed : 0;
          card.setProgress(p, speed, remain);
          sendNext();
        });
      };
      reader.onerror = () => { card.setError(); resolve(); };
      reader.readAsArrayBuffer(slice);
    };
    sendNext();
  });
}

function packChunk(id, seq, buf) {
  const idBytes = new TextEncoder().encode(id);
  const out = new ArrayBuffer(4 + idBytes.length + 4 + buf.byteLength);
  const dv = new DataView(out);
  dv.setUint32(0, idBytes.length);
  new Uint8Array(out, 4, idBytes.length).set(idBytes);
  dv.setUint32(4 + idBytes.length, seq);
  new Uint8Array(out, 8 + idBytes.length).set(new Uint8Array(buf));
  return out;
}

function waitBuffer(cb) {
  const dc = conn && conn.dataChannel;
  if (!dc || dc.bufferedAmount < MAX_BUFFER) { cb(); return; }
  setTimeout(() => waitBuffer(cb), 25);
}

function renderSendFile(file, id) {
  const row = document.createElement('div');
  row.className = 'row me';
  row.innerHTML = `
    <div class="file-card">
      <div class="file-head">
        <div class="file-icon ${iconClass(file.name, file.type)}">${getFileIcon(file.name, file.type)}</div>
        <div class="file-meta">
          <div class="name">${escapeHtml(file.name)}</div>
          <div class="size">准备中…</div>
        </div>
      </div>
      <div class="bar"><div class="fill"></div></div>
      <div class="file-actions">
        <button class="btn-action warn" data-act="pause">⏸ 暂停</button>
        <button class="btn-action danger" data-act="cancel">✕ 取消</button>
      </div>
    </div>`;
  els.chatView.appendChild(row);
  const bar = row.querySelector('.fill');
  const sizeEl = row.querySelector('.size');
  const actionsRow = row.querySelector('.file-actions');
  const btnPause = row.querySelector('[data-act="pause"]');
  const btnCancel = row.querySelector('[data-act="cancel"]');
  scrollBottom();

  btnPause.onclick = () => {
    if (!currentSendTask) return;
    currentSendTask.paused = !currentSendTask.paused;
    btnPause.textContent = currentSendTask.paused ? '▶ 继续' : '⏸ 暂停';
  };
  btnCancel.onclick = () => {
    if (currentSendTask) currentSendTask.cancelled = true;
  };

  return {
    setStatus(t) { sizeEl.textContent = t; },
    setProgress(p, speed, remain) {
      bar.style.width = (p * 100).toFixed(1) + '%';
      let extra = '';
      if (speed > 0) {
        extra = ` · ${formatSpeed(speed)}`;
        if (remain > 0 && remain < 3600) extra += ` · 剩余 ${formatTime(remain)}`;
      }
      sizeEl.textContent = `发送中 ${(p*100).toFixed(0)}% · ${formatSize(p*file.size)} / ${formatSize(file.size)}${extra}`;
    },
    setPaused() { bar.classList.add('paused'); sizeEl.textContent = '已暂停'; },
    setDone() {
      bar.classList.remove('paused');
      bar.style.width = '100%';
      bar.classList.add('done');
      sizeEl.textContent = `已发送 · ${formatSize(file.size)}`;
      actionsRow.remove();
      const actions = document.createElement('div');
      actions.className = 'file-actions';
      if (canPreview(file.type, file.name)) {
        const pv = document.createElement('button');
        pv.className = 'btn-action ghost';
        pv.textContent = '👁 预览';
        pv.onclick = () => openPreview(id);
        actions.appendChild(pv);
      }
      const dl = document.createElement('a');
      dl.className = 'btn-action primary';
      dl.href = previewCache.get(id).url;
      dl.download = file.name;
      dl.textContent = '⬇ 下载';
      actions.appendChild(dl);
      row.querySelector('.file-card').appendChild(actions);
      scrollBottom();
    },
    setCancelled() {
      bar.classList.remove('paused');
      bar.style.background = 'var(--err)';
      sizeEl.textContent = '已取消';
      actionsRow.remove();
    },
    setError() {
      bar.classList.remove('paused');
      bar.style.background = 'var(--err)';
      sizeEl.textContent = '发送失败';
      actionsRow.remove();
    },
  };
}

async function recordVoice() {
  const btn = $('btnRecord');
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    btn.classList.remove('recording');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const file = new File([blob], `录音_${Date.now()}.webm`, { type: 'audio/webm' });
      sendFiles([file]);
      mediaRecorder = null;
      btn.classList.remove('recording');
    };
    mediaRecorder.start();
    btn.classList.add('recording');
    toast('🎙 录音中… 再次点击结束', 'ok');
  } catch (e) {
    toast('无法访问麦克风', 'err');
  }
}

async function pasteFromClipboard() {
  els.menu.classList.remove('show');
  try {
    const items = await navigator.clipboard.read();
    for (const item of items) {
      for (const type of item.types) {
        if (type.startsWith('image/')) {
          const blob = await item.getType(type);
          const ext = type.split('/')[1];
          const file = new File([blob], `粘贴图片_${Date.now()}.${ext}`, { type });
          await sendFiles([file]);
          return;
        }
      }
    }
    const text = await navigator.clipboard.readText();
    if (text) {
      els.msgInput.value = text;
      autoResize();
      els.msgInput.focus();
      toast('已粘贴到输入框');
    } else {
      toast('剪贴板为空', 'err');
    }
  } catch (e) {
    toast('无法读取剪贴板（需授权）', 'err');
  }
}

/* ============ 工具 ============ */
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  if (bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1) + ' MB';
  return (bytes/1024/1024/1024).toFixed(2) + ' GB';
}
function formatSpeed(bps) { return formatSize(bps) + '/s'; }
function formatTime(sec) {
  sec = Math.ceil(sec);
  if (sec < 60) return sec + ' 秒';
  if (sec < 3600) return Math.floor(sec/60) + ' 分 ' + (sec%60) + ' 秒';
  return Math.floor(sec/3600) + ' 小时';
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ 事件 ============ */
els.fileInput.addEventListener('change', e => {
  if (e.target.files.length) sendFiles(e.target.files);
  e.target.value = '';
});

els.peerInput.addEventListener('keydown', e => { if (e.key === 'Enter') connectPeer(); });
els.peerInput.addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
});

let dragCounter = 0;
document.addEventListener('dragenter', e => {
  if (!isConnected) return;
  e.preventDefault();
  dragCounter++;
});
document.addEventListener('dragover', e => { e.preventDefault(); });
document.addEventListener('dragleave', e => {
  dragCounter--;
  if (dragCounter <= 0) dragCounter = 0;
});
document.addEventListener('drop', e => {
  e.preventDefault();
  dragCounter = 0;
  if (!isConnected) return;
  if (e.dataTransfer.files.length) sendFiles(e.dataTransfer.files);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (els.modal.classList.contains('show')) closeModal();
    if (els.qrModal.classList.contains('show')) closeQR();
    if (els.scanModal.classList.contains('show')) closeScanner();
    els.menu.classList.remove('show');
  }
});

[els.modal, els.qrModal, els.scanModal].forEach(m => {
  m.addEventListener('click', e => {
    if (e.target === m) {
      if (m === els.modal) closeModal();
      else if (m === els.qrModal) closeQR();
      else closeScanner();
    }
  });
});

function readPeerFromUrl() {
  const p = new URLSearchParams(location.search).get('peer');
  if (p && /^\d{6}$/.test(p) && p !== myCode) {
    els.peerInput.value = p;
    toast('已填入连接码 ' + p + '，请点击连接', 'ok');
  }
}

  analyze(message) {
    const lowerMsg = message.toLowerCase();
    return {
      isCalculation: this.isMathCalculation(message),
      containsName: this.findNameInMessage(lowerMsg),
      isGreeting: this.isGreeting(lowerMsg),
      isWho: this.isWhoQuestion(lowerMsg),
      isImageGeneration: this.isImageGenerationRequest(message),
      originalMessage: message
    };
  }

  isImageGenerationRequest(message) {
    const patterns = [/^生成图片[:：]\s*(.+)/i, /^\/image\s+(.+)/i, /^画一张[:：]\s*(.+)/i];
    for (const p of patterns) {
      const match = message.match(p);
      if (match && match[1]?.trim()) {
        return { isImage: true, prompt: match[1].trim() };
      }
    }
    return { isImage: false };
  }

  findNameInMessage(message) {
    const sortedKeys = Object.keys(this.nicknameMap).sort((a, b) => b.length - a.length);
    for (const nickname of sortedKeys) {
      if (nickname.length <= 1) continue;
      const lowerNickname = nickname.toLowerCase();
      if (lowerNickname.length === 1) continue;
      const exactMatch = new RegExp(`(^|[^\\u4e00-\\u9fa5])${lowerNickname}([^\\u4e00-\\u9fa5]|$)`, 'i');
      if (exactMatch.test(message)) {
        const info = this.nicknameMap[nickname];
        return { found: true, nickname: nickname, fullName: info.fullName, type: info.type };
      }
    }
    return { found: false };
  }

  isMathCalculation(message) {
    const hasNumbers = /\d/.test(message);
    const hasOperators = /[+\-*/%^=]/.test(message);
    if (hasNumbers && (hasOperators || message.includes('等于') || message.includes('='))) {
      try {
        let expr = message.replace(/[^0-9+\-*/%^.()\s]/g, '');
        expr = expr.replace(/×/g, '*').replace(/÷/g, '/');
        if (expr.length > 0 && expr.length < 50) {
          const result = Function(`"use strict"; return (${expr})`)();
          if (!isNaN(result) && isFinite(result)) {
            return { isMath: true, expression: expr, result: result };
          }
        }
      } catch (e) {}
    }
    return { isMath: false };
  }

  isGreeting(message) {
    const greetings = ['你好', 'hi', 'hello', '嗨', '在吗', '您好', '哈喽', '嘿'];
    return greetings.some(greet => message.includes(greet));
  }

  isWhoQuestion(message) {
    const whoPatterns = ['你谁', '你是谁', 'who are you', '你是哪个', '你是什么'];
    return whoPatterns.some(pattern => message.includes(pattern));

  async getSearchAnswer(question) {
    try {
      const cacheKey = question.toLowerCase();
      if (this.searchCache[cacheKey]) return this.searchCache[cacheKey];
      let searchResult = '';
      const searchEngines = [this.searchGoogle, this.searchBaidu, this.searchBing, this.searchDuckDuckGo, this.searchSogou];
      const searchPromises = [];
      for (let i = 0; i < Math.min(3, searchEngines.length); i++) {
        searchPromises.push(searchEngines[i].call(this, question).catch(e => ''));
      }
      const results = await Promise.all(searchPromises);
      for (const result of results) {
        if (result && result.length > searchResult.length) searchResult = result;
      }
      if (!searchResult || searchResult.length < 30) searchResult = await this.searchBackupAPI(question);
      if (!searchResult || searchResult.length < 30) return this.getSmartAnswer(question);
      const organizedAnswer = this.formatAsPoints(searchResult, question);
      this.searchCache[cacheKey] = organizedAnswer;
      if (Object.keys(this.searchCache).length > 50) delete this.searchCache[Object.keys(this.searchCache)[0]];
      return organizedAnswer;
    } catch (error) {
      return this.getSmartAnswer(question);
    }
  }

  async searchGoogle(question) {
    try {
      const proxyUrl = 'https://api.allorigins.win/get?url=';
      const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(question)}&hl=zh-CN`;
      const response = await fetch(proxyUrl + encodeURIComponent(searchUrl), { method: 'GET', headers: { 'User-Agent': 'Mozilla/5.0' } });
      if (response.ok) {
        const data = await response.json();
        const html = data.contents;
        const resultRegex = /<div class="[^"]*?VwiC3b[^"]*"[^>]*>([^<]+)<\/div>/g;
        const results = [];
        let match;
        while ((match = resultRegex.exec(html)) !== null && results.length < 3) {
          const content = match[1].replace(/<[^>]+>/g, ' ').trim();
          if (content.length > 30) results.push(content);
        }
        if (results.length > 0) return results.join(' ');
      }
      return '';
    } catch (error) { return ''; }
  }

  async searchBaidu(question) {
    try {
      const proxyUrl = 'https://api.allorigins.win/get?url=';
      const searchUrl = `https://www.baidu.com/s?wd=${encodeURIComponent(question)}&ie=utf-8`;
      const response = await fetch(proxyUrl + encodeURIComponent(searchUrl), { method: 'GET', headers: { 'User-Agent': 'Mozilla/5.0' } });
      if (response.ok) {
        const data = await response.json();
        const html = data.contents;
        const resultRegex = /<div class="result[^"]*"[^>]*>([\s\S]*?)<\/div>/gi;
        const results = [];
        let match;
        while ((match = resultRegex.exec(html)) !== null && results.length < 3) {
          const content = match[1].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
          if (content.length > 50 && !content.includes('广告')) results.push(content);
        }
        if (results.length > 0) return results.join(' ');
      }
      return '';
    } catch (error) { return ''; }
  }

  async searchBing(question) {
    try {
      const response = await fetch(`https://www.bing.com/search?q=${encodeURIComponent(question)}&cc=CN`, { method: 'GET', headers: { 'User-Agent': 'Mozilla/5.0' }, mode: 'no-cors' });
      if (response.ok) {
        const text = await response.text();
        const bodyText = text.replace(/<script[^>]*>[\s\S]*?<\/script>/gi, ' ').replace(/<style[^>]*>[\s\S]*?<\/style>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
        const keywords = question.split(' ');
        let relevantText = '';
        for (const keyword of keywords) {
          if (keyword.length > 2) {
            const regex = new RegExp(`.{0,100}${keyword}.{0,100}`, 'gi');
            const matches = bodyText.match(regex);
            if (matches) relevantText += matches.slice(0, 2).join(' ') + ' ';
          }
        }
        if (relevantText.length > 50) return relevantText.substring(0, 300);
      }
      return '';
    } catch (error) { return ''; }
  }

  async searchDuckDuckGo(question) {
    try {
      const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(question)}&format=json&no_html=1&skip_disambig=1`, { method: 'GET', headers: { 'Accept': 'application/json', 'User-Agent': 'Mozilla/5.0' } });
      if (response.ok) {
        const data = await response.json();
        if (data.AbstractText) return data.AbstractText;
        if (data.RelatedTopics && data.RelatedTopics.length > 0) return data.RelatedTopics.slice(0, 2).map(topic => topic.Text || '').filter(text => text).join('。');
      }
      return '';
    } catch (error) { return ''; }
  }

  async searchSogou(question) {
    try {
      const response = await fetch(`https://www.sogou.com/web?query=${encodeURIComponent(question)}`, { method: 'GET', headers: { 'User-Agent': 'Mozilla/5.0' }, mode: 'no-cors' });
      if (response.ok) {
        const text = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, 'text/html');
        const results = doc.querySelectorAll('.vr-title, .str_info');
        if (results.length > 0) return Array.from(results).slice(0, 2).map(el => el.textContent).join(' ');
      }
      return '';
    } catch (error) { return ''; }
  }

      if (response.ok) {
        const data = await response.json();
        if (data.result && data.result.list && data.result.list.length > 0) {
          const firstResult = data.result.list[0];
          return firstResult.title + '。' + (firstResult.content || '');
        }
      }
      return '';
    } catch (error) { return ''; }
  }

  formatAsPoints(content, question) {
    if (!content || content.length < 20) return `关于"${question}"：\n\n根据搜索到的信息：\n${content.substring(0, 200)}...`;
    content = content.replace(/[\r\n\t]/g, ' ').replace(/\s+/g, ' ').trim();
    const sentences = content.split(/[。！？；\.!\?;]/).filter(s => s.trim().length > 10 && s.trim().length < 150).map(s => s.trim());
    if (sentences.length === 0) return `关于"${question}"：\n\n搜索到的信息：\n${content.substring(0, 250)}...`;
    const questionWords = question.toLowerCase().split(' ');
    const scoredSentences = sentences.map(sentence => {
      let score = 0;
      const lowerSentence = sentence.toLowerCase();
      for (const word of questionWords) {
        if (word.length > 2 && lowerSentence.includes(word)) score += 5;
      }
      score += Math.min(sentence.length / 50, 2);
      return { sentence, score };
    });
    const topSentences = scoredSentences.sort((a, b) => b.score - a.score).slice(0, 3).filter(item => item.score > 0 || item.sentence.length > 20).map(item => item.sentence);
    if (topSentences.length === 0) {
      const relevantSentences = sentences.slice(0, Math.min(3, sentences.length));
      return `关于"${question}"：\n\n1. ${relevantSentences[0]}\n2. ${relevantSentences[1] || relevantSentences[0]}\n3. ${relevantSentences[2] || '更多信息建议查阅相关资料'}`;
    }
    let points = '';
    topSentences.forEach((sentence, index) => { points += `${index + 1}. ${sentence}\n`; });
    return `关于"${question}"，搜索整理如下：\n\n${points}\n\n（信息来源于网络搜索）`;
  }

  getSmartAnswer(question) {
    const lowerQuestion = question.toLowerCase();
    const now = new Date();
    if (lowerQuestion.includes('时间') || lowerQuestion.includes('现在几点')) return `现在时间：${now.toLocaleString('zh-CN')}`;
    else if (lowerQuestion.includes('日期') || lowerQuestion.includes('今天几号')) return `今天是：${now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' })}`;
    else if (lowerQuestion.includes('天气')) return `关于天气信息，建议您查看手机天气应用或访问中国天气网获取实时天气预报。`;
    else if (lowerQuestion.includes('新闻') || lowerQuestion.includes('热点')) return `获取最新新闻，建议访问人民日报官网、央视新闻客户端或新华社官方网站等权威媒体。`;
    else if (lowerQuestion.includes('学习') || lowerQuestion.includes('作业')) return `学习建议：认真听讲、及时复习、多问多练。如果有具体的学习问题，可以咨询相关科目的老师。`;
    else {
      const answers = [
        `关于"${question}"，我目前没有搜索到相关信息。作为牦牛AI，我主要擅长回答与九班同学、老师相关的问题，或者简单的计算问题。`,
        `这个问题我暂时没有找到相关资料。如果您想了解我们九班的同学或老师，或者有数学计算问题，我一定能帮到您！`,
        `对于这个问题，我还没有学习到相关知识。不过关于我们九班的事情，我可是了如指掌哦！`
      ];
      return answers[Math.floor(Math.random() * answers.length)];
    }
  }
}

const aiSmart = new AISmartResponseSystem();

// ---------- 牦牛AI 界面辅助函数 ----------
function aiShowStatus(type, text) {
  const messageContainer = document.getElementById('aiMessageContainer');
  const statusDiv = document.createElement('div');
  statusDiv.className = 'message ai';
  statusDiv.id = 'aiStatusMessage';
  if (type === 'searching') {
    statusDiv.innerHTML = `<div class="message-content"><div class="searching-status" id="aiStatusContent"><div class="searching-dot"></div><div class="searching-dot"></div><div class="searching-dot"></div> ${text}</div></div>`;
  } else if (type === 'organizing') {
    statusDiv.innerHTML = `<div class="message-content"><div class="organizing-status" id="aiStatusContent"><div class="organizing-dot"></div><div class="organizing-dot"></div><div class="organizing-dot"></div> ${text}</div></div>`;
  }
  messageContainer.appendChild(statusDiv);
  messageContainer.scrollTop = messageContainer.scrollHeight;
}

function aiUpdateStatus(type, text) {
  const statusContent = document.getElementById('aiStatusContent');
  if (!statusContent) return;
  if (type === 'organizing') {
    statusContent.className = 'organizing-status';
    statusContent.innerHTML = `<div class="organizing-dot"></div><div class="organizing-dot"></div><div class="organizing-dot"></div> ${text}`;
  }
}

function aiHideStatus() {
  const statusDiv = document.getElementById('aiStatusMessage');
  if (statusDiv) {
    statusDiv.style.opacity = '0';
    statusDiv.style.transition = 'opacity 0.3s ease';
    setTimeout(() => { if (statusDiv.parentNode) statusDiv.parentNode.removeChild(statusDiv); }, 300);
  }
}

function aiAddMessage(sender, content, isHtml = false) {
  const messageContainer = document.getElementById('aiMessageContainer');
  const messageDiv = document.createElement('div');
  messageDiv.className = `message ${sender}`;
  if (isHtml) {
    messageDiv.innerHTML = content;
  } else {
    if (sender === 'ai') {
      messageDiv.innerHTML = `<div class="message-content">${content}</div>`;
      setTimeout(() => {
        const text = messageDiv.querySelector('.message-content');
        if (text) {
          const originalText = text.textContent;
          text.innerHTML = '';
          const typingContainer = document.createElement('span');
          typingContainer.className = 'typing-container';
          text.appendChild(typingContainer);
          let i = 0;
          const typeChar = () => {
            if (i < originalText.length) {
              typingContainer.innerHTML = originalText.substring(0, i + 1) + '<span class="typing-cursor"></span>';
              i++;
              setTimeout(typeChar, 20 + Math.random() * 10);
            }
          };
          typeChar();
        }
      }, 100);
    } else {
      messageDiv.innerHTML = `<div class="message-content">${content}</div>`;
    }
  }
  messageContainer.appendChild(messageDiv);
  messageContainer.scrollTop = messageContainer.scrollHeight;
  return messageDiv;
}

function aiShowThinking() {
  const messageContainer = document.getElementById('aiMessageContainer');
  const thinkingDiv = document.createElement('div');
  thinkingDiv.className = 'message ai';
  thinkingDiv.id = 'aiThinkingMessage';
  thinkingDiv.innerHTML = `<div class="message-content"><div class="thinking-animation"><div class="thinking-dot"></div><div class="thinking-dot"></div><div class="thinking-dot"></div></div></div>`;
  messageContainer.appendChild(thinkingDiv);
  messageContainer.scrollTop = messageContainer.scrollHeight;
}

function aiHideThinking() {
  const thinkingDiv = document.getElementById('aiThinkingMessage');
  if (thinkingDiv) thinkingDiv.remove();
}

function aiGenerateImageUrl(prompt) {
  return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&nologo=true`;
}

function aiOpenImagePreview(imgSrc) {
  const overlay = document.createElement('div');
  overlay.className = 'image-preview-overlay';
  overlay.innerHTML = `<img src="${imgSrc}" alt="预览图片" />`;
  overlay.addEventListener('click', () => overlay.remove());
  document.body.appendChild(overlay);
}

async function aiSaveImage(imgSrc, prompt) {
  try {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = imgSrc;
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
    });
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `牦牛AI_${prompt.substring(0, 20)}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 'image/png');
  } catch (e) {
    alert('保存失败，请右键图片另存为。');
  }
}

async function aiDisplayGeneratedImage(prompt) {
  const container = document.getElementById('aiMessageContainer');
  const imageDiv = document.createElement('div');
  imageDiv.className = 'message ai image-message';
  imageDiv.innerHTML = `
    <div><strong>🎨 正在生成图片…</strong></div>
    <div class="image-loading" style="display:flex; align-items:center; gap:10px; padding:10px 0;">
      <div class="thinking-dot"></div><div class="thinking-dot"></div><div class="thinking-dot"></div>
      <span>AI 正在创作"${prompt}"</span>
    </div>
  `;
  container.appendChild(imageDiv);
  container.scrollTop = container.scrollHeight;

  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = aiGenerateImageUrl(prompt);
  img.alt = prompt;

  img.onload = () => {
    imageDiv.innerHTML = `
      <div><strong>🖼️ 生成结果：</strong> ${prompt}</div>
      <img src="${img.src}" alt="${prompt}" class="generated-image" style="max-width:100%; border-radius:16px; margin-top:10px; cursor:pointer;" />
      <div class="image-actions">
        <button class="image-btn preview-btn">🔍 放大预览</button>
        <button class="image-btn save-btn">💾 保存到相册</button>
      </div>
      <div class="attribution">✨ 由牦牛AI生成</div>
    `;
    imageDiv.querySelector('.generated-image').addEventListener('click', () => aiOpenImagePreview(img.src));
    imageDiv.querySelector('.preview-btn').addEventListener('click', () => aiOpenImagePreview(img.src));
    imageDiv.querySelector('.save-btn').addEventListener('click', () => aiSaveImage(img.src, prompt));
    container.scrollTop = container.scrollHeight;
  };

  img.onerror = () => {
    imageDiv.innerHTML = `
      <div><strong>⚠️ 图片生成失败</strong></div>
      <div>描述：${prompt}</div>
      <div style="color:#ffb085;">请稍后重试，或尝试更简洁的描述词。</div>
    `;
    container.scrollTop = container.scrollHeight;
  };
}

async function aiSendMessage() {
  const input = document.getElementById('aiMessageInput');
  const message = input.value.trim();
  if (!message) return;

  aiAddMessage('user', message);
  input.value = '';

  const analysis = aiSmart.analyze(message);

  if (analysis.isImageGeneration.isImage) {
    aiShowThinking();
    await new Promise(resolve => setTimeout(resolve, 600));
    aiHideThinking();
    aiDisplayGeneratedImage(analysis.isImageGeneration.prompt);
    return;
  }

  aiShowThinking();
  const thinkTime = 800 + Math.random() * 1200;
  await new Promise(resolve => setTimeout(resolve, thinkTime));
  aiHideThinking();

  const response = await aiSmart.generateResponse(analysis);
  aiAddMessage('ai', response);
}

// ---------- 牦牛AI 特效函数 ----------
function aiCreate3DParticleField() {
  const field = document.getElementById('aiParticleField');
  if (!field || field.dataset.inited) return;
  field.dataset.inited = '1';
  for (let i = 0; i < 150; i++) {
    const particle = document.createElement('div');
    particle.classList.add('particle-3d');
    particle.style.left = `${Math.random() * 100}%`;
    particle.style.top = `${Math.random() * 100}%`;
    field.appendChild(particle);
  }
}
function aiCreateDataStream() {
  const stream = document.getElementById('aiDataStream');
  if (!stream || stream.dataset.inited) return;
  stream.dataset.inited = '1';
  for (let i = 0; i < 20; i++) {
    const line = document.createElement('div');
    line.classList.add('stream-line');
    line.style.top = `${Math.random() * 100}%`;
    stream.appendChild(line);
  }
}
function aiCreateCoreParticles() {
  const core = document.getElementById('aiCoreRotation');
  if (!core || core.dataset.inited) return;
  core.dataset.inited = '1';
  for (let i = 0; i < 12; i++) {
    const particle = document.createElement('div');
    particle.classList.add('core-particle');
    const angle = (i * 360 / 12) * (Math.PI / 180);
    const x = 120 * Math.cos(angle);
    const y = 120 * Math.sin(angle);
    particle.style.left = `calc(50% + ${x}px)`;
    particle.style.top = `calc(50% + ${y}px)`;
    core.appendChild(particle);
  }
}
function aiCreateClassMatrix() {
  const matrix = document.getElementById('aiMatrixContent');
  if (!matrix || matrix.dataset.inited) return;
  matrix.dataset.inited = '1';
  const teacherList = Object.entries(aiTeachers);
  for (let n = 0; n < 2; n++) {
    teacherList.forEach(([name, info]) => {
      const item = document.createElement('div');
      item.className = 'matrix-item';
      item.textContent = `${name}: ${info[0]}`;
      matrix.appendChild(item);
    });
  }
}
function aiCreateExplosionParticles() {
  const explosion = document.getElementById('aiParticleExplosion');
  if (!explosion) return;
  explosion.innerHTML = '';
  for (let i = 0; i < 50; i++) {
    const particle = document.createElement('div');
    particle.classList.add('explosion-particle');
    const angle = Math.random() * Math.PI * 2;
    const distance = 200 + Math.random() * 100;
    const tx = Math.cos(angle) * distance;
    const ty = Math.sin(angle) * distance;
    particle.style.setProperty('--tx', `${tx}px`);
    particle.style.setProperty('--ty', `${ty}px`);
    explosion.appendChild(particle);
  }
}

// ---------- 牦牛AI 启动动画 ----------
function initAILaunch() {
  if (!aiLaunchInited) {
    aiLaunchInited = true;
    aiCreate3DParticleField();
    aiCreateDataStream();
    aiCreateCoreParticles();
    aiCreateClassMatrix();
  }

  const startup = document.getElementById('aiStartup');
  const aiApp = document.getElementById('aiApp');
  const shutdown = document.getElementById('aiShutdown');
  const progressBar = startup.querySelector('.quantum-progress');

  startup.style.display = 'flex';
  startup.style.opacity = '1';
  startup.style.transition = '';
  shutdown.style.display = 'none';
  aiApp.style.display = 'none';
  progressBar.style.width = '0%';
  void progressBar.offsetWidth;

  setTimeout(() => {
    progressBar.style.width = '100%';
    setTimeout(() => {
      startup.style.opacity = '0';
      startup.style.transition = 'opacity 0.7s ease';
      setTimeout(() => {
        startup.style.display = 'none';
        aiApp.style.display = 'flex';
        setTimeout(() => {
          const msgs = document.getElementById('aiMessageContainer');
          if (msgs && msgs.children.length === 0) {
            const welcomeMsg = "你好！我是牦牛AI，专属于八年级九班同学的智能助手！我们班有62位同学，在王贵强老师带领下，学习氛围特别浓厚。有什么问题尽管问我！🐂";
            aiAddMessage('ai', welcomeMsg);
          }
          msgs.scrollTop = msgs.scrollHeight;
        }, 100);
      }, 700);
    }, 800);
  }, 1500);
}

// ---------- 牦牛AI 退出动画（返回传输助手）----------
function aiShowShutdown() {
  if (!confirm('确定要退出牦牛AI系统吗？')) return;
  const shutdown = document.getElementById('aiShutdown');
  const aiApp = document.getElementById('aiApp');
  const startup = document.getElementById('aiStartup');
  shutdown.style.display = 'flex';
  aiApp.style.display = 'none';
  startup.style.display = 'none';
  aiCreateExplosionParticles();
  setTimeout(() => {
    closeAI();
    shutdown.style.display = 'none';
  }, 2000);
}

// ---------- 牦牛AI 事件绑定 ----------
let aiEventsBound = false;
function bindAIEvents() {
  if (aiEventsBound) return;
  aiEventsBound = true;

  document.getElementById('aiSendButton').addEventListener('click', aiSendMessage);
  document.getElementById('aiExitButton').addEventListener('click', aiShowShutdown);
  document.getElementById('aiMessageInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') aiSendMessage();
  });
}
