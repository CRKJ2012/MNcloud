<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#eef1f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0e18" media="(prefers-color-scheme: dark)">
<title>牦牛文件传输助手</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

  :root {
    --bg-0: #e8ecf6;
    --bg-1: #f4f6fc;
    --bg-2: #eef1f8;
    --glass-1: rgba(255, 255, 255, 0.55);
    --glass-2: rgba(255, 255, 255, 0.72);
    --glass-3: rgba(255, 255, 255, 0.85);
    --glass-border: rgba(255, 255, 255, 0.75);
    --glass-border-strong: rgba(255, 255, 255, 0.9);
    --glass-blur: 24px;
    --text: #0d1220;
    --text-2: #4a5066;
    --text-3: #8990a8;
    --text-4: #b8bdcc;
    --accent: #5b6cff;
    --accent-2: #9b6bff;
    --accent-3: #22c1c3;
    --accent-soft: rgba(91, 108, 255, 0.12);
    --accent-glow: rgba(91, 108, 255, 0.35);
    --ok: #17b877;
    --ok-soft: rgba(23, 184, 119, 0.14);
    --warn: #f5a623;
    --warn-soft: rgba(245, 166, 35, 0.14);
    --err: #ff4d6d;
    --err-soft: rgba(255, 77, 109, 0.14);
    --r-sm: 12px;
    --r-md: 16px;
    --r-lg: 22px;
    --r-xl: 28px;
    --shadow-card:
      0 1px 3px rgba(20, 30, 60, 0.04),
      0 8px 24px -8px rgba(20, 30, 60, 0.08),
      0 24px 60px -30px rgba(20, 30, 60, 0.14);
    --shadow-card-hover:
      0 2px 6px rgba(20, 30, 60, 0.05),
      0 12px 32px -10px rgba(20, 30, 60, 0.12),
      0 32px 80px -40px rgba(20, 30, 60, 0.18);
    --shadow-pop:
      0 12px 32px -12px rgba(20, 30, 60, 0.22),
      0 32px 80px -40px rgba(20, 30, 60, 0.3);
    --shadow-accent: 0 8px 24px -8px var(--accent-glow);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  [data-theme="dark"] {
    --bg-0: #06080f;
    --bg-1: #0b0e18;
    --bg-2: #0e1120;
    --glass-1: rgba(22, 26, 42, 0.55);
    --glass-2: rgba(22, 26, 42, 0.72);
    --glass-3: rgba(22, 26, 42, 0.85);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-border-strong: rgba(255, 255, 255, 0.14);
    --text: #f0f3fa;
    --text-2: #a8b0c6;
    --text-3: #6a7288;
    --text-4: #40465c;
    --accent: #7b8cff;
    --accent-2: #b88cff;
    --accent-soft: rgba(123, 140, 255, 0.15);
    --accent-glow: rgba(123, 140, 255, 0.4);
    --ok-soft: rgba(23, 184, 119, 0.18);
    --warn-soft: rgba(245, 166, 35, 0.18);
    --err-soft: rgba(255, 77, 109, 0.18);
    --shadow-card:
      0 1px 3px rgba(0, 0, 0, 0.3),
      0 8px 24px -8px rgba(0, 0, 0, 0.4),
      0 24px 60px -30px rgba(0, 0, 0, 0.5);
    --shadow-card-hover:
      0 2px 6px rgba(0, 0, 0, 0.4),
      0 12px 32px -10px rgba(0, 0, 0, 0.5),
      0 32px 80px -40px rgba(0, 0, 0, 0.6);
    --shadow-pop:
      0 12px 32px -12px rgba(0, 0, 0, 0.6),
      0 32px 80px -40px rgba(0, 0, 0, 0.7);
  }

  html, body { height: 100%; width: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    font-size: 14.5px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
    position: fixed;
    inset: 0;
    letter-spacing: -0.005em;
    background: var(--bg-0);
  }

  .bg-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .bg-canvas::before {
    content: '';
    position: absolute;
    inset: -20%;
    background:
      radial-gradient(closest-side, rgba(91, 108, 255, 0.45), transparent 70%) -10% -20% / 60% 60% no-repeat,
      radial-gradient(closest-side, rgba(155, 107, 255, 0.4), transparent 70%) 110% 0% / 55% 55% no-repeat,
      radial-gradient(closest-side, rgba(34, 193, 195, 0.35), transparent 70%) 50% 120% / 70% 70% no-repeat;
    filter: blur(40px) saturate(140%);
    animation: bgFloat 24s ease-in-out infinite;
  }
  [data-theme="dark"] .bg-canvas::before {
    background:
      radial-gradient(closest-side, rgba(91, 108, 255, 0.35), transparent 70%) -10% -20% / 60% 60% no-repeat,
      radial-gradient(closest-side, rgba(155, 107, 255, 0.3), transparent 70%) 110% 0% / 55% 55% no-repeat,
      radial-gradient(closest-side, rgba(34, 193, 195, 0.25), transparent 70%) 50% 120% / 70% 70% no-repeat;
  }
  @keyframes bgFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(3%, -2%) scale(1.05); }
    66% { transform: translate(-2%, 3%) scale(1.02); }
  }

  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  /* ===== 顶栏 ===== */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    padding-top: calc(12px + env(safe-area-inset-top));
    background: var(--glass-2);
    backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    border-bottom: 1px solid var(--glass-border);
    flex-shrink: 0;
    z-index: 10;
    position: relative;
  }
  .logo {
    width: 38px; height: 38px;
    border-radius: 12px;
    background: linear-gradient(135deg, #5b6cff 0%, #9b6bff 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: 0 8px 20px -6px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.5);
    position: relative;
    overflow: hidden;
  }
  .logo::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.4), transparent 55%);
  }
  .brand { flex: 1; min-width: 0; }
  .brand h1 {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.01em;
  }
  .brand .sub {
    font-size: 11.5px;
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 1px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--warn);
    transition: .3s var(--ease);
    flex-shrink: 0;
    box-shadow: 0 0 0 3px var(--warn-soft);
  }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  .dot.err { background: var(--err); box-shadow: 0 0 0 3px var(--err-soft); }

  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 12px;
    background: var(--glass-1);
    border: 1px solid var(--glass-border);
    color: var(--text-2);
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: .2s var(--ease);
    flex-shrink: 0;
    font-family: inherit;
    position: relative;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .icon-btn:hover { background: var(--glass-3); color: var(--text); transform: translateY(-1px); }
  .icon-btn:active { transform: translateY(0) scale(.94); }
  .icon-btn.hide { display: none; }

  /* ===== 主区域 ===== */
  .main {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    position: relative;
    width: 100%;
  }
  .main::-webkit-scrollbar { width: 8px; }
  .main::-webkit-scrollbar-thumb { background: rgba(128,140,180,.25); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }

  /* ===== 网络状态提示 ===== */
  .net-banner {
    position: sticky;
    top: 0;
    z-index: 8;
    background: linear-gradient(135deg, #f5a623, #ff8e53);
    color: #fff;
    text-align: center;
    padding: 8px 16px;
    font-size: 12.5px;
    font-weight: 600;
    display: none;
    letter-spacing: .02em;
    box-shadow: 0 4px 12px -4px rgba(245,166,35,.5);
  }
  .net-banner.show { display: block; animation: slideDown .3s var(--ease); }
  @keyframes slideDown {
    from { transform: translateY(-100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* ===== 首页 ===== */
  .connect-page {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    padding: 28px 20px 48px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .glass-card {
    background: var(--glass-2);
    backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: var(--r-xl);
    padding: 22px;
    box-shadow: var(--shadow-card);
    transition: box-shadow .3s var(--ease), transform .3s var(--ease);
    position: relative;
    overflow: hidden;
  }
  .glass-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--glass-border-strong), transparent);
    pointer-events: none;
  }
  .glass-card:hover {
    box-shadow: var(--shadow-card-hover);
    transform: translateY(-2px);
  }

  .qr-hero {
    text-align: center;
    padding: 28px 22px 24px;
    animation: heroIn .6s var(--ease) both;
  }
  @keyframes heroIn {
    from { opacity: 0; transform: translateY(16px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .qr-hero .hero-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-3);
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .qr-hero .hero-title::before,
  .qr-hero .hero-title::after {
    content: '';
    width: 20px;
    height: 1px;
    background: var(--glass-border-strong);
  }

  .qr-frame {
    display: inline-block;
    padding: 14px;
    background: #fff;
    border-radius: 20px;
    box-shadow:
      0 8px 24px -8px rgba(20,30,60,.15),
      0 20px 48px -20px rgba(20,30,60,.2),
      inset 0 0 0 1px rgba(255,255,255,.5);
    transition: .3s var(--ease);
    cursor: pointer;
    position: relative;
  }
  .qr-frame:hover { transform: scale(1.02); }
  .qr-frame:active { transform: scale(.98); }
  [data-theme="dark"] .qr-frame {
    box-shadow:
      0 8px 24px -8px rgba(0,0,0,.5),
      0 20px 48px -20px rgba(0,0,0,.6),
      inset 0 0 0 1px rgba(255,255,255,.15);
  }
  .qr-frame canvas { display: block; border-radius: 8px; max-width: 100%; height: auto; }

  .my-code-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
  }
  .my-code-num {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: .18em;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-variant-numeric: tabular-nums;
    padding-left: .18em;
  }
  .my-code-hint {
    font-size: 11.5px;
    color: var(--text-3);
    margin-top: 6px;
    letter-spacing: .04em;
  }
  .qr-hero-actions {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 16px;
  }

  /* 按钮 */
  .btn {
    border: none;
    border-radius: var(--r-md);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: .25s var(--ease);
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px 18px;
    position: relative;
    overflow: hidden;
    letter-spacing: .01em;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    box-shadow: var(--shadow-accent), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .btn-primary::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.25), transparent 50%);
    pointer-events: none;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 30px -8px var(--accent-glow); }
  .btn-primary:active { transform: translateY(0) scale(.98); }
  .btn-primary:disabled {
    background: rgba(128,140,180,.2);
    color: var(--text-4);
    box-shadow: none;
    cursor: not-allowed;
    transform: none;
  }
  .btn-primary:disabled::after { display: none; }

  .btn-glass {
    background: var(--glass-1);
    border: 1px solid var(--glass-border);
    color: var(--text-2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .btn-glass:hover { background: var(--glass-3); border-color: var(--glass-border-strong); color: var(--text); transform: translateY(-1px); }
  .btn-glass:active { transform: translateY(0) scale(.98); }

  .btn-block { width: 100%; padding: 14px; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-3);
    font-size: 11.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin: 6px 0;
  }
  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--glass-border-strong), transparent);
  }

  .field { display: flex; gap: 8px; }
  .field input {
    flex: 1;
    min-width: 0;
    background: var(--glass-1);
    border: 1.5px solid var(--glass-border);
    border-radius: var(--r-md);
    padding: 13px 16px;
    color: var(--text);
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .18em;
    outline: none;
    transition: .25s var(--ease);
    font-variant-numeric: tabular-nums;
    text-align: center;
    font-family: inherit;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .field input::placeholder {
    letter-spacing: .04em;
    font-weight: 400;
    color: var(--text-4);
    font-size: 13px;
  }
  .field input:focus {
    border-color: var(--accent);
    background: var(--glass-2);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  .history-list { display: flex; flex-direction: column; gap: 6px; }
  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    border-radius: var(--r-sm);
    background: var(--glass-1);
    border: 1px solid var(--glass-border);
    cursor: pointer;
    transition: .2s var(--ease);
    font-size: 13px;
    color: var(--text-2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .history-item:hover { background: var(--glass-3); border-color: var(--glass-border-strong); transform: translateX(2px); }
  .history-item .code {
    font-family: "SF Mono", "Monaco", monospace;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: .05em;
    font-size: 13px;
  }
  .history-item .meta { flex: 1; text-align: right; font-size: 11px; color: var(--text-4); }
  .history-item .del {
    color: var(--text-4);
    font-size: 14px;
    padding: 2px 6px;
    border-radius: 6px;
    transition: .15s;
  }
  .history-item .del:hover { background: var(--err-soft); color: var(--err); }

  .card-label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-3);
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ===== 聊天 ===== */
  .chat-wrap {
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .chat {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 20px 20px 12px;
    width: 100%;
    max-width: 780px;
  }

  .sys {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-3);
    padding: 6px 0;
  }
  .sys .pill {
    background: var(--glass-1);
    border: 1px solid var(--glass-border);
    padding: 5px 14px;
    border-radius: 20px;
    display: inline-block;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .row {
    display: flex;
    gap: 8px;
    max-width: 100%;
    animation: msgIn .35s var(--ease) both;
    position: relative;
  }
  .row.me { flex-direction: row-reverse; }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .bubble-wrap { position: relative; max-width: 76%; }
  .row.me .bubble-wrap { display: flex; flex-direction: column; align-items: flex-end; }

  .bubble {
    padding: 10px 15px;
    border-radius: 18px;
    font-size: 14.5px;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-wrap;
    position: relative;
  }
  .row.them .bubble {
    background: var(--glass-2);
    border: 1px solid var(--glass-border);
    border-bottom-left-radius: 6px;
    color: var(--text);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 4px 16px -8px rgba(20,30,60,.15);
  }
  .row.me .bubble {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border-bottom-right-radius: 6px;
    box-shadow: 0 8px 20px -8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .bubble .stamp {
    display: block;
    font-size: 10.5px;
    margin-top: 4px;
    opacity: .6;
    letter-spacing: .03em;
  }
  .bubble .read-tag {
    display: inline-block;
    font-size: 10px;
    margin-left: 6px;
    opacity: .8;
  }
  .row.me .bubble .stamp { color: rgba(255,255,255,.9); }
  .row.them .bubble .stamp { color: var(--text-3); }

  .bubble-actions {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    gap: 2px;
    opacity: 0;
    transition: .18s var(--ease);
    pointer-events: none;
  }
  .row.me .bubble-actions { right: calc(100% + 8px); }
  .row.them .bubble-actions { left: calc(100% + 8px); }
  .row:hover .bubble-actions { opacity: 1; pointer-events: auto; }
  .bubble-actions button {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: var(--glass-2);
    border: 1px solid var(--glass-border);
    color: var(--text-3);
    font-size: 13px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-family: inherit;
    transition: .15s var(--ease);
  }
  .bubble-actions button:hover { background: var(--glass-3); color: var(--accent); border-color: var(--accent); }

  .file-card {
    width: 100%;
    min-width: 280px;
    max-width: 400px;
    background: var(--glass-2);
    border: 1px solid var(--glass-border);
    border-radius: var(--r-lg);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: var(--shadow-card);
    transition: .2s var(--ease);
  }
  .file-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-card-hover); }
  .row.me .file-card {
    background: linear-gradient(135deg, var(--accent-soft), rgba(155,107,255,.06));
    border-color: rgba(91,108,255,.28);
  }
  .file-head { display: flex; align-items: center; gap: 12px; }
  .file-icon {
    width: 46px; height: 46px;
    border-radius: 14px;
    background: linear-gradient(135deg, #5b6cff, #9b6bff);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    box-shadow: 0 8px 20px -8px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.35);
    position: relative;
    overflow: hidden;
  }
  .file-icon::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.3), transparent 55%);
  }
  .file-icon.img { background: linear-gradient(135deg, #f59e0b, #ef4444); box-shadow: 0 8px 20px -8px rgba(245,158,11,.4); }
  .file-icon.vid { background: linear-gradient(135deg, #ec4899, #8b5cf6); box-shadow: 0 8px 20px -8px rgba(236,72,153,.4); }
  .file-icon.aud { background: linear-gradient(135deg, #06b6d4, #3b82f6); box-shadow: 0 8px 20px -8px rgba(6,182,212,.4); }
  .file-icon.doc { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 8px 20px -8px rgba(16,185,129,.4); }
  .file-icon.zip { background: linear-gradient(135deg, #64748b, #334155); box-shadow: 0 8px 20px -8px rgba(100,116,139,.4); }

  .file-meta { flex: 1; min-width: 0; }
  .file-meta .name {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .file-meta .size {
    font-size: 11.5px;
    color: var(--text-2);
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }

  .bar {
    height: 4px;
    background: rgba(128,140,180,.15);
    border-radius: 3px;
    overflow: hidden;
  }
  .bar .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 3px;
    transition: width .25s var(--ease);
  }
  .bar .fill.done { background: linear-gradient(90deg, #17b877, #14a56a); }
  .bar .fill.paused { background: linear-gradient(90deg, #f5a623, #e09112); }

  .file-actions { display: flex; gap: 6px; }
  .btn-action {
    flex: 1;
    padding: 9px 12px;
    border-radius: var(--r-sm);
    border: none;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: .2s var(--ease);
    font-family: inherit;
    white-space: nowrap;
    letter-spacing: .01em;
  }
  .btn-action.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    box-shadow: 0 6px 16px -6px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .btn-action.primary:active { transform: scale(.97); }
  .btn-action.ghost {
    background: var(--glass-1);
    border: 1px solid var(--glass-border);
    color: var(--text-2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .btn-action.ghost:hover { background: var(--glass-3); color: var(--accent); border-color: var(--accent); }
  .btn-action.warn {
    background: var(--warn-soft);
    border: 1px solid rgba(245,166,35,.3);
    color: #b8780e;
  }
  .btn-action.danger {
    background: var(--err-soft);
    border: 1px solid rgba(255,77,109,.3);
    color: var(--err);
  }

  /* ===== 底栏 ===== */
  .composer {
    flex-shrink: 0;
    padding: 12px 20px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
    background: var(--glass-2);
    border-top: 1px solid var(--glass-border);
    backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    display: flex;
    justify-content: center;
    transition: background .3s var(--ease);
  }
  .composer-inner {
    max-width: 780px;
    width: 100%;
    display: flex;
    align-items: flex-end;
    gap: 10px;
  }
  .composer.hide { display: none; }

  .round-btn {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--glass-1);
    border: 1px solid var(--glass-border);
    color: var(--text-2);
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: .2s var(--ease);
    font-family: inherit;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .round-btn:hover { background: var(--glass-3); border-color: var(--accent); color: var(--accent); }
  .round-btn:active { transform: scale(.94); }
  .round-btn.recording {
    background: var(--err-soft);
    border-color: rgba(255,77,109,.5);
    color: var(--err);
    animation: pulse-rec 1.5s ease-in-out infinite;
  }
  @keyframes pulse-rec {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,77,109,.4); }
    50% { box-shadow: 0 0 0 8px rgba(255,77,109,0); }
  }
  .round-btn svg { width: 19px; height: 19px; }

  .composer textarea {
    flex: 1;
    min-width: 0;
    background: var(--glass-1);
    border: 1.5px solid var(--glass-border);
    border-radius: 14px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 14.5px;
    font-family: inherit;
    line-height: 1.45;
    outline: none;
    resize: none;
    max-height: 140px;
    min-height: 42px;
    transition: .25s var(--ease);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .composer textarea::placeholder { color: var(--text-4); }
  .composer textarea:focus {
    border-color: var(--accent);
    background: var(--glass-2);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  .send-btn {
    width: 42px; height: 42px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: .25s var(--ease);
    box-shadow: 0 8px 20px -6px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.35);
    position: relative;
    overflow: hidden;
    font-family: inherit;
  }
  .send-btn svg { width: 19px; height: 19px; }
  .send-btn::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.25), transparent 55%);
  }
  .send-btn:active { transform: scale(.94); }
  .send-btn:disabled { background: rgba(128,140,180,.2); color: var(--text-4); box-shadow: none; cursor: not-allowed; }
  .send-btn:disabled::after { display: none; }

  /* ===== 弹窗 ===== */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(10, 15, 30, 0.4);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s var(--ease);
  }
  .modal.show { opacity: 1; pointer-events: auto; }

  .modal-inner {
    background: var(--glass-3);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--glass-border-strong);
    border-radius: var(--r-xl);
    width: 100%;
    max-width: 1000px;
    height: 88vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: var(--shadow-pop);
    transform: scale(.95) translateY(12px);
    transition: transform .35s var(--ease-bounce);
    position: relative;
  }
  .modal-inner::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--glass-border-strong), transparent);
  }
  .modal.show .modal-inner { transform: scale(1) translateY(0); }
  .modal-inner.sm { max-width: 400px; height: auto; }
  .modal-inner.md { max-width: 520px; height: auto; }

  .modal-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--glass-border);
    flex-shrink: 0;
  }
  .modal-head .title {
    flex: 1;
    min-width: 0;
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .modal-head .title small {
    display: block;
    font-size: 11.5px;
    font-weight: 400;
    color: var(--text-3);
    margin-top: 1px;
  }

  .modal-body {
    flex: 1;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(128,140,180,.05);
    min-height: 0;
    -webkit-overflow-scrolling: touch;
  }
  .modal-body img,
  .modal-body video { max-width: 100%; max-height: 100%; display: block; }
  .modal-body audio { width: 90%; max-width: 520px; margin: 60px 20px; }
  .modal-body pre {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 24px;
    font-family: "SF Mono", "Monaco", "Consolas", monospace;
    font-size: 13px;
    line-height: 1.65;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    overflow: auto;
    align-self: stretch;
  }
  .modal-body iframe { width: 100%; height: 100%; border: none; background: #fff; }

  .modal-foot {
    padding: 12px 20px;
    border-top: 1px solid var(--glass-border);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .modal-foot .btn-action { flex: 1; padding: 11px 16px; font-size: 13.5px; }

  .qr-wrap {
    background: #fff;
    border-radius: var(--r-lg);
    padding: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    box-shadow: var(--shadow-card);
  }
  .qr-wrap canvas { display: block; max-width: 100%; height: auto; border-radius: 6px; }
  .qr-wrap .num {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .18em;
    background: linear-gradient(135deg, #5b6cff, #9b6bff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    padding-left: .18em;
  }
  .qr-wrap .tip {
    font-size: 12px;
    color: #666;
    text-align: center;
    line-height: 1.5;
  }

  #qrReader { width: 100%; min-height: 300px; background: #000; }
  #qrReader video { width: 100% !important; height: auto !important; display: block; }
  #qrReader img { display: none; }

  /* 菜单 */
  .menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 16px;
    background: var(--glass-3);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--glass-border-strong);
    border-radius: var(--r-md);
    box-shadow: var(--shadow-pop);
    min-width: 220px;
    padding: 6px;
    z-index: 100;
    opacity: 0;
    transform: translateY(-6px) scale(.97);
    pointer-events: none;
    transition: .2s var(--ease);
  }
  .menu.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: var(--r-sm);
    cursor: pointer;
    font-size: 13.5px;
    color: var(--text-2);
    transition: .15s var(--ease);
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
    font-family: inherit;
  }
  .menu-item:hover { background: var(--glass-1); color: var(--text); }
  .menu-item:disabled { opacity: .4; cursor: not-allowed; }
  .menu-item.danger { color: var(--err); }
  .menu-item.danger:hover { background: var(--err-soft); }
  .menu-sep { height: 1px; background: var(--glass-border); margin: 4px 0; }

  /* Toast */
  .toast-wrap {
    position: fixed;
    top: calc(20px + env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    align-items: center;
    width: calc(100% - 32px);
    max-width: 400px;
  }
  .toast {
    background: var(--glass-3);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--glass-border-strong);
    color: var(--text);
    padding: 11px 20px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow-pop);
    animation: toastIn .4s var(--ease-bounce) both;
    max-width: 100%;
    word-break: break-word;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-16px) scale(.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .toast.out { animation: toastOut .3s var(--ease) forwards; }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-12px) scale(.95); } }
  .toast.ok { color: var(--ok); border-color: rgba(23,184,119,.4); }
  .toast.err { color: var(--err); border-color: rgba(255,77,109,.4); }

  .history-record {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: var(--r-sm);
    background: var(--glass-1);
    border: 1px solid var(--glass-border);
    font-size: 13px;
    transition: .2s var(--ease);
  }
  .history-record:hover { background: var(--glass-3); }
  .history-record .dir {
    width: 24px; height: 24px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
  }
  .history-record .dir.up { background: var(--accent-soft); color: var(--accent); }
  .history-record .dir.down { background: var(--ok-soft); color: var(--ok); }
  .history-record .info { flex: 1; min-width: 0; }
  .history-record .info .fname {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-record .info .fmeta { font-size: 11px; color: var(--text-3); margin-top: 1px; }

  .search-bar {
    padding: 12px 20px;
    border-bottom: 1px solid var(--glass-border);
    display: none;
  }
  .search-bar.show { display: block; }
  .search-bar input {
    width: 100%;
    background: var(--glass-1);
    border: 1.5px solid var(--glass-border);
    border-radius: var(--r-md);
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .search-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

  .drop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(91,108,255,.12);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    z-index: 800;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .drop-overlay.show { display: flex; }
  .drop-box {
    background: var(--glass-3);
    border: 2px dashed var(--accent);
    border-radius: var(--r-xl);
    padding: 60px 80px;
    text-align: center;
    box-shadow: var(--shadow-pop);
    animation: dropIn .3s var(--ease-bounce) both;
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
  }
  @keyframes dropIn {
    from { opacity: 0; transform: scale(.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .drop-box .ico { font-size: 56px; margin-bottom: 16px; display: block; }
  .drop-box .t { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
  .drop-box .s { font-size: 13px; color: var(--text-3); margin-top: 6px; }

  .hide { display: none !important; }

  @media (max-width: 480px) {
    .connect-page { padding: 20px 16px 40px; gap: 14px; }
    .glass-card { padding: 18px; border-radius: var(--r-lg); }
    .qr-hero { padding: 22px 18px 20px; }
    .my-code-num { font-size: 26px; }
    .chat { padding: 16px 14px 8px; gap: 12px; }
    .composer { padding: 10px 14px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
    .bubble-wrap { max-width: 82%; }
    .bubble-actions button { width: 28px; height: 28px; }
    .modal { padding: 14px; }
    .modal-inner { height: 92vh; }
  }
</style>
</head>
<body>

<div class="bg-canvas"></div>

<div class="app" id="app">

  <header class="topbar">
    <div class="logo">🐃</div>
    <div class="brand">
      <h1>牦牛传输</h1>
      <div class="sub">
        <span class="dot" id="dot"></span>
        <span id="statusText">正在初始化…</span>
      </div>
    </div>
    <button class="icon-btn" id="btnTheme" title="切换主题" onclick="toggleTheme()">🌙</button>
    <button class="icon-btn hide" id="btnMenu" title="菜单" onclick="toggleMenu()">⋯</button>

    <div class="menu" id="menu">
      <button class="menu-item" onclick="openSearch()" id="menuSearch">🔍 搜索消息</button>
      <button class="menu-item" onclick="copyAllMessages()">📋 复制全部对话</button>
      <button class="menu-item" onclick="pasteFromClipboard()" id="menuPaste">📎 粘贴发送</button>
      <button class="menu-item" onclick="syncClipboard()" id="menuClip">📤 推送剪贴板给对方</button>
      <button class="menu-item" onclick="downloadAll()" id="menuDownload">⬇ 全部下载</button>
      <div class="menu-sep"></div>
      <button class="menu-item" onclick="toggleSound()" id="menuSound">🔔 提示音：开</button>
      <button class="menu-item" onclick="showHistory()">🕐 传输历史</button>
      <button class="menu-item" onclick="clearChat()">🗑 清空记录</button>
      <div class="menu-sep"></div>
      <button class="menu-item danger" onclick="resetAll()">⟳ 断开连接</button>
    </div>
  </header>

  <div class="net-banner" id="netBanner">⚠️ 网络已断开，正在等待恢复…</div>

  <main class="main" id="main">
    <!-- 首页 -->
    <section class="connect-page" id="connectView">

      <div class="glass-card qr-hero">
        <div class="hero-title">我的二维码</div>
        <div class="qr-frame" id="qrFrame" onclick="showQR()" title="点击放大">
          <div id="qrHolderMain"></div>
        </div>
        <div class="my-code-row">
          <span class="my-code-num" id="myCode">------</span>
        </div>
        <div class="my-code-hint">让对方扫码即可连接</div>
        <div class="qr-hero-actions">
          <button class="btn btn-glass" onclick="copyCode()">📋 复制连接码</button>
          <button class="btn btn-glass" onclick="showQR()">🔍 放大二维码</button>
        </div>
      </div>

      <div class="glass-card">
        <div class="card-label">📷 扫对方的码</div>
        <button class="btn btn-primary btn-block" onclick="openScanner()">
          <span>扫描对方二维码</span>
        </button>
      </div>

      <div class="divider">或输入连接码</div>

      <div class="glass-card">
        <div class="card-label">⌨️ 手动输入对方的连接码</div>
        <div class="field">
          <input type="text" id="peerInput" placeholder="6 位数字" inputmode="numeric" maxlength="6" autocomplete="off">
          <button class="btn btn-primary" id="btnConnect" onclick="connectPeer()">连接</button>
        </div>
      </div>

      <div class="glass-card hide" id="historySection">
        <div class="card-label">🕐 最近连接</div>
        <div class="history-list" id="historyList"></div>
      </div>
    </section>

    <div class="chat-wrap hide" id="chatWrap">
      <div class="chat" id="chatView"></div>
    </div>
  </main>

  <footer class="composer hide" id="composer">
    <div class="composer-inner">
      <button class="round-btn" id="btnAttach" title="选择文件" onclick="pickFiles()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <button class="round-btn" id="btnRecord" title="录音" onclick="recordVoice()">🎙</button>
      <textarea id="msgInput" placeholder="输入消息…（Enter 发送）" rows="1"></textarea>
      <button class="send-btn" id="btnSend" onclick="sendText()" title="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
        </svg>
      </button>
    </div>
  </footer>

</div>

<input type="file" id="fileInput" multiple style="display:none">

<!-- 预览弹窗 -->
<div class="modal" id="modal">
  <div class="modal-inner">
    <div class="modal-head">
      <div class="title" id="modalTitle">预览<small id="modalSub"></small></div>
      <button class="icon-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<!-- 二维码放大弹窗 -->
<div class="modal" id="qrModal">
  <div class="modal-inner sm">

/* ============ 内嵌二维码生成器 ============ */
(function(){
  const QRMath = (function(){
    const EXP = new Array(256), LOG = new Array(256);
    for (let i = 0; i < 8; i++) EXP[i] = 1 << i;
    for (let i = 8; i < 256; i++) EXP[i] = EXP[i-4] ^ EXP[i-5] ^ EXP[i-6] ^ EXP[i-8];
    for (let i = 0; i < 255; i++) LOG[EXP[i]] = i;
    return {
      glog: n => { if (n < 1) throw new Error('glog'); return LOG[n]; },
      gexp: n => { while (n < 0) n += 255; while (n >= 256) n -= 255; return EXP[n]; }
    };
  })();

  const QRPolynomial = function(num, shift) {
    let offset = 0;
    while (offset < num.length && num[offset] === 0) offset++;
    this.num = new Array(num.length - offset + shift);
    for (let i = 0; i < num.length - offset; i++) this.num[i] = num[i + offset];
  };
  QRPolynomial.prototype = {
    get: function(i) { return this.num[i]; },
    getLength: function() { return this.num.length; },
    multiply: function(e) {
      const num = new Array(this.getLength() + e.getLength() - 1).fill(0);
      for (let i = 0; i < this.getLength(); i++) {
        for (let j = 0; j < e.getLength(); j++) {
          num[i+j] ^= QRMath.gexp(QRMath.glog(this.get(i)) + QRMath.glog(e.get(j)));
        }
      }
      return new QRPolynomial(num, 0);
    },
    mod: function(e) {
      if (this.getLength() - e.getLength() < 0) return this;
      const ratio = QRMath.glog(this.get(0)) - QRMath.glog(e.get(0));
      const num = this.num.slice();
      for (let i = 0; i < e.getLength(); i++) {
        num[i] ^= QRMath.gexp(QRMath.glog(e.get(i)) + ratio);
      }
      return new QRPolynomial(num, 0).mod(e);
    }
  };

    [17,145,115,1,146,116],[14,74,46,21,75,47],[29,54,24,19,55,25],[11,45,15,46,46,16],
    [13,145,115,6,146,116],[14,74,46,23,75,47],[44,54,24,7,55,25],[59,46,16,1,47,17],
    [12,151,121,7,152,122],[12,75,47,26,76,48],[39,54,24,14,55,25],[22,45,15,41,46,16],
    [6,151,121,14,152,122],[6,75,47,34,76,48],[46,54,24,10,55,25],[2,45,15,64,46,16],
    [17,152,122,4,153,123],[29,74,46,14,75,47],[49,54,24,10,55,25],[24,45,15,46,46,16],
    [4,152,122,18,153,123],[13,74,46,32,75,47],[48,54,24,14,55,25],[42,45,15,32,46,16],
    [20,147,117,4,148,118],[40,75,47,7,76,48],[43,54,24,22,55,25],[10,45,15,67,46,16],
    [19,148,118,6,149,119],[18,75,47,31,76,48],[34,54,24,34,55,25],[20,45,15,61,46,16]
  ];
  function getRSBlocks(typeNumber, ecl) {
    let offset;
    switch (ecl) { case 1: offset = 0; break; case 0: offset = 1; break; case 3: offset = 2; break; case 2: offset = 3; break; default: return undefined; }
    const rsBlock = RS_BLOCK_TABLE[(typeNumber - 1) * 4 + offset];
    if (!rsBlock) throw new Error('bad rs block');
    const length = rsBlock.length / 3;
    const list = [];
    for (let i = 0; i < length; i++) {
      const count = rsBlock[i*3];
      const totalCount = rsBlock[i*3+1];
      const dataCount = rsBlock[i*3+2];
      for (let j = 0; j < count; j++) list.push({ totalCount, dataCount });
    }
    return list;
  }

  const QRUtil = {
    PATTERN_POSITION_TABLE: [
      [],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50],
      [6,30,54],[6,32,58],[6,34,62],[6,26,46,66],[6,26,48,70],[6,26,50,74],[6,30,54,78],
      [6,30,56,82],[6,30,58,86],[6,34,62,90],[6,28,50,72,94],[6,26,50,74,98],[6,30,54,78,102],
      [6,28,54,80,106],[6,32,58,84,110],[6,30,58,86,114],[6,34,62,90,118],[6,26,50,74,98,122],
      [6,30,54,78,102,126],[6,26,52,78,104,130],[6,30,56,82,108,134],[6,34,60,86,112,138],
      [6,30,58,86,114,142],[6,34,62,90,118,146],[6,30,54,78,102,126,150],[6,24,50,76,102,128,154],
      [6,28,54,80,106,132,158],[6,32,58,84,110,136,162],[6,26,54,82,110,138,166],[6,30,58,86,114,142,170]
    ],
    G15: (1<<10)|(1<<8)|(1<<5)|(1<<4)|(1<<2)|(1<<1)|(1<<0),
    G18: (1<<12)|(1<<11)|(1<<10)|(1<<9)|(1<<8)|(1<<5)|(1<<2)|(1<<0),
    G15_MASK: (1<<14)|(1<<12)|(1<<10)|(1<<4)|(1<<1),
    getBCHTypeInfo: function(data) {
      let d = data << 10;
      while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
        d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15)));
      }
      return ((data << 10) | d) ^ QRUtil.G15_MASK;
    },
    getBCHTypeNumber: function(data) {
      let d = data << 12;
      while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
        d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18)));
      }
      return (data << 12) | d;
    },
    getBCHDigit: function(data) {
      let digit = 0;
      while (data !== 0) { digit++; data >>>= 1; }
      return digit;
    },
    getPatternPosition: function(t) { return QRUtil.PATTERN_POSITION_TABLE[t - 1]; },
    getMask: function(mp, i, j) {
      switch (mp) {
        case 0: return (i + j) % 2 === 0;
        case 1: return i % 2 === 0;
        case 2: return j % 3 === 0;
        case 3: return (i + j) % 3 === 0;
        case 4: return (Math.floor(i/2) + Math.floor(j/3)) % 2 === 0;
        case 5: return (i*j) % 2 + (i*j) % 3 === 0;
        case 6: return ((i*j) % 2 + (i*j) % 3) % 2 === 0;
        case 7: return ((i*j) % 3 + (i+j) % 2) % 2 === 0;
        default: return false;
      }
    },
    getErrorCorrectPolynomial: function(len) {
      let a = new QRPolynomial([1], 0);
      for (let i = 0; i < len; i++) a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0));
      return a;
    },
    getLengthInBits: function(mode, type) {
      if (1 <= type && type < 10) {
        switch (mode) { case 1: case 2: return 8; case 4: return 8; default: return 8; }
      } else if (type < 27) {
        switch (mode) { case 1: return 10; case 2: return 16; case 4: return 10; default: return 10; }
      } else {
        switch (mode) { case 1: return 14; case 2: return 26; case 4: return 12; default: return 12; }
      }
    },
    getLostPoint: function(qr) {
      const n = qr.getModuleCount();
      let lost = 0;
      for (let row = 0; row < n; row++) {
        for (let col = 0; col < n; col++) {
          let sameCount = 0;
          const dark = qr.isDark(row, col);
          for (let r = -1; r <= 1; r++) {
            if (row + r < 0 || n <= row + r) continue;
            for (let c = -1; c <= 1; c++) {
              if (col + c < 0 || n <= col + c) continue;
              if (r === 0 && c === 0) continue;
              if (dark === qr.isDark(row + r, col + c)) sameCount++;
            }
          }
          if (sameCount > 5) lost += (3 + sameCount - 5);
        }
      }
      for (let row = 0; row < n - 1; row++) {
        for (let col = 0; col < n - 1; col++) {
          let count = 0;
          if (qr.isDark(row, col)) count++;
          if (qr.isDark(row + 1, col)) count++;
          if (qr.isDark(row, col + 1)) count++;
          if (qr.isDark(row + 1, col + 1)) count++;
          if (count === 0 || count === 4) lost += 3;
        }
      }
      let darkCount = 0;
      for (let col = 0; col < n; col++) for (let row = 0; row < n; row++) if (qr.isDark(row, col)) darkCount++;
      const ratio = Math.abs(100 * darkCount / n / n - 50) / 5;
      lost += ratio * 10;
      return lost;
    }
  };

  const QRMode = { MODE_8BIT_BYTE: 4 };
  const QRErrorCorrectLevel = { L: 1, M: 0, Q: 3, H: 2 };

  const QR8bitByte = function(data) {
    this.mode = QRMode.MODE_8BIT_BYTE;
    this.parsedData = [];
    const bytes = new TextEncoder().encode(data);
    for (let i = 0; i < bytes.length; i++) this.parsedData.push(bytes[i]);
  };
  QR8bitByte.prototype = {
    getLength: function() { return this.parsedData.length; },
    write: function(buffer) {
      for (let i = 0; i < this.parsedData.length; i++) buffer.put(this.parsedData[i], 8);
    }
  };

  const QRBitBuffer = function() { this.buffer = []; this.length = 0; };
  QRBitBuffer.prototype = {
    get: function(index) { return ((this.buffer[Math.floor(index/8)] >>> (7 - index % 8)) & 1) === 1; },
    put: function(num, length) {
      for (let i = 0; i < length; i++) this.putBit(((num >>> (length - i - 1)) & 1) === 1);
    },
    getLengthInBits: function() { return this.length; },
    putBit: function(bit) {
      const bufIndex = Math.floor(this.length / 8);
      if (this.buffer.length <= bufIndex) this.buffer.push(0);
      if (bit) this.buffer[bufIndex] |= (0x80 >>> (this.length % 8));
      this.length++;
    }
  };

  const QRCodeModel = function(typeNumber, ecl) {
    this.typeNumber = typeNumber;
    this.errorCorrectLevel = ecl;
    this.modules = null;
    this.moduleCount = 0;
    this.dataCache = null;
    this.dataList = [];
  };
  QRCodeModel.prototype = {
    addData: function(data) { this.dataList.push(new QR8bitByte(data)); this.dataCache = null; },
    isDark: function(row, col) { return this.modules[row][col]; },
    getModuleCount: function() { return this.moduleCount; },
    make: function() { this.makeImpl(false, this.getBestMaskPattern()); },
    makeImpl: function(test, maskPattern) {
      this.moduleCount = this.typeNumber * 4 + 17;
      this.modules = new Array(this.moduleCount);
      for (let row = 0; row < this.moduleCount; row++) this.modules[row] = new Array(this.moduleCount).fill(null);
      this.setupPositionProbePattern(0, 0);
      this.setupPositionProbePattern(this.moduleCount - 7, 0);
      this.setupPositionProbePattern(0, this.moduleCount - 7);
      this.setupPositionAdjustPattern();
      this.setupTimingPattern();
      this.setupTypeInfo(test, maskPattern);
      if (this.typeNumber >= 7) this.setupTypeNumber(test);
      if (this.dataCache === null) this.dataCache = QRCodeModel.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
      this.mapData(this.dataCache, maskPattern);
    },
    setupPositionProbePattern: function(row, col) {
      for (let r = -1; r <= 7; r++) {
        if (row + r <= -1 || this.moduleCount <= row + r) continue;
        for (let c = -1; c <= 7; c++) {
          if (col + c <= -1 || this.moduleCount <= col + c) continue;
          if ((0 <= r && r <= 6 && (c === 0 || c === 6)) ||
              (0 <= c && c <= 6 && (r === 0 || r === 6)) ||
              (2 <= r && r <= 4 && 2 <= c && c <= 4)) {
            this.modules[row + r][col + c] = true;
          } else {
            this.modules[row + r][col + c] = false;
          }
        }
      }
    },
    getBestMaskPattern: function() {
      let min = 0, pattern = 0;
      for (let i = 0; i < 8; i++) {
        this.makeImpl(true, i);
        const lost = QRUtil.getLostPoint(this);
        if (i === 0 || min > lost) { min = lost; pattern = i; }
      }
      return pattern;
    },
    setupTimingPattern: function() {
      for (let r = 8; r < this.moduleCount - 8; r++) {
        if (this.modules[r][6] !== null) continue;
        this.modules[r][6] = (r % 2 === 0);
      }
      for (let c = 8; c < this.moduleCount - 8; c++) {
        if (this.modules[6][c] !== null) continue;
        this.modules[6][c] = (c % 2 === 0);
      }
    },
    setupPositionAdjustPattern: function() {
      const pos = QRUtil.getPatternPosition(this.typeNumber);
      for (let i = 0; i < pos.length; i++) {
        for (let j = 0; j < pos.length; j++) {
          const row = pos[i], col = pos[j];
          if (this.modules[row][col] !== null) continue;
          for (let r = -2; r <= 2; r++) {
            for (let c = -2; c <= 2; c++) {
              if (r === -2 || r === 2 || c === -2 || c === 2 || (r === 0 && c === 0)) {
                this.modules[row + r][col + c] = true;
              } else {
                this.modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    },
    setupTypeNumber: function(test) {
      const bits = QRUtil.getBCHTypeNumber(this.typeNumber);
      for (let i = 0; i < 18; i++) {
        const mod = (!test && ((bits >> i) & 1) === 1);
        this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
      }
      for (let i = 0; i < 18; i++) {
        const mod = (!test && ((bits >> i) & 1) === 1);
        this.modules[i % 3 + this.moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    },
    setupTypeInfo: function(test, maskPattern) {
      const data = (this.errorCorrectLevel << 3) | maskPattern;
      const bits = QRUtil.getBCHTypeInfo(data);
      for (let i = 0; i < 15; i++) {
        const mod = (!test && ((bits >> i) & 1) === 1);
        if (i < 6) this.modules[i][8] = mod;
        else if (i < 8) this.modules[i + 1][8] = mod;
        else this.modules[this.moduleCount - 15 + i][8] = mod;
      }
      for (let i = 0; i < 15; i++) {
        const mod = (!test && ((bits >> i) & 1) === 1);
        if (i < 8) this.modules[8][this.moduleCount - i - 1] = mod;
        else if (i < 9) this.modules[8][15 - i - 1 + 1] = mod;
        else this.modules[8][15 - i - 1] = mod;
      }
      this.modules[this.moduleCount - 8][8] = (!test);
    },
    mapData: function(data, maskPattern) {
      let inc = -1, row = this.moduleCount - 1, bitIndex = 7, byteIndex = 0;
      for (let col = this.moduleCount - 1; col > 0; col -= 2) {
        if (col === 6) col--;
        while (true) {
          for (let c = 0; c < 2; c++) {
            if (this.modules[row][col - c] === null) {
              let dark = false;
              if (byteIndex < data.length) dark = (((data[byteIndex] >>> bitIndex) & 1) === 1);
              if (QRUtil.getMask(maskPattern, row, col - c)) dark = !dark;
              this.modules[row][col - c] = dark;
              bitIndex--;
              if (bitIndex === -1) { byteIndex++; bitIndex = 7; }
            }
          }
          row += inc;
          if (row < 0 || this.moduleCount <= row) { row -= inc; inc = -inc; break; }
        }
      }
    }
  };
  QRCodeModel.createData = function(typeNumber, ecl, dataList) {
    const rsBlocks = getRSBlocks(typeNumber, ecl);
    const buffer = new QRBitBuffer();
    for (let i = 0; i < dataList.length; i++) {
      const data = dataList[i];
      buffer.put(data.mode, 4);
      buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber));
      data.write(buffer);
    }
    let totalDataCount = 0;
    for (let i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
    if (buffer.getLengthInBits() > totalDataCount * 8) throw new Error('overflow');
    if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) buffer.put(0, 4);
    while (buffer.getLengthInBits() % 8 !== 0) buffer.putBit(false);
    while (true) {
      if (buffer.getLengthInBits() >= totalDataCount * 8) break;
      buffer.put(0xEC, 8);
      if (buffer.getLengthInBits() >= totalDataCount * 8) break;
      buffer.put(0x11, 8);
    }
    return QRCodeModel.createBytes(buffer, rsBlocks);
  };
  QRCodeModel.createBytes = function(buffer, rsBlocks) {
    let offset = 0;
    let maxDcCount = 0, maxEcCount = 0;
    const dcdata = new Array(rsBlocks.length);
    const ecdata = new Array(rsBlocks.length);
    for (let r = 0; r < rsBlocks.length; r++) {
      const dcCount = rsBlocks[r].dataCount;
      const ecCount = rsBlocks[r].totalCount - dcCount;
      maxDcCount = Math.max(maxDcCount, dcCount);
      maxEcCount = Math.max(maxEcCount, ecCount);
      dcdata[r] = new Array(dcCount);
      for (let i = 0; i < dcdata[r].length; i++) dcdata[r][i] = 0xff & buffer.buffer[i + offset];
      offset += dcCount;
      const rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
      const rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);
      const modPoly = rawPoly.mod(rsPoly);
      ecdata[r] = new Array(rsPoly.getLength() - 1);
      for (let i = 0; i < ecdata[r].length; i++) {
        const modIndex = i + modPoly.getLength() - ecdata[r].length;
        ecdata[r][i] = (modIndex >= 0) ? modPoly.get(modIndex) : 0;
      }
    }
    let totalCodeCount = 0;
    for (let i = 0; i < rsBlocks.length; i++) totalCodeCount += rsBlocks[i].totalCount;
    const data = new Array(totalCodeCount);
    let index = 0;
    for (let i = 0; i < maxDcCount; i++) for (let r = 0; r < rsBlocks.length; r++) if (i < dcdata[r].length) data[index++] = dcdata[r][i];
    for (let i = 0; i < maxEcCount; i++) for (let r = 0; r < rsBlocks.length; r++) if (i < ecdata[r].length) data[index++] = ecdata[r][i];
    return data;
  };

  function getTypeNumber(text, ecl) {
    for (let t = 1; t <= 40; t++) {
      try {
        const rsBlocks = getRSBlocks(t, ecl);
        let total = 0;
        for (let i = 0; i < rsBlocks.length; i++) total += rsBlocks[i].dataCount;
        const lenBits = QRUtil.getLengthInBits(4, t);
        if (4 + lenBits + new TextEncoder().encode(text).length * 8 <= total * 8) return t;
      } catch (e) {}
    }
    return 40;
  }

  window.YakQR = {
    render: function(text, container, size) {
      size = size || 220;
      const ecl = QRErrorCorrectLevel.M;
      const typeNumber = getTypeNumber(text, ecl);
      const qr = new QRCodeModel(typeNumber, ecl);
      qr.addData(text);
      qr.make();
      const count = qr.getModuleCount();
      const cell = Math.max(2, Math.floor(size / (count + 4)));
      const margin = Math.floor((size - cell * count) / 2);
      const actualSize = cell * count + margin * 2;
      const canvas = document.createElement('canvas');
      canvas.width = actualSize;
      canvas.height = actualSize;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, actualSize, actualSize);
      ctx.fillStyle = '#0f1220';
      for (let r = 0; r < count; r++) {
        for (let c = 0; c < count; c++) {
          if (qr.isDark(r, c)) ctx.fillRect(margin + c * cell, margin + r * cell, cell, cell);
        }
      }
      container.innerHTML = '';
      container.appendChild(canvas);
      return canvas;
    }
  };
})();

/* ============ 工具 ============ */
function setStatus(text, state) {
  els.statusText.textContent = text;
  els.dot.className = 'dot' + (state ? ' ' + state : '');
}
function genCode() {
  return String(Math.floor(100000 + Math.random() * 900000));
}
function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  els.toastWrap.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 300);
  }, 2200);
}
function vibrate(ms) {
  if (navigator.vibrate) try { navigator.vibrate(ms); } catch(e) {}
}
function playBeep() {
  if (!soundEnabled) return;
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = 880;
    o.type = 'sine';
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.05, ac.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.15);
    o.start(); o.stop(ac.currentTime + 0.18);
  } catch(e) {}
}
function copyCode() {
  if (!myCode) return;
  navigator.clipboard?.writeText(myCode).then(() => toast('已复制连接码', 'ok')).catch(() => fallbackCopy(myCode, () => toast('已复制连接码', 'ok')));
}
function fallbackCopy(text, cb) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); cb(); } catch (e) {}
  document.body.removeChild(ta);
}
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  if (bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1) + ' MB';
  return (bytes/1024/1024/1024).toFixed(2) + ' GB';
}
function formatSpeed(bps) { return formatSize(bps) + '/s'; }
function formatTime(sec) {
  sec = Math.ceil(sec);
  if (sec < 60) return sec + ' 秒';
  if (sec < 3600) return Math.floor(sec/60) + ' 分 ' + (sec%60) + ' 秒';
  return Math.floor(sec/3600) + ' 小时';
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nowStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getHours())}:${p(d.getMinutes())}`;
}
function timeAgo(t) {
  const d = Date.now() - t;
  if (d < 60000) return '刚刚';
  if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
  if (d < 86400000) return Math.floor(d / 3600000) + ' 小时前';
  return Math.floor(d / 86400000) + ' 天前';
}

/* ============ 历史 ============ */
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch(e) { return []; }
}
function saveHistory(list) {
  localStorage.setItem(LS_KEY, JSON.stringify(list.slice(0, 5)));
}
function addHistory(code) {
  let list = loadHistory().filter(x => x.code !== code);
  list.unshift({ code, time: Date.now() });
  saveHistory(list);
  renderHistory();
}
function removeHistory(code) {
  saveHistory(loadHistory().filter(x => x.code !== code));
  renderHistory();
}
function renderHistory() {
  const list = loadHistory();
  if (!list.length) { els.historySection.classList.add('hide'); return; }
  els.historySection.classList.remove('hide');
  els.historyList.innerHTML = '';
  list.forEach(item => {
    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerHTML = `<span class="code">${item.code}</span><span class="meta">${timeAgo(item.time)}</span><span class="del" title="删除">✕</span>`;
    div.onclick = e => {
      if (e.target.classList.contains('del')) { removeHistory(item.code); return; }
      els.peerInput.value = item.code;
    };
    els.historyList.appendChild(div);
  });
}

/* ============ PeerJS ============ */
function initPeer() {
  myCode = genCode();
  peer = new Peer(myCode, {
    debug: 1,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' },
      ],
    },
  });

  peer.on('open', id => {
    myCode = id;
    els.myCode.textContent = id;
    els.qrCodeText.textContent = id;
    setStatus('已就绪，等待连接', 'on');
    renderMainQR();
  });

  peer.on('connection', c => {
    if (conn && conn.open) { c.close(); return; }
    bindConn(c);
  });

  peer.on('error', err => {
    console.error(err);
    if (err.type === 'unavailable-id') { peer.destroy(); initPeer(); }
    else if (err.type === 'peer-unavailable') {
      setStatus('连接码不存在或对方不在线', 'err');
      els.btnConnect.disabled = false;
      els.btnConnect.textContent = '连接';
      toast('连接失败：对方不在线', 'err');
    } else {
      setStatus('连接异常：' + err.type, 'err');
    }
  });

  peer.on('disconnected', () => {
    setStatus('信令断开，重连中…', '');
    peer.reconnect();
  });
}

function renderMainQR() {
  if (!myCode) return;
  const base = location.origin + location.pathname;
  const url = base + '?peer=' + myCode;
  try {
    window.YakQR.render(url, els.qrHolderMain, 200);
    window.YakQR.render(url, els.qrHolderBig, 240);
  } catch (e) {
    console.error('二维码生成失败', e);
  }
}

function connectPeer() {
  const target = els.peerInput.value.trim();
  if (!/^\d{6}$/.test(target)) { toast('请输入 6 位数字连接码', 'err'); return; }
  if (target === myCode) { toast('不能连接自己', 'err'); return; }
  els.btnConnect.disabled = true;
  els.btnConnect.textContent = '连接中';
  setStatus('正在连接 ' + target + ' …', '');
  const c = peer.connect(target, { reliable: true });
  bindConn(c);
}

function bindConn(c) {
  conn = c;
  c.on('open', () => {
    isConnected = true;
    els.btnConnect.disabled = false;
    els.btnConnect.textContent = '连接';
    setStatus('已连接', 'on');
    switchToChat();
    addSys('已建立点对点连接 🔒');
    addHistory(c.peer);
    vibrate(20);
    playBeep();
    toast('连接成功', 'ok');
    conn.send(JSON.stringify({ t: 'hello', device: getDeviceName() }));
    conn.send(JSON.stringify({ t: 'read' }));
  });
  c.on('data', handleData);
  c.on('close', () => {
    isConnected = false;
    conn = null;
    setStatus('连接已断开', 'err');
    toast('连接已断开，正在返回首页…', 'err');
    setTimeout(() => {
      resetAll(true);
    }, 1200);
  });
  c.on('error', err => {
    console.error(err);
    setStatus('连接错误', 'err');
  });
}

function getDeviceName() {
  const ua = navigator.userAgent;
  if (/iPhone/i.test(ua)) return 'iPhone';
  if (/iPad/i.test(ua)) return 'iPad';
  if (/Android/i.test(ua)) return 'Android';
  if (/Mac/i.test(ua)) return 'Mac';
  if (/Windows/i.test(ua)) return 'Windows';
  if (/Linux/i.test(ua)) return 'Linux';
  return '设备';
}

/* ============ 消息 ============ */
function addSys(text) {
  const div = document.createElement('div');
  div.className = 'sys';

  els.chatView.appendChild(div);
  scrollBottom();
}

function addText(text, mine, id) {
  const time = nowStr();
  messageIndex.push({ text, time, mine, id });
  const row = document.createElement('div');
  row.className = 'row ' + (mine ? 'me' : 'them');
  row.dataset.id = id;
  row.dataset.time = Date.now();

  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';

  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  const s = document.createElement('span');
  s.className = 'stamp';
  s.textContent = time;
  if (mine) {
    const r = document.createElement('span');
    r.className = 'read-tag';
    r.dataset.readTag = '1';
    r.textContent = '';
    s.appendChild(r);
  }
  b.appendChild(s);

  const actions = document.createElement('div');
  actions.className = 'bubble-actions';
  const cp = document.createElement('button');
  cp.textContent = '📋';
  cp.title = '复制';
  cp.onclick = () => { copyText(text); };
  actions.appendChild(cp);
  if (mine) {
    const rc = document.createElement('button');
    rc.textContent = '↩';
    rc.title = '撤回（2分钟内）';
    rc.onclick = () => { recallMessage(row, id); };
    actions.appendChild(rc);
  }

  wrap.appendChild(b);
  wrap.appendChild(actions);
  row.appendChild(wrap);
  els.chatView.appendChild(row);
  scrollBottom();
  updateMenu();
}

function copyText(t) {
  navigator.clipboard?.writeText(t).then(() => toast('已复制', 'ok')).catch(() => {
    fallbackCopy(t, () => toast('已复制', 'ok'));
  });
}

function recallMessage(row, id) {
  const t = parseInt(row.dataset.time || '0');
  if (Date.now() - t > 120000) { toast('超过 2 分钟无法撤回', 'err'); return; }
  if (!isConnected || !conn) { toast('未连接', 'err'); return; }
  conn.send(JSON.stringify({ t: 'recall', id }));
  row.remove();
  const idx = messageIndex.findIndex(m => m.id === id);
  if (idx >= 0) messageIndex.splice(idx, 1);
  updateMenu();
}

function sendText() {
  const v = els.msgInput.value.trim();
  if (!v || !isConnected || !conn) return;
  const id = 'm' + Math.random().toString(36).slice(2, 8);
  conn.send(JSON.stringify({ t: 'text', v, id }));
  addText(v, true, id);
  els.msgInput.value = '';
  autoResize();
}

function autoResize() {
  const ta = els.msgInput;
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
}
els.msgInput.addEventListener('input', autoResize);
els.msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendText();
  }
});

/* ============ 数据处理 ============ */
function handleData(data) {
  if (typeof data === 'string') {
    let msg;
    try { msg = JSON.parse(data); } catch(e) { return; }
    if (msg.t === 'text') {
      addText(msg.v, false, msg.id);
      vibrate(10);
      playBeep();
    } else if (msg.t === 'hello') {
      remoteDeviceName = msg.device || '对方';
      addSys('对方设备：' + remoteDeviceName);
    } else if (msg.t === 'read') {
      document.querySelectorAll('[data-read-tag]').forEach(el => { el.textContent = '已读'; });
    } else if (msg.t === 'recall') {
      const row = els.chatView.querySelector(`[data-id="${msg.id}"]`);
      if (row) row.remove();
      const idx = messageIndex.findIndex(m => m.id === msg.id);
      if (idx >= 0) messageIndex.splice(idx, 1);
      addSys('对方撤回了一条消息');
      updateMenu();
    } else if (msg.t === 'clipboard') {
      navigator.clipboard?.writeText(msg.text).then(() => toast('已接收剪贴板内容并复制', 'ok')).catch(() => {
        addSys('对方推送了剪贴板：' + msg.text);
      });
    } else if (msg.t === 'fstart') {
      recvFile = {
        id: msg.id, name: msg.name, size: msg.size,
        mime: msg.mime || 'application/octet-stream',
        total: msg.total, chunks: new Array(msg.total),
        received: 0, gotChunks: 0,
        el: null, barEl: null, sizeEl: null,
        startTime: Date.now(),
      };
      renderRecvFile(recvFile);
    } else if (msg.t === 'fend') {
      if (recvFile && recvFile.id === msg.id) {
        finishRecv(recvFile);
        recvFile = null;
      }
    }
    return;
  }

  let buf = null;
  if (data instanceof ArrayBuffer) buf = data;
  else if (data instanceof Uint8Array) buf = data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength);
  else if (data && data.buffer instanceof ArrayBuffer) buf = data.buffer;
  if (!buf || !recvFile) return;

  try {
    const dv = new DataView(buf);
    const idLen = dv.getUint32(0);
    const idBytes = new Uint8Array(buf, 4, idLen);
    const id = new TextDecoder().decode(idBytes);
    if (id !== recvFile.id) return;
    const seq = dv.getUint32(4 + idLen);
    const chunk = buf.slice(8 + idLen);
    if (recvFile.chunks[seq]) return;
    recvFile.chunks[seq] = chunk;
    recvFile.received += chunk.byteLength;
    recvFile.gotChunks++;
    updateRecvFile(recvFile);
  } catch(e) { console.warn('块解析失败', e); }
}

/* ============ 接收 UI ============ */
function renderRecvFile(info) {
  const row = document.createElement('div');
  row.className = 'row them';
  row.innerHTML = `
    <div class="file-card">
      <div class="file-head">
        <div class="file-icon ${iconClass(info.name, info.mime)}">${getFileIcon(info.name, info.mime)}</div>
        <div class="file-meta">
          <div class="name">${escapeHtml(info.name)}</div>
          <div class="size">接收中 0%</div>
        </div>
      </div>
      <div class="bar"><div class="fill"></div></div>
    </div>`;
  els.chatView.appendChild(row);
  info.el = row;
  info.barEl = row.querySelector('.fill');
  info.sizeEl = row.querySelector('.size');
  scrollBottom();
}

function updateRecvFile(info) {
  const p = info.size ? info.received / info.size : 0;
  info.barEl.style.width = Math.min(100, p * 100).toFixed(1) + '%';
  const elapsed = (Date.now() - info.startTime) / 1000;
  const speed = elapsed > 0 ? info.received / elapsed : 0;
  const remain = speed > 0 ? (info.size - info.received) / speed : 0;
  let extra = '';
  if (speed > 0) {
    extra = ` · ${formatSpeed(speed)}`;
    if (remain > 0 && remain < 3600) extra += ` · 剩余 ${formatTime(remain)}`;
  }
  info.sizeEl.textContent = `接收中 ${(p*100).toFixed(0)}% · ${formatSize(info.received)} / ${formatSize(info.size)}${extra}`;
}

function finishRecv(info) {
  if (info.gotChunks !== info.total) {
    info.sizeEl.textContent = `接收不完整 (${info.gotChunks}/${info.total})`;
    info.barEl.classList.add('done');
    return;
  }
  const blob = new Blob(info.chunks, { type: info.mime });
  const url = URL.createObjectURL(blob);
  previewCache.set(info.id, { url, blob, name: info.name, type: info.mime, size: info.size });
  receivedFiles.push({ id: info.id, name: info.name, url, size: info.size });
  addTransferRecord({ name: info.name, size: info.size, dir: 'down' });

  info.barEl.style.width = '100%';
  info.barEl.classList.add('done');
  info.sizeEl.textContent = `已完成 · ${formatSize(info.size)}`;

  const actions = document.createElement('div');
  actions.className = 'file-actions';
  if (canPreview(info.mime, info.name)) {
    const pv = document.createElement('button');
    pv.className = 'btn-action ghost';
    pv.textContent = '👁 预览';
    pv.onclick = () => openPreview(info.id);
    actions.appendChild(pv);
  }
  const dl = document.createElement('a');
  dl.className = 'btn-action primary';
  dl.href = url;
  dl.download = info.name;
  dl.textContent = '⬇ 下载';
  actions.appendChild(dl);
  info.el.querySelector('.file-card').appendChild(actions);
  scrollBottom();
  toast('收到文件：' + info.name, 'ok');
  vibrate(15);
  playBeep();
  updateMenu();
}

/* ============ 预览判断 ============ */
function canPreview(mime, name) {
  const m = (mime || '').toLowerCase();
  const n = (name || '').toLowerCase();
  if (m.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|bmp|svg|avif|ico)$/.test(n)) return true;
  if (m.startsWith('video/') || /\.(mp4|webm|mov|m4v|ogv|mkv)$/.test(n)) return true;
  if (m.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|opus)$/.test(n)) return true;
  if (m.startsWith('text/') || m === 'application/json' || m === 'application/xml') return true;
  if (/\.(txt|md|json|xml|html|css|js|ts|jsx|tsx|py|java|c|cpp|h|go|rs|sh|yaml|yml|log|csv|ini|toml|conf|gitignore)$/.test(n)) return true;
  if (m === 'application/pdf' || /\.pdf$/.test(n)) return true;
  return false;
}
function getFileIcon(name, mime) {
  const m = (mime || '').toLowerCase();
  const n = (name || '').toLowerCase();
  if (m.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|bmp|svg|avif)$/.test(n)) return '🖼';
  if (m.startsWith('video/') || /\.(mp4|webm|mov|m4v|ogv|mkv)$/.test(n)) return '🎬';
  if (m.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|opus)$/.test(n)) return '🎵';
  if (m === 'application/pdf' || /\.pdf$/.test(n)) return '📕';
  if (/\.(zip|rar|7z|tar|gz|bz2|xz)$/.test(n)) return '🗜';
  if (m.startsWith('text/') || /\.(txt|md|json|xml|html|css|js|ts|py|java|c|cpp|go|rs|sh|yaml|yml|log|csv|ini|toml)$/.test(n)) return '📝';
  return '📄';
}
function iconClass(name, mime) {
  const m = (mime || '').toLowerCase();
  const n = (name || '').toLowerCase();
  if (m.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|bmp|svg|avif)$/.test(n)) return 'img';
  if (m.startsWith('video/') || /\.(mp4|webm|mov|m4v|ogv|mkv)$/.test(n)) return 'vid';
  if (m.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|opus)$/.test(n)) return 'aud';
  if (m === 'application/pdf' || /\.pdf$/.test(n)) return 'doc';
  if (/\.(zip|rar|7z|tar|gz|bz2|xz)$/.test(n)) return 'zip';
  if (m.startsWith('text/') || /\.(txt|md|json|xml|html|css|js|ts|py|java|c|cpp|go|rs|sh|yaml|yml|log|csv|ini|toml)$/.test(n)) return 'doc';
  return '';
}

/* ============ 预览 ============ */
function openPreview(id) {
  const item = previewCache.get(id);
  if (!item) return;
  els.modalTitle.childNodes[0].nodeValue = item.name;
  els.modalSub.textContent = `${formatSize(item.size)} · ${item.type || '未知类型'}`;
  els.modalBody.innerHTML = '';
  els.modalFoot.innerHTML = '';

  const m = (item.type || '').toLowerCase();
  const n = item.name.toLowerCase();

  if (m.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|bmp|svg|avif)$/.test(n)) {
    const img = document.createElement('img');
    img.src = item.url; img.alt = item.name;
    els.modalBody.appendChild(img);
  } else if (m.startsWith('video/') || /\.(mp4|webm|mov|m4v|ogv|mkv)$/.test(n)) {
    const v = document.createElement('video');
    v.src = item.url; v.controls = true; v.autoplay = true;
    v.playsInline = true; v.preload = 'metadata';
    els.modalBody.appendChild(v);
  } else if (m.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac|opus)$/.test(n)) {
    const a = document.createElement('audio');
    a.src = item.url; a.controls = true; a.autoplay = true;
    els.modalBody.appendChild(a);
  } else if (m === 'application/pdf' || /\.pdf$/.test(n)) {
    const ifr = document.createElement('iframe');
    ifr.src = item.url;
    els.modalBody.appendChild(ifr);
  } else if (m.startsWith('text/') || m === 'application/json' || m === 'application/xml' ||
             /\.(txt|md|json|xml|html|css|js|ts|py|java|c|cpp|go|rs|sh|yaml|yml|log|csv|ini|toml)$/.test(n)) {
    const pre = document.createElement('pre');
    pre.textContent = '加载中…';
    els.modalBody.appendChild(pre);
    item.blob.text().then(txt => {
      const MAX = 200000;
      pre.textContent = txt.length > MAX ? txt.slice(0, MAX) + `\n\n… 已截断` : txt;
    }).catch(() => { pre.textContent = '无法读取文本内容'; });
  } else {
    els.modalBody.innerHTML = '<div style="padding:60px 20px;color:var(--text-3)">该类型暂不支持预览</div>';
  }

  const dlBtn = document.createElement('a');
  dlBtn.className = 'btn-action primary';
  dlBtn.href = item.url; dlBtn.download = item.name;
  dlBtn.textContent = '⬇ 下载到本地';
  els.modalFoot.appendChild(dlBtn);
  const closeBtn = document.createElement('button');
  closeBtn.className = 'btn-action ghost';
  closeBtn.textContent = '关闭';
  closeBtn.onclick = closeModal;
  els.modalFoot.appendChild(closeBtn);

  els.modal.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  els.modal.classList.remove('show');
  const v = els.modalBody.querySelector('video');
  const a = els.modalBody.querySelector('audio');
  if (v) { v.pause(); v.src = ''; }
  if (a) { a.pause(); a.src = ''; }
  els.modalBody.innerHTML = '';
  document.body.style.overflow = '';
}
